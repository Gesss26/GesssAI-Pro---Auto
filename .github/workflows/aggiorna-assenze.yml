name: Aggiorna Assenze Venerdì

on:
  schedule:
    # Ogni venerdì alle 15:00 UTC (17:00 ora italiana, prima delle partite serali)
    - cron: '0 15 * * 5'
  workflow_dispatch:  # Permette di lanciarlo manualmente da GitHub

jobs:
  aggiorna-assenze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Verifica che l'Excel esista
        run: |
          if [ ! -f "data/Statistiche_Fantacalcio_Stagione_2026_27.xlsx" ]; then
            echo "❌ Excel non trovato in data/"
            exit 1
          fi
          echo "✅ Excel trovato"
          ls -lh data/Statistiche_Fantacalcio_Stagione_2026_27.xlsx

      - name: Genera assenze.json con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/aggiorna_assenze.py

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/assenze.json
          if git diff --cached --quiet; then
            echo "ℹ️ Nessuna modifica a assenze.json"
          else
            git commit -m "🤖 Aggiornamento assenze automatico ($(date +%Y-%m-%d))"
            git push
          fi