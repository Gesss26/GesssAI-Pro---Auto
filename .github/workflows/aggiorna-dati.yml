name: Aggiorna Dati Fantacalcio

on:
  push:
    paths:
      - 'Probabili formazioni Serie A.html'
      - 'Statistiche_Fantacalcio_Stagione_2026_27.xlsx'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0          # necessario per il rebase

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui la pipeline di parsing
        run: |
          python script/parse_formazioni.py
          python script/parse_stats.py
          python script/unifica.py

      - name: Sincronizza con il remote (rebase)
        run: git pull --rebase origin master

      - name: Commit e Push dei file aggiornati
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Aggiornamento automatico dati (HTML + Excel)"
          file_pattern: 'data/*.json'
          branch: master
