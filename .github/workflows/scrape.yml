name: Aggiornamento Dati FBref

on:
  schedule:
    # Esegue ogni giorno alle 6:00, 12:00, 18:00, 23:00 (UTC)
    - cron: '0 6,12,18,23 * * *'
  workflow_dispatch:  # Permette di eseguire manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas beautifulsoup4 openpyxl requests selenium webdriver-manager lxml
          
      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
      - name: Run scraper
        id: scraper
        continue-on-error: true
        run: |
          xvfb-run python scarica.py
          
      - name: Check if matches.json exists
        id: check_json
        run: |
          if [ -f "data/matches.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ matches.json trovato!"
            wc -l data/matches.json
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ matches.json NON trovato!"
          fi
          
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dati-calcio
          path: |
            data/matches.json
            excel/*.xlsx
            excel/*.json
            downloads/*.html
            
      - name: Commit and push if changed
        if: steps.check_json.outputs.exists == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/matches.json
          git diff --staged --quiet || (git commit -m "Aggiornamento automatico dati $(date '+%Y-%m-%d %H:%M')" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Notification
        if: always()
        run: |
          if [ "${{ steps.scraper.outcome }}" == "success" ]; then
            echo "✅ Scraping completato con successo!"
          else
            echo "⚠️ Scraping completato con errori"
          fi
