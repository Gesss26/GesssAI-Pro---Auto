name: Scraping FBref Automatico

on:
  schedule:
    # Ogni 6 ore (00:00, 06:00, 12:00, 18:00)
    - cron: '0 */6 * * *'
  # Permette di eseguire manualmente
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run scraper
        run: node -e "require('./server.js').runScraper().then(r => console.log('✅ Scraping completato:', r)).catch(e => { console.error('❌ Errore:', e); process.exit(1); })"
      
      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/matches.json
          git diff --staged --quiet || git commit -m "🔄 Aggiornamento automatico dati FBref [skip ci]"
          git push
