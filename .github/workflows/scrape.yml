name: Scrape Football Data from matchesnow.co.uk

on:
  schedule:
    # Esegui ogni giorno alle 8:00 UTC (9:00 Italia)
    - cron: '0 6 * * *'
  # Permetti esecuzione manuale
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GESSSAI_PRO_AUTO }}
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas beautifulsoup4 requests openpyxl selenium webdriver-manager
        
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      
    - name: Setup ChromeDriver
      uses: browser-actions/setup-chromedriver@v1
      
    - name: Run scraper
      run: |
        python scarica.py
      env:
        # Forza l'uso di headless per GitHub Actions
        CHROME_HEADLESS: true
        
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/matches.json excel/GesssAI_Input.xlsx excel/GesssAI_Input.json || true
        git diff --staged --quiet || git commit -m "Aggiornamento dati $(date +'%Y-%m-%d %H:%M')"
        git push
