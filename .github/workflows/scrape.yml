name: Scraping FBref (Python)

on:
  schedule:
    - cron: '0 */6 * * *'  # Ogni 6 ore
  workflow_dispatch:         # Permette di eseguire manualmente

jobs:
  scrape:
    runs-on: windows-latest  # Windows per compatibilità con il tuo script
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Installa Chrome
        run: |
          choco install googlechrome -y
          
      - name: Installa dipendenze Python
        run: |
          pip install pandas openpyxl beautifulsoup4 selenium webdriver-manager lxml python-dateutil
          
      - name: Esegui scraping
        run: |
          python scarica.py
          
      - name: Copia il JSON nella cartella data
        run: |
          Copy-Item -Path "d:\ai\excel\GesssAI_Input.json" -Destination "data\matches.json" -Force
          
      - name: Commit e push dei dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git commit -m "Aggiornamento automatico dati FBref [skip ci]" || echo "Nessuna modifica"
          git push
