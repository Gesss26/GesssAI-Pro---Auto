name: Scraping FBref Automatico

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd backend
          npm install
          cd ..
      
      - name: Run scraper
        run: |
          cd backend
          node server.js --scrape-only
      
      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/matches.json
          git diff --staged --quiet || git commit -m "🔄 Aggiornamento automatico dati FBref [skip ci]"
          git push
