<body>

  <!-- SPLASHSCREEN -->
  <div id="splashscreen">
    <div class="splash-content">

  <!-- ERROR CONTAINER (nascosto di default) -->
  <div id="error-container" style="display: none !important;">
    <div class="error-icon">⚠️</div>
    <h2>Errore di caricamento</h2>
    <div class="error-msg">
      Si è verificato un problema durante il caricamento dell'applicazione.<br>
      <span id="error-message-text">Dettagli dell'errore non disponibili.</span>
    </div>
    <div class="error-details" id="error-details-box">
      <code id="error-stack-text">Nessun dettaglio disponibile.</code>
    </div>
    <button class="btn-retry" onclick="window.location.reload()">🔄 Ricarica la pagina</button>
  </div>

  <div id="root"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var splash = document.getElementById('splashscreen');
      var root = document.getElementById('root');
      var btn = document.getElementById('splashBtn');

      // ⭐ FORZA NASCOSTO L'ERROR CONTAINER
      var err = document.getElementById('error-container');
      if (err) {
        err.classList.remove('visible');
        err.style.display = 'none';
      }

      if (splash && btn && root) {
        btn.addEventListener('click', function() {
          splash.classList.add('hidden');
          setTimeout(function() {
            splash.style.display = 'none';
            root.style.display = 'block';
            root.classList.add('visible');
          }, 800);
        });
      }
    });

    // ⭐ Disabilita la visualizzazione dell'error container da errori non critici
    window.addEventListener('error', function(e) {
      console.error('Errore globale:', e);
      // NON mostriamo l'error container — React gestisce già i propri errori
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('Promise rejection:', e);
      // NON mostriamo l'error container
    });
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ============================================================
    // CAMPIONATI ESCLUSI
    // ============================================================
    const CAMPIONATI_ESCLUSI = new Set([
      'Liga Profesional Argentina',
      'Brasileirão Serie A',
      'Chinese Super League',
      'Super League Grecia',
      'Major League Soccer',
    ]);

    const filtraCampionatiEsclusi = (arr) => {
      if (!Array.isArray(arr)) return [];
      return arr.filter(m => !CAMPIONATI_ESCLUSI.has((m.campionato || '').trim()));
    };

    // ============================================================
    // CARICAMENTO DATI
    // ============================================================
    let dataLoaded = false;

    async function loadScrapedData(forceReload = false) {
      console.log('📂 Caricamento dati da Excel...');
      try {
        if (forceReload) {
          localStorage.removeItem('ft_matches');
          localStorage.removeItem('ft_champs');
        }

        const paths = [
          'excel/GesssAI_Input.xlsx',
          'data/GesssAI_Input.xlsx',
        ];

        let excelData = null;
        for (const path of paths) {
          try {
            console.log('📂 Tentativo:', path);
            const response = await fetch(path);
            if (response.ok) {
              console.log('✅ File Excel trovato!');
              const arrayBuffer = await response.arrayBuffer();
              excelData = processExcelData(arrayBuffer);
              if (excelData) break;
            }
          } catch (e) {
            console.warn('❌ Errore:', e.message);
          }
        }

        if (excelData) return excelData;

        console.log('📂 Fallback JSON...');
        const jsonPaths = [
          'data/matches.json',
          'matches.json',
        ];
        for (const path of jsonPaths) {
          try {
            const response = await fetch(path);
            if (response.ok) {
              const data = await response.json();
              console.log('✅ JSON caricato:', data.matches?.length || 0, 'partite');
              if (data.matches) {
                const filteredMatches = filtraCampionatiEsclusi(data.matches);
                const filteredChamps = (data.championships || []).filter(c => !CAMPIONATI_ESCLUSI.has(c.name));
                localStorage.setItem('ft_matches', JSON.stringify(filteredMatches));
                localStorage.setItem('ft_champs', JSON.stringify(filteredChamps));
                dataLoaded = true;
                return { matches: filteredMatches, championships: filteredChamps };
              }
            }
          } catch (e) {
            console.warn('❌ JSON fallback:', e.message);
          }
        }
        return null;
      } catch (error) {
        console.error('❌ Errore:', error.message);
        return null;
      }
    }

    function processExcelData(arrayBuffer) {
      try {
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
        if (jsonData.length === 0) return null;

        console.log('✅ Excel caricato con', jsonData.length, 'righe');

        const matches = [];
        const championshipsSet = new Set();
        const headers = Object.keys(jsonData[0]);

        const findColumn = (keywords) => {
          for (const keyword of keywords) {
            const found = headers.find(h => h.toLowerCase().includes(keyword.toLowerCase()));
            if (found) return found;
          }
          return null;
        };

        const colCampionato = findColumn(['campionato', 'league', 'camp', 'championship']);
        const colGiornata = findColumn(['giornata', 'round', 'giorn', 'wk']);
        const colData = findColumn(['data', 'date', 'giorno']);
        const colOra = findColumn(['ora', 'time', 'orario', 'hour']);
        const colCasa = findColumn(['squadra casa', 'home', 'casa', 'home team', 'home_team']);
        const colOspite = findColumn(['squadra ospite', 'away', 'ospite', 'away team', 'away_team']);
        const colGolCasa = findColumn(['gol casa', 'home goals', 'goal casa', 'home_goals']);
        const colGolOspite = findColumn(['gol ospite', 'away goals', 'goal ospite', 'away_goals']);
        const colRisultato = findColumn(['risultato', 'result', 'score', 'ris']);
        const colStato = findColumn(['stato', 'status']);

        if (!colCampionato || !colData || !colCasa || !colOspite) {
          console.error('❌ Colonne obbligatorie non trovate');
          return null;
        }

        jsonData.forEach((row, index) => {
          const campionato = row[colCampionato]?.toString().trim() || 'Sconosciuto';
          const giornata = row[colGiornata]?.toString().trim() || 'N/A';
          const dataRaw = row[colData]?.toString().trim() || '';
          const oraRaw = row[colOra]?.toString().trim() || 'TBD';
          const casa = row[colCasa]?.toString().trim() || '';
          const ospite = row[colOspite]?.toString().trim() || '';
          if (!casa || !ospite) return;

          const dataNormalizzata = normalizeDate(dataRaw);
          if (!dataNormalizzata) return;

          let golCasa = 0, golOspite = 0, stato = 'Futura', risultato = '';

          if (colRisultato && row[colRisultato]) {
            const val = row[colRisultato].toString().trim();
            if (val) {
              const mr = val.match(/(\d+)\s*[-–:.]\s*(\d+)/);
              if (mr) {
                golCasa = parseInt(mr[1], 10);
                golOspite = parseInt(mr[2], 10);
                risultato = `${golCasa}-${golOspite}`;
                stato = 'Giocata';
              }
            }
          }

          if (!risultato && colGolCasa && row[colGolCasa] !== undefined && row[colGolCasa] !== '') {
            golCasa = parseFloat(row[colGolCasa]) || 0;
            if (colGolOspite && row[colGolOspite] !== undefined && row[colGolOspite] !== '') {
              golOspite = parseFloat(row[colGolOspite]) || 0;
              if (golCasa > 0 || golOspite > 0) {
                risultato = `${golCasa}-${golOspite}`;
                stato = 'Giocata';
              }
            }
          }

          if (colStato && row[colStato]) {
            const sv = row[colStato].toString().toLowerCase().trim();
            if (sv === 'giocata' || sv === 'played' || sv === 'finished') stato = 'Giocata';
          }

          matches.push({
            id: Math.random().toString(36).slice(2) + Date.now().toString(36) + index,
            campionato, round: giornata, data: dataNormalizzata, ora: oraRaw, casa, ospiti: ospite, stato,
            golCasa: stato === 'Giocata' ? golCasa : 0,
            golOspite: stato === 'Giocata' ? golOspite : 0,
            risultato: stato === 'Giocata' ? `${golCasa}-${golOspite}` : '',
            citta: 'N/D', _fromExcel: true
          });
          championshipsSet.add(campionato);
        });

        if (matches.length === 0) return null;

        const matchesFiltrati = filtraCampionatiEsclusi(matches);
        const championshipsFiltrati = Array.from(championshipsSet)
          .filter(name => !CAMPIONATI_ESCLUSI.has(name))
          .map(name => ({ name, importedAt: new Date().toISOString() }));

        console.log(`✅ ${matchesFiltrati.length} partite caricate (${championshipsFiltrati.length} campionati)`);

        localStorage.setItem('ft_matches', JSON.stringify(matchesFiltrati));
        localStorage.setItem('ft_champs', JSON.stringify(championshipsFiltrati));
        dataLoaded = true;

        return { matches: matchesFiltrati, championships: championshipsFiltrati };
      } catch (error) {
        console.error('❌ Errore Excel:', error.message);
        return null;
      }
    }

    // ============================================================
    // COSTANTI
    // ============================================================
    const THEMES = {
      'Scuro Blu Notte': { bg: '#05070f', surface: '#141b2e', card: '#1e2842', banner: '#2a3a5c', text: '#e8f0ff', textMuted: '#d4af37', accent: '#00f5ff', accent2: '#ff00e5', border: 'rgba(0,245,255,0.15)', tabActive: '#00f5ff' },
      'Chiaro': { bg: '#f5f7fa', surface: '#ffffff', card: '#ffffff', banner: '#e8ecf1', text: '#1a2028', textMuted: '#000000', accent: '#1976d2', accent2: '#0d47a1', border: '#cfd8dc', tabActive: '#1976d2' },
      'Tramonto': { bg: '#2c1810', surface: '#3d2817', card: '#4a3422', banner: '#5d3f2a', text: '#ffe0b2', textMuted: '#ffff00', accent: '#ff6b35', accent2: '#f7931e', border: '#6d4c41', tabActive: '#ff6b35' },
      'Ghiaccio': { bg: '#e3f2fd', surface: '#ffffff', card: '#ffffff', banner: '#bbdefb', text: '#01579b', textMuted: '#000000', accent: '#0288d1', accent2: '#01579b', border: '#90caf9', tabActive: '#0288d1' },
      'Neon': { bg: '#0a0e27', surface: '#131836', card: '#1a1f42', banner: '#24294f', text: '#00ffcc', textMuted: '#ffff00', accent: '#ff00ff', accent2: '#00ffff', border: '#2d325f', tabActive: '#ff00ff' },
      'Calcio': { bg: '#1b5e20', surface: '#2e7d32', card: '#388e3c', banner: '#2e7d32', text: '#fff', textMuted: '#ffff00', accent: '#ffc107', accent2: '#ff9800', border: '#1b5e20', tabActive: '#ffc107' },
    };

    const MAIN_TABS = ['Home', 'Palinsesto', 'Statistiche', 'Storico', 'Schedina', 'Impostazioni'];

    const CHAMPIONSHIP_COLORS = {
      'Jupiler Pro League': '#e74c3c',
      'Premier League': '#3498db', 'EFL Championship': '#6c3483',
      'Ligue 1': '#9b59b6', 'Ligue 2': '#8e44ad', 'Bundesliga': '#f39c12', '2. Bundesliga': '#e67e22',
      'Serie A': '#2ecc71', 'Serie B': '#e67e22', 'Serie C - Girone A': '#2980b9', 'Serie C - Girone B': '#27ae60',
      'Serie C - Girone C': '#c0392b', 'J1 League': '#e74c3c', 'Eerste Divisie': '#e67e22', 'Eredivisie': '#e74c3c',
      'Primeira Liga': '#34495e', 'Scottish Premiership': '#2ecc71', 'K League 1': '#3498db', 'La Liga': '#e74c3c',
      'Segunda División': '#e67e22', 'Süper Lig': '#e67e22'
    };

    const CHAMPIONSHIP_LIST = [
      'Jupiler Pro League',
      'Premier League', 'EFL Championship', 'Ligue 1', 'Ligue 2', 'Bundesliga', '2. Bundesliga', 'Serie A',
      'Serie B', 'Serie C - Girone A', 'Serie C - Girone B', 'Serie C - Girone C', 'J1 League',
      'Eerste Divisie', 'Eredivisie', 'Primeira Liga', 'Scottish Premiership', 'K League 1', 'La Liga',
      'Segunda División', 'Süper Lig'
    ];

    // ============================================================
    // FUNZIONI UTILITÀ
    // ============================================================
    const getChampColor = (champName) => {
      if (!champName) return '#95a5a6';
      for (const [key, color] of Object.entries(CHAMPIONSHIP_COLORS)) {
        if (champName.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(champName.toLowerCase())) return color;
      }
      let hash = 0;
      for (let i = 0; i < champName.length; i++) hash = champName.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 65%, 50%)`;
    };

    const normalizeDate = (dateStr) => {
      if (!dateStr) return null;
      if (typeof dateStr === 'number' || /^\d+$/.test(dateStr.toString().trim())) {
        const serial = parseInt(dateStr.toString().trim());
        const excelEpoch = new Date(1899, 11, 30);
        const date = new Date(excelEpoch.getTime() + serial * 86400000);
        return date.toISOString().slice(0, 10);
      }
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return dateStr;
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
        const parts = dateStr.split('/');
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) return date.toISOString().slice(0, 10);
      } catch (e) {}
      return dateStr;
    };

    const formatDateEU = (dateStr) => {
      if (!dateStr) return 'N/D';
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) return dateStr;
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) {
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y}`;
      }
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
        }
      } catch (e) {}
      return 'N/D';
    };

    const parseDate = (dateStr, timeStr = '00:00') => {
      if (!dateStr) return new Date(0);
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return new Date(dateStr + 'T' + (timeStr || '00:00') + ':00');
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
        const parts = dateStr.split('/');
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        let hours = 0, minutes = 0;
        if (timeStr && timeStr !== 'TBD' && timeStr !== 'N/D') {
          const tp = timeStr.split(':');
          if (tp.length >= 2) {
            hours = parseInt(tp[0], 10) || 0;
            minutes = parseInt(tp[1], 10) || 0;
          }
        }
        return new Date(year, month, day, hours, minutes);
      }
      try { return new Date(dateStr + ' ' + (timeStr || '00:00')); } catch (e) { return new Date(0); }
    };

    const getTodayStr = () => new Date().toISOString().slice(0, 10);
    const addDaysToDateStr = (dateStr, days) => {
      const date = new Date(dateStr + 'T00:00:00');
      date.setDate(date.getDate() + days);
      return date.toISOString().slice(0, 10);
    };

    const isDatePassed = (dateStr) => {
      if (!dateStr) return false;
      const normalized = normalizeDate(dateStr);
      if (!normalized) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return new Date(normalized + 'T00:00:00') < today;
    };

    const getPercentualeClasse = (valore) => {
      if (valore >= 90) return 'flag-bomb';
      if (valore >= 66.67) return 'flag-green';
      if (valore >= 33.34) return 'flag-white';
      return 'flag-red';
    };

    const getXgClasse = (valore) => {
      const num = parseFloat(valore);
      if (isNaN(num)) return 'xg-white';
      if (num >= 2) return 'xg-blue';
      if (num >= 1) return 'xg-white';
      return 'xg-red';
    };

    // ============================================================
    // TEAM LOGO
    // ============================================================
    const TeamLogo = ({ teamName, championship, size = 60, className = '' }) => {
      const [hasError, setHasError] = useState(false);
      const [tryUnderscore, setTryUnderscore] = useState(false);

      const getLeagueFolder = (champ) => {
        if (!champ) return '';
        const map = {
          'Jupiler Pro League': 'Jupiler_Pro_League',
          'Premier League': 'Premier_League', 'EFL Championship': 'Championship',
          'Ligue 1': 'Ligue_1', 'Ligue 2': 'Ligue_2', 'Bundesliga': 'Bundesliga', '2. Bundesliga': '2. Bundesliga',
          'Serie A': 'Serie_A', 'Serie B': 'Serie_B',
          'Serie C - Girone A': 'Serie_C_Girone_A', 'Serie C - Girone B': 'Serie_C_Girone_B', 'Serie C - Girone C': 'Serie_C_Girone_C',
          'J1 League': 'J1_League', 'Eredivisie': 'Eredivisie', 'Eerste Divisie': 'Eerste_Divisie',
          'Primeira Liga': 'Primeira_Liga', 'Scottish Premiership': 'Scottish_Premiership',
          'K League 1': 'K_League_1', 'La Liga': 'La_Liga', 'Segunda División': 'Segunda_Division',
          'Süper Lig': 'Super_Lig'
        };
        return map[champ] || champ.replace(/ /g, '_');
      };

      const getInitials = (name) => {
        if (!name) return '??';
        const words = name.split(' ');
        if (words.length === 1) return name.substring(0, 3).toUpperCase();
        if (words.length === 2) return (words[0][0] + words[1][0]).toUpperCase();
        return words.map(w => w[0]).join('').substring(0, 3).toUpperCase();
      };

      if (!championship || championship === 'Tutti' || hasError) {
        const initials = getInitials(teamName);
        return (
          <div className={`team-logo-fallback ${className}`} style={{
            width: size, height: size, fontSize: Math.max(size * 0.28, 8),
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            margin: '0 auto', borderRadius: '50%', background: 'var(--surface)',
            border: '2px solid var(--border)', fontWeight: 'bold', color: 'var(--accent)',
            flexShrink: 0, lineHeight: 1,
          }}>
            {initials}
          </div>
        );
      }

      const leagueFolder = getLeagueFolder(championship);
      const logoPath = `logos/${leagueFolder}/${tryUnderscore ? teamName.replace(/\s+/g, '_') + '.png' : teamName + '.png'}`;

      return (
        <img
          src={logoPath}
          alt={teamName}
          width={size}
          height={size}
          style={{
            width: size + 'px', height: size + 'px', maxWidth: size + 'px', maxHeight: size + 'px',
            objectFit: 'contain', display: 'block', borderRadius: '4px', flexShrink: 0,
          }}
          className={`team-logo ${className}`}
          onError={() => {
            if (!tryUnderscore) setTryUnderscore(true);
            else setHasError(true);
          }}
        />
      );
    };

    // ============================================================
    // FAMIGLIE GIOCATE
    // ============================================================
    const FAMIGLIE_GIOCATE = {
      gg_ng: {
        id: 'gg_ng', label: 'GG - NG', icon: '⚽',
        desc: 'Goal-Goal / No Goal',
        options: ['GG', 'NG']
      },
      fisse: { id: 'fisse', label: 'FISSE', icon: '🎯', desc: '1, X, 2', options: ['1', 'X', '2'] },
      dc: { id: 'dc', label: 'DOPPIA CHANCE', icon: '🛡️', desc: '1X, 12, X2', options: ['1X', '12', 'X2'] },
      over: { id: 'over', label: 'OVER', icon: '⬆️', desc: 'Over 1.5-4.5', options: ['Over 1.5', 'Over 2.5', 'Over 3.5', 'Over 4.5'] },
      under: { id: 'under', label: 'UNDER', icon: '⬇️', desc: 'Under 1.5-4.5', options: ['Under 1.5', 'Under 2.5', 'Under 3.5', 'Under 4.5'] },
      multigol: { id: 'multigol', label: 'MULTIGOL', icon: '📊', desc: 'Multigol', options: ['0-2', '1-3', '1-4', '2-5'] },
      dc_over: { id: 'dc_over', label: 'DC + OVER', icon: '🔗', desc: 'DC+Over', options: ['1X+O1.5', '12+O1.5', 'X2+O1.5', '1X+O2.5', '12+O2.5', 'X2+O2.5', '1X+O3.5', '12+O3.5', 'X2+O3.5', '1X+O4.5', '12+O4.5', 'X2+O4.5'] },
      dc_under: { id: 'dc_under', label: 'DC + UNDER', icon: '🔗', desc: 'DC+Under', options: ['1X+U1.5', '12+U1.5', 'X2+U1.5', '1X+U2.5', '12+U2.5', 'X2+U2.5', '1X+U3.5', '12+U3.5', 'X2+U3.5', '1X+U4.5', '12+U4.5', 'X2+U4.5'] },
      mg_casa_ospite: { id: 'mg_casa_ospite', label: 'MG CASA + OSPITE', icon: '⚔️', desc: 'MG Casa+Ospite', options: ['0-1+0-1', '0-1+0-2', '0-1+1-3', '0-1+2-5', '0-2+0-1', '0-2+0-2', '0-2+1-3', '0-2+2-5', '1-3+0-1', '1-3+0-2', '1-3+1-3', '1-3+2-5', '2-5+0-1', '2-5+0-2', '2-5+1-3', '2-5+2-5'] },
      dc_multigol: { id: 'dc_multigol', label: 'DC + MULTIGOL', icon: '🔗', desc: 'DC+MG', options: ['1X+0-2', '12+0-2', 'X2+0-2', '1X+1-3', '12+1-3', 'X2+1-3', '1X+1-4', '12+1-4', 'X2+1-4', '1X+2-5', '12+2-5', 'X2+2-5'] }
    };

    const DEFAULT_FAMIGLIE = ['dc_under', 'mg_casa_ospite', 'over'];

    // ============================================================
    // CALCOLI
    // ============================================================
    const calcolaStatsSquadra = (games, team, isHomeTeam) => {
      const total = games.length;

      if (total === 0) {
        return {
          partite: 0, vittorie: 0, pareggi: 0, sconfitte: 0,
          pctVittorie: 0, pctPareggi: 0, pctSconfitte: 0, pctNoPareggio: 0,
          pct1X: 0, pctX2: 0,
          pctOver15: 0, pctOver25: 0, pctOver35: 0, pctOver45: 0,
          pctUnder15: 0, pctUnder25: 0, pctUnder35: 0, pctUnder45: 0,
          pctGG: 0, pctNG: 0,
          pctMG01: 0, pctMG02: 0, pctMG13: 0, pctMG25: 0,
          pctMG14_Tot: 0, pctMG25_Tot: 0,
          combo1X_over15: 0, combo1X_over25: 0, combo1X_over35: 0, combo1X_over45: 0,
          combo1X_under15: 0, combo1X_under25: 0, combo1X_under35: 0, combo1X_under45: 0,
          combo12_over15: 0, combo12_over25: 0, combo12_over35: 0, combo12_over45: 0,
          combo12_under15: 0, combo12_under25: 0, combo12_under35: 0, combo12_under45: 0,
          comboX2_over15: 0, comboX2_over25: 0, comboX2_over35: 0, comboX2_over45: 0,
          comboX2_under15: 0, comboX2_under25: 0, comboX2_under35: 0, comboX2_under45: 0,
          combo1X_mg14: 0, combo1X_mg25: 0,
          combo12_mg14: 0, combo12_mg25: 0,
          comboX2_mg14: 0, comboX2_mg25: 0,
        };
      }

      let vittorie = 0, pareggi = 0, sconfitte = 0;
      let over15 = 0, over25 = 0, over35 = 0, over45 = 0;
      let gg = 0;
      let mg01 = 0, mg02 = 0, mg13 = 0, mg25 = 0;
      let mg14_tot = 0, mg25_tot = 0;
      let cnt1X = 0, cntX2 = 0, cntNoPareggio = 0;

      let combo1X_over15 = 0, combo1X_over25 = 0, combo1X_over35 = 0, combo1X_over45 = 0;
      let combo1X_under15 = 0, combo1X_under25 = 0, combo1X_under35 = 0, combo1X_under45 = 0;
      let combo12_over15 = 0, combo12_over25 = 0, combo12_over35 = 0, combo12_over45 = 0;
      let combo12_under15 = 0, combo12_under25 = 0, combo12_under35 = 0, combo12_under45 = 0;
      let comboX2_over15 = 0, comboX2_over25 = 0, comboX2_over35 = 0, comboX2_over45 = 0;
      let comboX2_under15 = 0, comboX2_under25 = 0, comboX2_under35 = 0, comboX2_under45 = 0;
      let combo1X_mg14 = 0, combo1X_mg25 = 0;
      let combo12_mg14 = 0, combo12_mg25 = 0;
      let comboX2_mg14 = 0, comboX2_mg25 = 0;

      games.forEach(g => {
        const isHome = g.casa === team;
        const tg = isHome ? g.golCasa : g.golOspite;
        const og = isHome ? g.golOspite : g.golCasa;
        const tot = g.golCasa + g.golOspite;

        const isVittoria = tg > og;
        const isPareggio = tg === og;
        const isSconfitta = tg < og;

        if (isVittoria) vittorie++;
        else if (isPareggio) pareggi++;
        else sconfitte++;

        const o15 = tot > 1.5, o25 = tot > 2.5, o35 = tot > 3.5, o45 = tot > 4.5;
        if (o15) over15++;
        if (o25) over25++;
        if (o35) over35++;
        if (o45) over45++;

        const isGG = g.golCasa > 0 && g.golOspite > 0;
        if (isGG) gg++;

        if (tg <= 1) mg01++;
        if (tg <= 2) mg02++;
        if (tg >= 1 && tg <= 3) mg13++;
        if (tg >= 2 && tg <= 5) mg25++;

        if (tot >= 1 && tot <= 4) mg14_tot++;
        if (tot >= 2 && tot <= 5) mg25_tot++;

        let is1X, isX2;
        if (isHomeTeam) {
          is1X = isVittoria || isPareggio;
          isX2 = isSconfitta || isPareggio;
        } else {
          is1X = isSconfitta || isPareggio;
          isX2 = isVittoria || isPareggio;
        }

        const is12 = isVittoria || isSconfitta;
        if (is1X) cnt1X++;
        if (isX2) cntX2++;
        if (is12) cntNoPareggio++;

        const isMG14 = tot >= 1 && tot <= 4;
        const isMG25 = tot >= 2 && tot <= 5;

        if (is1X && o15) combo1X_over15++;
        if (is1X && o25) combo1X_over25++;
        if (is1X && o35) combo1X_over35++;
        if (is1X && o45) combo1X_over45++;
        if (is1X && !o15) combo1X_under15++;
        if (is1X && !o25) combo1X_under25++;
        if (is1X && !o35) combo1X_under35++;
        if (is1X && !o45) combo1X_under45++;

        if (is12 && o15) combo12_over15++;
        if (is12 && o25) combo12_over25++;
        if (is12 && o35) combo12_over35++;
        if (is12 && o45) combo12_over45++;
        if (is12 && !o15) combo12_under15++;
        if (is12 && !o25) combo12_under25++;
        if (is12 && !o35) combo12_under35++;
        if (is12 && !o45) combo12_under45++;

        if (isX2 && o15) comboX2_over15++;
        if (isX2 && o25) comboX2_over25++;
        if (isX2 && o35) comboX2_over35++;
        if (isX2 && o45) comboX2_over45++;
        if (isX2 && !o15) comboX2_under15++;
        if (isX2 && !o25) comboX2_under25++;
        if (isX2 && !o35) comboX2_under35++;
        if (isX2 && !o45) comboX2_under45++;

        if (is1X && isMG14) combo1X_mg14++;
        if (is1X && isMG25) combo1X_mg25++;
        if (is12 && isMG14) combo12_mg14++;
        if (is12 && isMG25) combo12_mg25++;
        if (isX2 && isMG14) comboX2_mg14++;
        if (isX2 && isMG25) comboX2_mg25++;
      });

      const pct = (n) => (n / total) * 100;

      return {
        partite: total, vittorie, pareggi, sconfitte,
        pctVittorie: pct(vittorie), pctPareggi: pct(pareggi), pctSconfitte: pct(sconfitte),
        pctNoPareggio: pct(cntNoPareggio), pct1X: pct(cnt1X), pctX2: pct(cntX2),
        pctOver15: pct(over15), pctOver25: pct(over25), pctOver35: pct(over35), pctOver45: pct(over45),
        pctUnder15: 100 - pct(over15), pctUnder25: 100 - pct(over25), pctUnder35: 100 - pct(over35), pctUnder45: 100 - pct(over45),
        pctGG: pct(gg), pctNG: 100 - pct(gg),
        pctMG01: pct(mg01), pctMG02: pct(mg02), pctMG13: pct(mg13), pctMG25: pct(mg25),
        pctMG14_Tot: pct(mg14_tot), pctMG25_Tot: pct(mg25_tot),
        combo1X_over15: pct(combo1X_over15), combo1X_over25: pct(combo1X_over25), combo1X_over35: pct(combo1X_over35), combo1X_over45: pct(combo1X_over45),
        combo1X_under15: pct(combo1X_under15), combo1X_under25: pct(combo1X_under25), combo1X_under35: pct(combo1X_under35), combo1X_under45: pct(combo1X_under45),
        combo12_over15: pct(combo12_over15), combo12_over25: pct(combo12_over25), combo12_over35: pct(combo12_over35), combo12_over45: pct(combo12_over45),
        combo12_under15: pct(combo12_under15), combo12_under25: pct(combo12_under25), combo12_under35: pct(combo12_under35), combo12_under45: pct(combo12_under45),
        comboX2_over15: pct(comboX2_over15), comboX2_over25: pct(comboX2_over25), comboX2_over35: pct(comboX2_over35), comboX2_over45: pct(comboX2_over45),
        comboX2_under15: pct(comboX2_under15), comboX2_under25: pct(comboX2_under25), comboX2_under35: pct(comboX2_under35), comboX2_under45: pct(comboX2_under45),
        combo1X_mg14: pct(combo1X_mg14), combo1X_mg25: pct(combo1X_mg25),
        combo12_mg14: pct(combo12_mg14), combo12_mg25: pct(combo12_mg25),
        comboX2_mg14: pct(comboX2_mg14), comboX2_mg25: pct(comboX2_mg25),
      };
    };

    const computeMatchStats = (match, allMatches) => {
      if (!match || !allMatches) return { error: 'Dati mancanti.' };
      const homeTeam = match.casa;
      const awayTeam = match.ospiti;
      const homeGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === homeTeam || m.ospiti === homeTeam));
      const awayGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === awayTeam || m.ospiti === awayTeam));
      if (homeGames.length === 0 || awayGames.length === 0) return { error: 'Dati insufficienti.' };

      const homeStats = calcolaStatsSquadra(homeGames, homeTeam, true);
      const awayStats = calcolaStatsSquadra(awayGames, awayTeam, false);
      const media = (a, b) => (a + b) / 2;

      return {
        p1: homeStats.pctVittorie, pX: media(homeStats.pctPareggi, awayStats.pctPareggi), p2: awayStats.pctVittorie,
        p1X: homeStats.pct1X, pX2: awayStats.pctX2, p12: media(homeStats.pctNoPareggio, awayStats.pctNoPareggio),
        pOver15: media(homeStats.pctOver15, awayStats.pctOver15), pOver25: media(homeStats.pctOver25, awayStats.pctOver25),
        pOver35: media(homeStats.pctOver35, awayStats.pctOver35), pOver45: media(homeStats.pctOver45, awayStats.pctOver45),
        pUnder15: media(homeStats.pctUnder15, awayStats.pctUnder15), pUnder25: media(homeStats.pctUnder25, awayStats.pctUnder25),
        pUnder35: media(homeStats.pctUnder35, awayStats.pctUnder35), pUnder45: media(homeStats.pctUnder45, awayStats.pctUnder45),
        pGG: media(homeStats.pctGG, awayStats.pctGG), pNG: media(homeStats.pctNG, awayStats.pctNG),
        homeMG: { '0-1': homeStats.pctMG01, '0-2': homeStats.pctMG02, '1-3': homeStats.pctMG13, '2-5': homeStats.pctMG25 },
        awayMG: { '0-1': awayStats.pctMG01, '0-2': awayStats.pctMG02, '1-3': awayStats.pctMG13, '2-5': awayStats.pctMG25 },
        mgTot: { '1-4': media(homeStats.pctMG14_Tot, awayStats.pctMG14_Tot), '2-5': media(homeStats.pctMG25_Tot, awayStats.pctMG25_Tot) },
        homeStats, awayStats, homeGames, awayGames, homeTeam, awayTeam,
      };
    };

    const getGiocataPct = (giocata, stats, homeMG, awayMG, mgTot) => {
      if (!stats || stats.error) return 0;
      const { homeStats, awayStats } = stats;
      if (!homeStats || !awayStats) return 0;
      const media = (a, b) => (a + b) / 2;

      if (giocata === 'GG') return Math.round(media(homeStats.pctGG, awayStats.pctGG));
      if (giocata === 'NG') return Math.round(media(homeStats.pctNG, awayStats.pctNG));
      if (giocata === '1') return Math.round(homeStats.pctVittorie);
      if (giocata === 'X') return Math.round(media(homeStats.pctPareggi, awayStats.pctPareggi));
      if (giocata === '2') return Math.round(awayStats.pctVittorie);
      if (giocata === '1X') return Math.round(homeStats.pct1X);
      if (giocata === 'X2') return Math.round(awayStats.pctX2);
      if (giocata === '12') return Math.round(media(homeStats.pctNoPareggio, awayStats.pctNoPareggio));
      if (giocata === 'Over 1.5') return Math.round(media(homeStats.pctOver15, awayStats.pctOver15));
      if (giocata === 'Over 2.5') return Math.round(media(homeStats.pctOver25, awayStats.pctOver25));
      if (giocata === 'Over 3.5') return Math.round(media(homeStats.pctOver35, awayStats.pctOver35));
      if (giocata === 'Over 4.5') return Math.round(media(homeStats.pctOver45, awayStats.pctOver45));
      if (giocata === 'Under 1.5') return Math.round(media(homeStats.pctUnder15, awayStats.pctUnder15));
      if (giocata === 'Under 2.5') return Math.round(media(homeStats.pctUnder25, awayStats.pctUnder25));
      if (giocata === 'Under 3.5') return Math.round(media(homeStats.pctUnder35, awayStats.pctUnder35));
      if (giocata === 'Under 4.5') return Math.round(media(homeStats.pctUnder45, awayStats.pctUnder45));
      if (giocata === '0-2') return Math.round(media(homeStats.pctMG02, awayStats.pctMG02));
      if (giocata === '1-3') return Math.round(media(homeStats.pctMG13, awayStats.pctMG13));
      if (giocata === '1-4') return Math.round(media(homeStats.pctMG14_Tot, awayStats.pctMG14_Tot));
      if (giocata === '2-5') return Math.round(media(homeStats.pctMG25, awayStats.pctMG25));

      if (giocata === '1X+O1.5') return Math.round(homeStats.combo1X_over15);
      if (giocata === '1X+O2.5') return Math.round(homeStats.combo1X_over25);
      if (giocata === '1X+O3.5') return Math.round(homeStats.combo1X_over35);
      if (giocata === '1X+O4.5') return Math.round(homeStats.combo1X_over45);
      if (giocata === 'X2+O1.5') return Math.round(awayStats.comboX2_over15);
      if (giocata === 'X2+O2.5') return Math.round(awayStats.comboX2_over25);
      if (giocata === 'X2+O3.5') return Math.round(awayStats.comboX2_over35);
      if (giocata === 'X2+O4.5') return Math.round(awayStats.comboX2_over45);
      if (giocata === '12+O1.5') return Math.round(media(homeStats.combo12_over15, awayStats.combo12_over15));
      if (giocata === '12+O2.5') return Math.round(media(homeStats.combo12_over25, awayStats.combo12_over25));
      if (giocata === '12+O3.5') return Math.round(media(homeStats.combo12_over35, awayStats.combo12_over35));
      if (giocata === '12+O4.5') return Math.round(media(homeStats.combo12_over45, awayStats.combo12_over45));

      if (giocata === '1X+U1.5') return Math.round(homeStats.combo1X_under15);
      if (giocata === '1X+U2.5') return Math.round(homeStats.combo1X_under25);
      if (giocata === '1X+U3.5') return Math.round(homeStats.combo1X_under35);
      if (giocata === '1X+U4.5') return Math.round(homeStats.combo1X_under45);
      if (giocata === 'X2+U1.5') return Math.round(awayStats.comboX2_under15);
      if (giocata === 'X2+U2.5') return Math.round(awayStats.comboX2_under25);
      if (giocata === 'X2+U3.5') return Math.round(awayStats.comboX2_under35);
      if (giocata === 'X2+U4.5') return Math.round(awayStats.comboX2_under45);
      if (giocata === '12+U1.5') return Math.round(media(homeStats.combo12_under15, awayStats.combo12_under15));
      if (giocata === '12+U2.5') return Math.round(media(homeStats.combo12_under25, awayStats.combo12_under25));
      if (giocata === '12+U3.5') return Math.round(media(homeStats.combo12_under35, awayStats.combo12_under35));
      if (giocata === '12+U4.5') return Math.round(media(homeStats.combo12_under45, awayStats.combo12_under45));

      if (giocata === '1X+0-2') return Math.round(homeStats.combo1X_mg02 || 0);
      if (giocata === '1X+1-3') return Math.round(homeStats.combo1X_mg13 || 0);
      if (giocata === '1X+1-4') return Math.round(homeStats.combo1X_mg14);
      if (giocata === '1X+2-5') return Math.round(homeStats.combo1X_mg25);
      if (giocata === 'X2+0-2') return Math.round(awayStats.comboX2_mg02 || 0);
      if (giocata === 'X2+1-3') return Math.round(awayStats.comboX2_mg13 || 0);
      if (giocata === 'X2+1-4') return Math.round(awayStats.comboX2_mg14);
      if (giocata === 'X2+2-5') return Math.round(awayStats.comboX2_mg25);
      if (giocata === '12+0-2') return Math.round(media(homeStats.combo12_mg02 || 0, awayStats.combo12_mg02 || 0));
      if (giocata === '12+1-3') return Math.round(media(homeStats.combo12_mg13 || 0, awayStats.combo12_mg13 || 0));
      if (giocata === '12+1-4') return Math.round(media(homeStats.combo12_mg14, awayStats.combo12_mg14));
      if (giocata === '12+2-5') return Math.round(media(homeStats.combo12_mg25, awayStats.combo12_mg25));

      if (giocata.includes('+') && !giocata.includes('X') && !giocata.includes('O') && !giocata.includes('U')) {
        const parts = giocata.split('+');
        if (parts.length === 2) {
          const getMGPct = (range, whichStats) => {
            if (range === '0-1') return whichStats.pctMG01;
            if (range === '0-2') return whichStats.pctMG02;
            if (range === '1-3') return whichStats.pctMG13;
            if (range === '1-4') return whichStats.pctMG14_Tot;
            if (range === '2-5') return whichStats.pctMG25;
            return 0;
          };
          const pctCasa = getMGPct(parts[0], homeStats);
          const pctOspite = getMGPct(parts[1], awayStats);
          return Math.round((pctCasa + pctOspite) / 2);
        }
      }
      return 0;
    };

    const getBestBetForFamily = (familyId, stats, homeRange, awayRange, homeMG, awayMG, mgTot) => {
      if (!stats || stats.error) return null;
      const family = FAMIGLIE_GIOCATE[familyId];
      if (!family) return null;

      let best = null, bestPct = -1, bestLabel = '';
      family.options.forEach(opt => {
        let pct = getGiocataPct(opt, stats, homeMG, awayMG, mgTot);
        if (pct > bestPct) { bestPct = pct; best = opt; bestLabel = opt; }
      });

      if (best && bestPct > 0) {
        return { giocata: best, label: bestLabel, pct: bestPct, isBomb: bestPct >= 90 };
      }
      return null;
    };

    const calcolaGG_NG = (stats) => {
      if (!stats || stats.error) return null;
      const { homeStats, awayStats } = stats;
      if (!homeStats || !awayStats) return null;

      const pctGG = Math.round((homeStats.pctGG + awayStats.pctGG) / 2);
      const pctNG = Math.round((homeStats.pctNG + awayStats.pctNG) / 2);
      const migliore = pctGG > pctNG ? 'GG' : 'NG';
      const pctMigliore = Math.max(pctGG, pctNG);

      return {
        giocata: migliore, label: migliore === 'GG' ? 'Goal-Goal' : 'No Goal',
        pct: pctMigliore, isBomb: pctMigliore >= 90,
        familyId: 'gg_ng', familyLabel: 'GG - NG', familyIcon: '⚽',
        gg: pctGG, ng: pctNG,
      };
    };

    const getMultigolRange = (teamName, allMatches) => {
      const matches = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName));
      if (matches.length === 0) return { label: 'N/A', pct: 0, range: 'default', details: [] };

      const goals = matches.map(m => (m.casa === teamName) ? m.golCasa : m.golOspite);
      const total = goals.length;

      const r01 = goals.filter(g => g <= 1).length / total * 100;
      const r02 = goals.filter(g => g <= 2).length / total * 100;
      const r13 = goals.filter(g => g >= 1 && g <= 3).length / total * 100;
      const r24 = goals.filter(g => g >= 2 && g <= 4).length / total * 100;
      const r25 = goals.filter(g => g >= 2 && g <= 5).length / total * 100;
      const r36 = goals.filter(g => g >= 3 && g <= 6).length / total * 100;

      const ranges = [
        { label: '0-1', pct: r01, range: '01' },
        { label: '0-2', pct: r02, range: '02' },
        { label: '1-3', pct: r13, range: '13' },
        { label: '2-4', pct: r24, range: '24' },
        { label: '2-5', pct: r25, range: '25' },
        { label: '3-6', pct: r36, range: '36' },
      ];
      const best = ranges.reduce((a, b) => a.pct > b.pct ? a : b);
      return {
        label: best.label, pct: Math.round(best.pct), range: best.range,
        details: ranges.map(r => ({ ...r, pct: Math.round(r.pct) }))
      };
    };

    const get12Under45 = (allMatches, homeTeam, awayTeam) => {
      const homeGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === homeTeam || m.ospiti === homeTeam));
      const awayGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === awayTeam || m.ospiti === awayTeam));

      const calcPct = (games, team) => {
        if (games.length === 0) return 0;
        let count = 0;
        games.forEach(g => {
          const isHome = g.casa === team;
          const tg = isHome ? g.golCasa : g.golOspite;
          const og = isHome ? g.golOspite : g.golCasa;
          const tot = g.golCasa + g.golOspite;
          if (tg !== og && tot < 4.5) count++;
        });
        return (count / games.length) * 100;
      };

      return (calcPct(homeGames, homeTeam) + calcPct(awayGames, awayTeam)) / 2;
    };

    const calcFormAndStats = (matches, teamName) => {
      const played = matches
        .filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName))
        .sort((a, b) => parseDate(b.data, b.ora) - parseDate(a.data, a.ora))
        .slice(0, 5);
      let form = '', points = 0, golFatti = 0, golSubiti = 0;
      played.forEach(m => {
        const isHome = m.casa === teamName;
        const tg = isHome ? m.golCasa : m.golOspite;
        const og = isHome ? m.golOspite : m.golCasa;
        golFatti += tg; golSubiti += og;
        if (tg > og) { form += 'V'; points += 3; }
        else if (tg === og) { form += 'P'; points += 1; }
        else form += 'S';
      });
      return {
        form: form || '-----',
        pct: played.length ? Math.round((points / (played.length * 3)) * 100) : 50,
        golFatti, golSubiti,
        mediaGolFatti: played.length ? (golFatti / played.length).toFixed(1) : 0,
        mediaGolSubiti: played.length ? (golSubiti / played.length).toFixed(1) : 0,
        partite: played.length
      };
    };

    const formatGiocataLabel = (familyId, label) => {
      if (!label) return '—';
      if (label.startsWith('Over '))  return label;
      if (label.startsWith('Under ')) return label.replace('.', ',');
      if (familyId === 'multigol') return label;
      if (familyId === 'mg_casa_ospite') {
        const parts = label.split('+');
        if (parts.length === 2) return `MG ${parts[0]} Casa + MG ${parts[1]} Ospite`;
      }
      if (familyId === 'dc_multigol') {
        const parts = label.split('+');
        if (parts.length === 2) return `${parts[0]} + ${parts[1]}`;
      }
      if (familyId === 'dc_under') {
        const parts = label.split('+');
        if (parts.length === 2) {
          const uLabel = parts[1].replace('U', 'Under ').replace('.', ',');
          return `${parts[0]} + ${uLabel}`;
        }
      }
      if (familyId === 'dc_over') {
        const parts = label.split('+');
        if (parts.length === 2) {
          const oLabel = parts[1].replace('O', 'Over ').replace('.', ',');
          return `${parts[0]} + ${oLabel}`;
        }
      }
      if (familyId === 'gg_ng') {
        if (label === 'Goal-Goal') return 'GG';
        if (label === 'No Goal') return 'NG';
      }
      return label;
    };

    // ============================================================
    // ESPOSIZIONE GLOBALE
    // ============================================================
    window.computeMatchStats = computeMatchStats;
    window.getGiocataPct = getGiocataPct;
    window.getBestBetForFamily = getBestBetForFamily;
    window.getPercentualeClasse = getPercentualeClasse;
    window.getMultigolRange = getMultigolRange;
    window.calcFormAndStats = calcFormAndStats;
    window.getChampColor = getChampColor;
    window.formatDateEU = formatDateEU;
    window.formatGiocataLabel = formatGiocataLabel;
    window.normalizeDate = normalizeDate;
    window.parseDate = parseDate;
    window.getTodayStr = getTodayStr;
    window.addDaysToDateStr = addDaysToDateStr;
    window.isDatePassed = isDatePassed;
    window.getXgClasse = getXgClasse;
    window.FAMIGLIE_GIOCATE = FAMIGLIE_GIOCATE;
    window.DEFAULT_FAMIGLIE = DEFAULT_FAMIGLIE;
    window.TeamLogo = TeamLogo;
    window.THEMES = THEMES;
    window.CHAMPIONSHIP_LIST = CHAMPIONSHIP_LIST;
    window.CHAMPIONSHIP_COLORS = CHAMPIONSHIP_COLORS;
    window.CAMPIONATI_ESCLUSI = CAMPIONATI_ESCLUSI;
    window.filtraCampionatiEsclusi = filtraCampionatiEsclusi;
    window.calcolaGG_NG = calcolaGG_NG;
    window.get12Under45 = get12Under45;

    console.log('✅ Funzioni globali esposte v9');

    // ============================================================
    // LOAD/SAVE STATE
    // ============================================================
    const loadState = () => {
      try {
        const localData = {
          championships: JSON.parse(localStorage.getItem('ft_champs') || '[]'),
          matches: JSON.parse(localStorage.getItem('ft_matches') || '[]'),
          theme: JSON.parse(localStorage.getItem('ft_theme') || '"Scuro Blu Notte"'),
          customTheme: JSON.parse(localStorage.getItem('ft_custom_theme') || 'null'),
          selectedFamiglie: JSON.parse(localStorage.getItem('ft_selected_famiglie') || '["dc_under","mg_casa_ospite","over"]'),
        };
        localData.matches = filtraCampionatiEsclusi(localData.matches);
        localData.championships = localData.championships.filter(c => !CAMPIONATI_ESCLUSI.has(c.name));

        if (localData.matches.length === 0) {
          loadScrapedData().then(data => {
            if (data && data.matches && data.matches.length > 0 && window.updateAppData) {
              window.updateAppData(data);
            }
          });
        }
        return localData;
      } catch (e) {
        return {
          championships: [], matches: [],
          theme: 'Scuro Blu Notte', customTheme: null,
          selectedFamiglie: ['dc_under', 'mg_casa_ospite', 'over']
        };
      }
    };

    const saveState = (data) => {
      localStorage.setItem('ft_champs', JSON.stringify(data.championships));
      localStorage.setItem('ft_matches', JSON.stringify(data.matches));
      localStorage.setItem('ft_theme', JSON.stringify(data.theme));
      localStorage.setItem('ft_custom_theme', JSON.stringify(data.customTheme));
      localStorage.setItem('ft_selected_famiglie', JSON.stringify(data.selectedFamiglie || ['dc_under', 'mg_casa_ospite', 'over']));
    };

    // ============================================================
    // CLOCK
    // ============================================================
    const Clock = () => {
      const [now, setNow] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);
      const formatDate = (d) => {
        const days = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
        const months = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
        return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
      };
      const formatTime = (d) => d.toTimeString().slice(0, 8);
      return (
        <div className="clock">
          <div className="clock-date">{formatDate(now)}</div>
          <div className="clock-time">{formatTime(now)}</div>
        </div>
      );
    };

    // ============================================================
    // APP COMPONENT
    // ============================================================
    function App() {
      const initial = loadState();
      const [tab, setTab] = useState('Home');
      const [championships, setChampionships] = useState(initial.championships);
      const [matches, setMatches] = useState(initial.matches);
      const [theme, setTheme] = useState(initial.theme);
      const [customTheme, setCustomTheme] = useState(initial.customTheme || THEMES['Scuro Blu Notte']);
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);
      const [weatherCache, setWeatherCache] = useState({});
      const [selectedMatchId, setSelectedMatchId] = useState(null);
      const [viewMode, setViewMode] = useState(() => localStorage.getItem('ft_view_mode') || 'pc');
      const [selectedFamiglie, setSelectedFamiglie] = useState(initial.selectedFamiglie || ['dc_under', 'mg_casa_ospite', 'over']);
      const [fontSize, setFontSize] = useState(() => {
        const saved = localStorage.getItem('ft_font_size');
        return saved ? parseInt(saved) : 100;
      });

      useEffect(() => {
        if (window.QuoteManager && typeof window.QuoteManager.initAutoDownload === 'function') {
          window.QuoteManager.initAutoDownload();
        }
      }, []);

      useEffect(() => {
        try {
          const loadData = async () => {
            const data = await loadScrapedData();
            if (data && data.matches && data.matches.length > 0) {
              setMatches(data.matches);
              setChampionships(data.championships || []);
              console.log(`✅ ${data.matches.length} partite caricate!`);
            }
          };
          loadData();
        } catch (e) {
          console.error('Errore caricamento:', e);
        }
      }, []);

      useEffect(() => {
        if (!selectedMatchId) return;
        const selectedMatch = matches.find(m => m.id === selectedMatchId);
        if (!selectedMatch) return;

        const weatherKey = `${selectedMatch.campionato}_${selectedMatch.data}`;
        if (weatherCache[weatherKey]) return;

        if (typeof window.fetchWeatherForMatch === 'function') {
          window.fetchWeatherForMatch(selectedMatch).then(weather => {
            if (weather) setWeatherCache(prev => ({ ...prev, [weatherKey]: weather }));
          }).catch(e => console.warn('❌ Errore meteo:', e));
        }
      }, [selectedMatchId, matches]);

      const updateDataFromScraper = (data) => {
        if (data && data.matches && data.matches.length > 0) {
          const filteredMatches = filtraCampionatiEsclusi(data.matches);
          const filteredChamps = (data.championships || []).filter(c => !CAMPIONATI_ESCLUSI.has(c.name));
          setMatches(filteredMatches);
          setChampionships(filteredChamps);
          saveState({ championships: filteredChamps, matches: filteredMatches, theme, customTheme, selectedFamiglie });
          showAlert('success', `✅ Aggiornato con ${filteredMatches.length} partite!`);
        }
      };

      window.updateAppData = updateDataFromScraper;

      useEffect(() => {
        saveState({ championships, matches, theme, customTheme, selectedFamiglie });
      }, [championships, matches, theme, customTheme, selectedFamiglie]);

      useEffect(() => {
        const t = theme === 'Custom' ? customTheme : THEMES[theme] || THEMES['Scuro Blu Notte'];
        const root = document.documentElement;
        Object.entries(t).forEach(([k, v]) => {
          root.style.setProperty(`--${k.replace(/([A-Z])/g, '-$1').toLowerCase()}`, v);
        });
      }, [theme, customTheme]);

      useEffect(() => {
        document.documentElement.style.fontSize = (fontSize / 100 * 16) + 'px';
        localStorage.setItem('ft_font_size', fontSize.toString());
      }, [fontSize]);

      const showAlert = (type, text) => {
        setMessage({ type, text });
        setTimeout(() => setMessage(null), 5000);
      };

      const selectMatch = (matchId) => {
        setSelectedMatchId(matchId);
        setTab('Statistiche');
      };

      const renderAppContent = () => (
        <div className="app-shell">
          <div className="header">
            <div className="header-left"></div>
            <div className="header-center">
              <div className="app-name">GesssAI-Pro</div>
              <div className="subtitle">v4.0 • Football Trader • 2026</div>
            </div>
            <Clock />
          </div>

          <div className="tabs-nav">
            {MAIN_TABS.map(t => (
              <button key={t} className={tab === t ? 'active' : ''} onClick={() => setTab(t)}>
                {t === 'Home' && '🏠 '}
                {t === 'Palinsesto' && '📅 '}
                {t === 'Statistiche' && '📊 '}
                {t === 'Storico' && '📜 '}
                {t === 'Schedina' && '🎯 '}
                {t === 'Impostazioni' && '⚙️ '}
                {t}
              </button>
            ))}
          </div>

          <div className="container">
            {window.QuoteManager && window.QuoteManager.BannerAlertPDF && (
              <window.QuoteManager.BannerAlertPDF />
            )}

            {message && <div className={`alert alert-${message.type}`}>{message.text}</div>}
            {loading && <div className="alert alert-info">⏳ Elaborazione in corso...</div>}

            {tab === 'Home' && (
              <div>
                {window.HomeComponent ? (
                  <window.HomeComponent
                    matches={matches}
                    championships={championships}
                    onSelectMatch={selectMatch}
                    setTab={setTab}
                    selectedFamiglie={selectedFamiglie}
                    weatherCache={weatherCache}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Home...</div>
                )}
              </div>
            )}

            {tab === 'Palinsesto' && (
              <div>
                {window.PalinsestoComponent ? (
                  <window.PalinsestoComponent
                    matches={matches}
                    selectedFamiglie={selectedFamiglie}
                    onSelectMatch={selectMatch}
                    weatherCache={weatherCache}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Palinsesto...</div>
                )}
              </div>
            )}

            {tab === 'Statistiche' && (
              <div>
                {window.StatisticheComponent ? (
                  <window.StatisticheComponent
                    matches={matches}
                    selectedMatchId={selectedMatchId}
                    selectedFamiglie={selectedFamiglie}
                    weatherCache={weatherCache}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Statistiche...</div>
                )}
              </div>
            )}

            {tab === 'Storico' && (
              <div>
                {window.StoricoComponent ? (
                  <window.StoricoComponent
                    matches={matches}
                    championships={championships}
                    onSelectMatch={selectMatch}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Storico...</div>
                )}
              </div>
            )}

            {tab === 'Schedina' && (
              <div>
                {window.SchedinaComponent ? (
                  <window.SchedinaComponent
                    matches={matches}
                    championships={championships}
                    selectedFamiglie={selectedFamiglie}
                    onSelectMatch={selectMatch}
                    showAlert={showAlert}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Schedina...</div>
                )}
              </div>
            )}

            {tab === 'Impostazioni' && (
              <div>
                {window.ImpostazioniComponent ? (
                  <window.ImpostazioniComponent
                    matches={matches}
                    setMatches={setMatches}
                    championships={championships}
                    setChampionships={setChampionships}
                    theme={theme}
                    setTheme={setTheme}
                    customTheme={customTheme}
                    setCustomTheme={setCustomTheme}
                    loading={loading}
                    setLoading={setLoading}
                    showAlert={showAlert}
                    viewMode={viewMode}
                    setViewMode={setViewMode}
                    fontSize={fontSize}
                    setFontSize={setFontSize}
                    selectedFamiglie={selectedFamiglie}
                    setSelectedFamiglie={setSelectedFamiglie}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Impostazioni...</div>
                )}
              </div>
            )}
          </div>

          <div className="disclaimer-footer">
            <div style={{ display: 'flex', gap: '12px', alignItems: 'flex-start', flexWrap: 'wrap' }}>
              <span style={{ fontSize: '24px' }}>⚠️</span>
              <div style={{ flex: 1 }}>
                <p style={{ margin: '0 0 6px 0' }}>
                  <strong>⚠️ Disclaimer - Utilizzo in Centro Scommesse</strong>
                </p>
                <p style={{ margin: '0 0 4px 0' }}>
                  Questa applicazione fornisce analisi statistiche a <strong>solo scopo informativo</strong>. I dati provengono da <strong>file caricati dall'utente</strong> (XLSX/CSV). Le percentuali e i pronostici sono <strong>elaborazioni matematiche non vincolanti</strong>.
                </p>
                <p style={{ margin: '0 0 4px 0' }}>
                  <span className="highlight">⚠️ Le scommesse comportano rischi finanziari. Gioca responsabilmente.</span>
                </p>
                <p style={{ margin: '0', fontSize: '10px', color: 'var(--text-dim)' }}>
                  I loghi e i nomi delle squadre sono di proprietà dei rispettivi titolari.
                </p>
              </div>
            </div>
          </div>

          <button
            className="home-btn-overlay"
            onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
            title="Torna su"
          >
            🏠
          </button>
        </div>
      );

      if (viewMode === 'mobile') {
        return (
          <div style={{
            display: 'flex', justifyContent: 'center', alignItems: 'flex-start',
            padding: '20px', minHeight: '100vh', background: '#05070f'
          }}>
            <div className="phone-simulator">
              <div className="phone-notch"></div>
              <div className="phone-screen">
                <div className="phone-scroll" style={{ paddingTop: '32px' }}>
                  {renderAppContent()}
                </div>
                <div className="phone-home-indicator"></div>
              </div>
            </div>
          </div>
        );
      }

      return renderAppContent();
    }

    // ============================================================
    // BOOT
    // ============================================================
    console.log('🚀 Avvio GesssAI-Pro v4.0 FUTURISTIC');

    localStorage.removeItem('ft_matches');
    localStorage.removeItem('ft_champs');

    loadScrapedData(true).then(data => {
      if (data && data.matches && data.matches.length > 0) {
        console.log(`✅ ${data.matches.length} partite caricate all'avvio!`);
        if (window.updateAppData) window.updateAppData(data);
      }
    });

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        ReactDOM.createRoot(rootElement).render(<App />);
      }
    } catch (e) {
      console.error('Errore durante il rendering React:', e);
    }
  </script>
</body>
</html>
