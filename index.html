    /* ===== SPLASHSCREEN STYLES ===== */

    #splashscreen .enter-btn {
      margin-top: 30px;
      padding: 14px 48px;
      font-size: 18px;
      font-weight: 700;
      color: #000;
      background: #f39c12;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 0 30px rgba(243, 156, 18, 0.3);
      letter-spacing: 1px;

    #splashscreen .enter-btn:hover {

    #splashscreen .enter-btn:active {

      #splashscreen .splash-logo .title {
        font-size: 32px;

      }

    // ============================================================
    // SPLASHSCREEN LOGIC
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      const splash = document.getElementById('splashscreen');
      const enterBtn = document.getElementById('enterBtn');

      // Rimuovi lo splash quando l'utente clicca
      enterBtn.addEventListener('click', function() {
        splash.classList.add('hidden');
        // Dopo la transizione, rimuoviamo dal DOM (opzionale)
        setTimeout(() => {
          splash.style.display = 'none';
        }, 700);
      });

      // Se l'utente preme ESC o clicca fuori (solo per UX, non obbligatorio)
      // Non facciamo nulla, solo il bottone fa entrare.
    });

    // ============================================================
    // REACT APP (TUTTO IL RESTO)
    // ============================================================
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ============================================================
    // CARICAMENTO DATI - DA FILE EXCEL NELLA CARTELLA JSON
    // ============================================================

    let dataLoaded = false;

    async function loadScrapedData(forceReload = false) {
      console.log('📂 Caricamento dati da Excel su GitHub Pages...');
      
      try {
        if (forceReload) {
          localStorage.removeItem('ft_matches');
          localStorage.removeItem('ft_champs');
        }
        
        const paths = [
          '/GesssAI-Pro---Auto/excel/GesssAI_Input.xlsx',
          '/excel/GesssAI_Input.xlsx',
          'https://gesss26.github.io/GesssAI-Pro---Auto/excel/GesssAI_Input.xlsx'
        ];
        
        let excelData = null;
        
        for (const path of paths) {
          try {
            console.log('📂 Tentativo: ', path);
            const response = await fetch(path);
            
            if (response.ok) {
              console.log('✅ File Excel trovato!');
              const arrayBuffer = await response.arrayBuffer();
              excelData = processExcelData(arrayBuffer);
              if (excelData) {
                break;
              }
            } else {
              console.warn('❌ File non trovato:', response.status);
            }
          } catch (e) {
            console.warn('❌ Errore:', e.message);
          }
        }
        
        if (excelData) {
          return excelData;
        }
        
        console.log('📂 Tentativo fallback: caricamento JSON...');
        const jsonPaths = [
          '/GesssAI-Pro---Auto/data/matches.json',
          '/data/matches.json',
          'https://gesss26.github.io/GesssAI-Pro---Auto/data/matches.json'
        ];
        
        for (const path of jsonPaths) {
          try {
            const response = await fetch(path);
            if (response.ok) {
              const data = await response.json();
              console.log('✅ Dati caricati da JSON fallback:', data.matches?.length || 0, 'partite');
              if (data.matches) {
                localStorage.setItem('ft_matches', JSON.stringify(data.matches));
                localStorage.setItem('ft_champs', JSON.stringify(data.championships || []));
              }
              dataLoaded = true;
              return data;
            }
          } catch (e) {
            console.warn('❌ JSON fallback fallito:', e.message);
          }
        }
        
        console.error('❌ Nessun file trovato (Excel o JSON)');
        return null;
        
      } catch (error) {
        console.error('❌ Errore:', error.message);
        return null;
      }
    }

    // ============================================================
    // PROCESSO I DATI DEL FILE EXCEL
    // ============================================================

    function processExcelData(arrayBuffer) {
      try {
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
        
        if (jsonData.length === 0) {
          console.error('❌ Il file Excel è vuoto');
          return null;
        }
        
        console.log('✅ File Excel caricato con', jsonData.length, 'righe');
        
        const matches = [];
        const championshipsSet = new Set();
        const headers = Object.keys(jsonData[0]);
        console.log('📊 Colonne trovate:', headers.join(', '));
        
        const findColumn = (keywords) => {
          for (const keyword of keywords) {
            const found = headers.find(h => h.toLowerCase().includes(keyword.toLowerCase()));
            if (found) return found;
          }
          return null;
        };
        
        const colCampionato = findColumn(['campionato', 'league', 'camp', 'championship']);
        const colGiornata = findColumn(['giornata', 'round', 'giorn', 'wk']);
        const colData = findColumn(['data', 'date', 'giorno']);
        const colOra = findColumn(['ora', 'time', 'orario', 'hour']);
        const colCasa = findColumn(['squadra casa', 'home', 'casa', 'home team', 'home_team']);
        const colOspite = findColumn(['squadra ospite', 'away', 'ospite', 'away team', 'away_team']);
        const colGolCasa = findColumn(['gol casa', 'home goals', 'goal casa', 'home_goals']);
        const colGolOspite = findColumn(['gol ospite', 'away goals', 'goal ospite', 'away_goals']);
        const colRisultato = findColumn(['risultato', 'result', 'score', 'ris']);
        const colStato = findColumn(['stato', 'status']);
        
        if (!colCampionato || !colData || !colCasa || !colOspite) {
          console.error('❌ Colonne obbligatorie non trovate. Colonne disponibili:', headers.join(', '));
          return null;
        }
        
        jsonData.forEach((row, index) => {
          const campionato = row[colCampionato]?.toString().trim() || 'Sconosciuto';
          const giornata = row[colGiornata]?.toString().trim() || 'N/A';
          const dataRaw = row[colData]?.toString().trim() || '';
          const oraRaw = row[colOra]?.toString().trim() || 'TBD';
          const casa = row[colCasa]?.toString().trim() || '';
          const ospite = row[colOspite]?.toString().trim() || '';
          
          if (!casa || !ospite) {
            console.warn(`⚠️ Riga ${index + 2} saltata: Squadra casa o ospite mancante`);
            return;
          }
          
          let dataNormalizzata = normalizeDate(dataRaw);
          if (!dataNormalizzata) {
            console.warn(`⚠️ Riga ${index + 2} saltata: Data non valida (${dataRaw})`);
            return;
          }
          
          let golCasa = 0;
          let golOspite = 0;
          let stato = 'Futura';
          let risultato = '';
          
          if (colRisultato && row[colRisultato]) {
            const val = row[colRisultato].toString().trim();
            if (val && val !== '') {
              const matchResult = val.match(/(\d+)\s*[-–:.]\s*(\d+)/);
              if (matchResult) {
                golCasa = parseInt(matchResult[1], 10);
                golOspite = parseInt(matchResult[2], 10);
                risultato = `${golCasa}-${golOspite}`;
                stato = 'Giocata';
              }
            }
          }
          
          if (!risultato && colGolCasa && row[colGolCasa] !== undefined && row[colGolCasa] !== '') {
            golCasa = parseFloat(row[colGolCasa]) || 0;
            if (colGolOspite && row[colGolOspite] !== undefined && row[colGolOspite] !== '') {
              golOspite = parseFloat(row[colGolOspite]) || 0;
              if (golCasa > 0 || golOspite > 0) {
                risultato = `${golCasa}-${golOspite}`;
                stato = 'Giocata';
              }
            }
          }
          
          if (colStato && row[colStato]) {
            const statoVal = row[colStato].toString().toLowerCase().trim();
            if (statoVal === 'giocata' || statoVal === 'played' || statoVal === 'finished') {
              stato = 'Giocata';
            }
          }
          
          const match = {
            id: Math.random().toString(36).slice(2) + Date.now().toString(36) + index,
            campionato: campionato,
            round: giornata,
            data: dataNormalizzata,
            ora: oraRaw,
            casa: casa,
            ospiti: ospite,
            stato: stato,
            golCasa: stato === 'Giocata' ? golCasa : 0,
            golOspite: stato === 'Giocata' ? golOspite : 0,
            risultato: stato === 'Giocata' ? `${golCasa}-${golOspite}` : '',
            citta: 'N/D',
            _fromExcel: true
          };
          
          matches.push(match);
          championshipsSet.add(campionato);
        });
        
        if (matches.length === 0) {
          console.error('❌ Nessuna partita valida trovata nel file Excel');
          return null;
        }
        
        const championships = Array.from(championshipsSet).map(name => ({
          name,
          importedAt: new Date().toISOString()
        }));
        
        console.log(`✅ Caricate ${matches.length} partite dal file Excel (${championships.length} campionati)`);
        
        localStorage.setItem('ft_matches', JSON.stringify(matches));
        localStorage.setItem('ft_champs', JSON.stringify(championships));
        
        dataLoaded = true;
        
        return { matches, championships };
        
      } catch (error) {
        console.error('❌ Errore nel processare i dati Excel:', error.message);
        return null;
      }
    }

    // ============================================================
    // COSTANTI E FUNZIONI DI UTILITÀ
    // ============================================================

    const THEMES = {
      'Scuro Blu Notte': { bg:'#0f1419', surface:'#1a2028', card:'#232b36', banner:'#2c3642', text:'#e6edf3', textMuted:'#ffff00', accent:'#f39c12', accent2:'#e67e22', border:'#30363d', tabActive:'#f39c12' },
      'Chiaro': { bg:'#f5f7fa', surface:'#ffffff', card:'#ffffff', banner:'#e8ecf1', text:'#1a2028', textMuted:'#000000', accent:'#1976d2', accent2:'#0d47a1', border:'#cfd8dc', tabActive:'#1976d2' },
      'Tramonto': { bg:'#2c1810', surface:'#3d2817', card:'#4a3422', banner:'#5d3f2a', text:'#ffe0b2', textMuted:'#ffff00', accent:'#ff6b35', accent2:'#f7931e', border:'#6d4c41', tabActive:'#ff6b35' },
      'Ghiaccio': { bg:'#e3f2fd', surface:'#ffffff', card:'#ffffff', banner:'#bbdefb', text:'#01579b', textMuted:'#000000', accent:'#0288d1', accent2:'#01579b', border:'#90caf9', tabActive:'#0288d1' },
      'Neon': { bg:'#0a0e27', surface:'#131836', card:'#1a1f42', banner:'#24294f', text:'#00ffcc', textMuted:'#ffff00', accent:'#ff00ff', accent2:'#00ffff', border:'#2d325f', tabActive:'#ff00ff' },
      'Calcio': { bg:'#1b5e20', surface:'#2e7d32', card:'#388e3c', banner:'#2e7d32', text:'#fff', textMuted:'#ffff00', accent:'#ffc107', accent2:'#ff9800', border:'#1b5e20', tabActive:'#ffc107' },
    };

    const MAIN_TABS = ['Home','Palinsesto','Statistiche','Storico','Schedina','Impostazioni'];
    const SETTINGS_TABS = ['Temi','Dati Locali','Importa Campionato','Giocate','Grandezza Caratteri','Città Meteo','Visuale'];

    // ============================================================
    // MAPPA COLORI PER CAMPIONATO (25 campionati, esclusa Serie A Woman)
    // ============================================================

    const CHAMPIONSHIP_COLORS = {
      'Liga Profesional Argentina': '#3498db',
      'Jupiler Pro League': '#e74c3c',
      'Brasileirão Serie A': '#2ecc71',
      'Super League Grecia': '#2980b9',
      'Premier League': '#3498db',
      'Premier League GB': '#3498db',
      'English Premier League': '#3498db',
      'EPL': '#3498db',
      'EFL Championship': '#6c3483',
      'Championship': '#6c3483',
      'Ligue 1': '#9b59b6',
      'Ligue 2': '#8e44ad',
      'Bundesliga': '#f39c12',
      '2. Bundesliga': '#e67e22',
      'Serie A': '#2ecc71',
      'Serie A TIM': '#2ecc71',
      'Serie A Enilive': '#2ecc71',
      'Serie B': '#e67e22',
      'Serie C - Girone A': '#2980b9',
      'Serie C - Girone B': '#27ae60',
      'Serie C - Girone C': '#c0392b',
      'J1 League': '#e74c3c',
      'Eerste Divisie': '#e67e22',
      'Eredivisie': '#e74c3c',
      'Primeira Liga': '#34495e',
      'Liga Portugal': '#34495e',
      'Scottish Premiership': '#2ecc71',
      'Premiership': '#2ecc71',
      'K League 1': '#3498db',
      'La Liga': '#e74c3c',
      'LaLiga': '#e74c3c',
      'Segunda División': '#e67e22',
      'Süper Lig': '#e67e22',
      'Super Lig': '#e67e22',
      'Major League Soccer': '#3498db',
      'MLS': '#3498db',
    };

    const CHAMPIONSHIP_LIST = [
      'Liga Profesional Argentina',
      'Jupiler Pro League',
      'Brasileirão Serie A',
      'Super League Grecia',
      'Premier League',
      'EFL Championship',
      'Ligue 1',
      'Ligue 2',
      'Bundesliga',
      '2. Bundesliga',
      'Serie A',
      'Serie B',
      'Serie C - Girone A',
      'Serie C - Girone B',
      'Serie C - Girone C',
      'J1 League',
      'Eerste Divisie',
      'Eredivisie',
      'Primeira Liga',
      'Scottish Premiership',
      'K League 1',
      'La Liga',
      'Segunda División',
      'Süper Lig',
      'Major League Soccer'
    ];

    // ============================================================
    // FUNZIONI DI UTILITÀ
    // ============================================================

    const getChampColor = (champName) => {
      if (!champName) return '#95a5a6';
      for (const [key, color] of Object.entries(CHAMPIONSHIP_COLORS)) {
        if (champName.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(champName.toLowerCase())) {
          return color;
        }
      }
      let hash = 0;
      for (let i = 0; i < champName.length; i++) {
        hash = champName.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 65%, 50%)`;
    };

    const normalizeDate = (dateStr) => {
      if (!dateStr) return null;
      if (typeof dateStr === 'number' || /^\d+$/.test(dateStr.toString().trim())) {
        const serial = parseInt(dateStr.toString().trim());
        const excelEpoch = new Date(1899, 11, 30);
        const date = new Date(excelEpoch.getTime() + serial * 86400000);
        return date.toISOString().slice(0, 10);
      }
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return dateStr;
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
        const parts = dateStr.split('/');
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          return date.toISOString().slice(0, 10);
        }
      } catch(e) {}
      return dateStr;
    };

    const formatDateEU = (dateStr) => {
      if (!dateStr) return 'N/D';
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) return dateStr;
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) {
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y}`;
      }
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
        }
      } catch(e) {}
      return 'N/D';
    };

    const parseDate = (dateStr, timeStr = '00:00') => {
      if (!dateStr) return new Date(0);
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return new Date(dateStr + 'T' + (timeStr || '00:00') + ':00');
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
        const parts = dateStr.split('/');
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        let hours = 0, minutes = 0;
        if (timeStr && timeStr !== 'TBD' && timeStr !== 'N/D') {
          const timeParts = timeStr.split(':');
          if (timeParts.length >= 2) {
            hours = parseInt(timeParts[0], 10) || 0;
            minutes = parseInt(timeParts[1], 10) || 0;
          }
        }
        return new Date(year, month, day, hours, minutes);
      }
      try { return new Date(dateStr + ' ' + (timeStr || '00:00')); } catch(e) { return new Date(0); }
    };

    const getTodayStr = () => new Date().toISOString().slice(0, 10);
    const addDaysToDateStr = (dateStr, days) => {
      const date = new Date(dateStr + 'T00:00:00');
      date.setDate(date.getDate() + days);
      return date.toISOString().slice(0, 10);
    };

    const isDatePassed = (dateStr) => {
      if (!dateStr) return false;
      const normalized = normalizeDate(dateStr);
      if (!normalized) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const matchDate = new Date(normalized + 'T00:00:00');
      return matchDate < today;
    };

    const getPercentualeClasse = (valore) => {
      if (valore >= 90) return 'flag-bomb';
      if (valore >= 66.67) return 'flag-green';
      if (valore >= 33.34) return 'flag-white';
      return 'flag-red';
    };

    const getXgClasse = (valore) => {
      const num = parseFloat(valore);
      if (isNaN(num)) return 'xg-white';
      if (num >= 2) return 'xg-blue';
      if (num >= 1) return 'xg-white';
      return 'xg-red';
    };

    const getHeatmapColorClass = (pct) => {
      if (pct > 90) return 'heatmap-pct-bomb heatmap-bg-bomb';
      if (pct >= 61) return 'heatmap-pct-green heatmap-bg-green';
      if (pct >= 31) return 'heatmap-pct-white heatmap-bg-white';
      return 'heatmap-pct-red heatmap-bg-red';
    };

    // ============================================================
    // SPIEGAZIONE STATISTICHE MONTE CARLO
    // ============================================================

    const getStatExplanation = (statKey) => {
      const explanations = {
        'lambdaCasa': {
          label: 'λ Casa (Lambda)',
          description: 'È il tasso medio di gol previsti per la squadra di casa in questa partita specifica, calcolato dalla formula: (Attacco Casa × Difesa Ospite × 1.1). Più alto è il valore, più gol ci si aspetta dalla squadra di casa. Un valore >1.5 indica un attacco prolifico contro una difesa debole.',
          range: 'Valori tipici: 0.8 - 2.5',
          cosaGuardare: 'Più alto = più gol previsti per la squadra di casa'
        },
        'lambdaOspite': {
          label: 'λ Ospite (Lambda)',
          description: 'È il tasso medio di gol previsti per la squadra ospite. Calcolato con: (Attacco Ospite × Difesa Casa × 0.9). Il fattore 0.9 riduce leggermente la previsione per il fattore campo. Valori alti (>1.2) indicano che l\'ospite segnerà con probabilità.',
          range: 'Valori tipici: 0.6 - 2.0',
          cosaGuardare: 'Più alto = più gol previsti per la squadra ospite'
        },
        'homeAttacco': {
          label: 'Attacco Casa',

    window.TeamLogo = TeamLogo;

    // ============================================================
    // FAMIGLIE GIOCATE
    // ============================================================

    const FAMIGLIE_GIOCATE = {
      fisse: { id: 'fisse', label: 'FISSE', icon: '🎯', desc: 'Sceglie la migliore tra 1, X, 2', options: ['1', 'X', '2'] },

      over: { id: 'over', label: 'OVER', icon: '⬆️', desc: 'Sceglie la migliore tra Over 1.5, 2.5, 3.5, 4.5', options: ['Over 1.5', 'Over 2.5', 'Over 3.5', 'Over 4.5'] },
      under: { id: 'under', label: 'UNDER', icon: '⬇️', desc: 'Sceglie la migliore tra Under 1.5, 2.5, 3.5, 4.5', options: ['Under 1.5', 'Under 2.5', 'Under 3.5', 'Under 4.5'] },

    };

    const DEFAULT_FAMIGLIE = ['dc_under', 'mg_casa_ospite', 'over'];

    // ============================================================
    // FUNZIONI DI CALCOLO STATISTICHE
    // ============================================================

    const calcFormAndStats = (matches, teamName) => {
      const played = matches
        .filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName))
        .sort((a, b) => {
          const dateA = parseDate(a.data, a.ora);
          const dateB = parseDate(b.data, b.ora);
          return dateB - dateA;
        })
        .slice(0, 5);
      let form = '', points = 0;
      let golFatti = 0, golSubiti = 0;
      played.forEach(m => {
        const isHome = m.casa === teamName;
        const teamGoals = isHome ? m.golCasa : m.golOspite;
        const oppGoals = isHome ? m.golOspite : m.golCasa;
        golFatti += teamGoals;
        golSubiti += oppGoals;
        if (teamGoals > oppGoals) { form += 'V'; points += 3; }
        else if (teamGoals === oppGoals) { form += 'P'; points += 1; }
        else { form += 'S'; }
      });
      return {
        form: form || '-----',
        pct: played.length ? Math.round((points / (played.length * 3)) * 100) : 50,
        golFatti, golSubiti,
        mediaGolFatti: played.length ? (golFatti / played.length).toFixed(1) : 0,
        mediaGolSubiti: played.length ? (golSubiti / played.length).toFixed(1) : 0,
        partite: played.length
      };
    };

    const computeMatchStats = (match, allMatches) => {
      const homeTeam = match.casa;
      const awayTeam = match.ospiti;
      const homeGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === homeTeam || m.ospiti === homeTeam));
      const awayGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === awayTeam || m.ospiti === awayTeam));
      const allGamesMap = new Map();
      [...homeGames, ...awayGames].forEach(g => { if (!allGamesMap.has(g.id)) { allGamesMap.set(g.id, g); } });
      const allGames = Array.from(allGamesMap.values());
      const totalGames = allGames.length;
      if (totalGames === 0) return { error: 'Nessuna partita giocata per queste squadre.' };
      
      let homeWins = 0, homeDraws = 0, homeLosses = 0;
      let homeGoalsScored = 0, homeGoalsConceded = 0;
      homeGames.forEach(g => {
        const isHome = g.casa === homeTeam;
        const teamGoals = isHome ? g.golCasa : g.golOspite;
        const oppGoals = isHome ? g.golOspite : g.golCasa;
        homeGoalsScored += teamGoals;
        homeGoalsConceded += oppGoals;
        if (teamGoals > oppGoals) homeWins++;
        else if (teamGoals === oppGoals) homeDraws++;
        else homeLosses++;
      });
      
      let awayWins = 0, awayDraws = 0, awayLosses = 0;
      let awayGoalsScored = 0, awayGoalsConceded = 0;
      awayGames.forEach(g => {
        const isHome = g.casa === awayTeam;
        const teamGoals = isHome ? g.golCasa : g.golOspite;
        const oppGoals = isHome ? g.golOspite : g.golCasa;
        awayGoalsScored += teamGoals;
        awayGoalsConceded += oppGoals;
        if (teamGoals > oppGoals) awayWins++;
        else if (teamGoals === oppGoals) awayDraws++;
        else awayLosses++;
      });
      
      const p1 = totalGames > 0 ? ((homeWins + awayLosses) / totalGames) * 100 : 0;
      const pX = totalGames > 0 ? ((homeDraws + awayDraws) / totalGames) * 100 : 0;
      const p2 = totalGames > 0 ? ((homeLosses + awayWins) / totalGames) * 100 : 0;
      const p1X = totalGames > 0 ? ((homeWins + homeDraws) / totalGames) * 100 : 0;
      const p12 = totalGames > 0 ? ((homeWins + awayWins) / totalGames) * 100 : 0;
      const pX2 = totalGames > 0 ? ((homeLosses + awayWins) / totalGames) * 100 : 0;
      
      const allGamesForGoals = [...homeGames, ...awayGames];
      const goalTotals = allGamesForGoals.map(g => g.golCasa + g.golOspite);
      const thresholds = [1.5, 2.5, 3.5, 4.5];
      const underOver = thresholds.map(t => {
        const over = goalTotals.filter(gt => gt > t).length / goalTotals.length * 100;
        const under = 100 - over;
        return { threshold: t, under, over };
      });
      
      const getMultigolV2 = (team, games) => {
        const goals = games.map(g => (g.casa === team) ? g.golCasa : g.golOspite);
        const total = goals.length;
        if (total === 0) return { '0-1': 0, '0-2': 0, '1-3': 0, '2-5': 0 };
        const count = (pred) => goals.filter(pred).length / total * 100;
        return { 
          '0-1': count(g => g <= 1), 
          '0-2': count(g => g <= 2), 
          '1-3': count(g => g >= 1 && g <= 3), 
          '2-5': count(g => g >= 2 && g <= 5)
        };
      };
      
      const homeMG = getMultigolV2(homeTeam, homeGames);
      const awayMG = getMultigolV2(awayTeam, awayGames);
      
      const totalGoals = allGamesForGoals.map(g => g.golCasa + g.golOspite);
      const mgTot = {
        '1-4': totalGoals.filter(g => g >= 1 && g <= 4).length / totalGoals.length * 100,
        '2-4': totalGoals.filter(g => g >= 2 && g <= 4).length / totalGoals.length * 100,
        '2-5': totalGoals.filter(g => g >= 2 && g <= 5).length / totalGoals.length * 100,
        '3-6': totalGoals.filter(g => g >= 3 && g <= 6).length / totalGoals.length * 100,
      };
      
      return {
        p1, pX, p2, p1X, p12, pX2, underOver, homeMG, awayMG, mgTot,
        homeGames, awayGames,
        homeStats: { wins: homeWins, draws: homeDraws, losses: homeLosses, goalsScored: homeGoalsScored, goalsConceded: homeGoalsConceded, played: homeGames.length },
        awayStats: { wins: awayWins, draws: awayDraws, losses: awayLosses, goalsScored: awayGoalsScored, goalsConceded: awayGoalsConceded, played: awayGames.length },
        totalGames
      };
    };

    const get12Under45 = (allMatches, homeTeam, awayTeam) => {
      const homeGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === homeTeam || m.ospiti === homeTeam));
      const awayGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === awayTeam || m.ospiti === awayTeam));
      const allGames = [...homeGames, ...awayGames];
      const uniqueGames = Array.from(new Map(allGames.map(g => [g.id, g])).values());
      if (!uniqueGames.length) return 0;
      const count = uniqueGames.filter(g => {
        const total = g.golCasa + g.golOspite;
        return g.golCasa !== g.golOspite && total < 4.5;
      }).length;
      return (count / uniqueGames.length) * 100;
    };

    const getMultigolRange = (teamName, allMatches) => {
      const matches = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName));
      if (matches.length === 0) return { label: 'N/A', pct: 0, range: 'default', details: [] };
      const goals = matches.map(m => (m.casa === teamName) ? m.golCasa : m.golOspite);
      const total = goals.length;
      const range01 = goals.filter(g => g <= 1).length / total * 100;
      const range02 = goals.filter(g => g <= 2).length / total * 100;
      const range13 = goals.filter(g => g >= 1 && g <= 3).length / total * 100;
      const range24 = goals.filter(g => g >= 2 && g <= 4).length / total * 100;
      const range25 = goals.filter(g => g >= 2 && g <= 5).length / total * 100;
      const range36 = goals.filter(g => g >= 3 && g <= 6).length / total * 100;
      const ranges = [
        { label: '0-1', pct: range01, range: '01' },
        { label: '0-2', pct: range02, range: '02' },
        { label: '1-3', pct: range13, range: '13' },
        { label: '2-4', pct: range24, range: '24' },
        { label: '2-5', pct: range25, range: '25' },
        { label: '3-6', pct: range36, range: '36' },
      ];
      const best = ranges.reduce((a, b) => a.pct > b.pct ? a : b);
      return { label: best.label, pct: Math.round(best.pct), range: best.range, details: ranges.map(r => ({ ...r, pct: Math.round(r.pct) })) };
    };

    const calcTeamMG = (matches, teamName) => {
      const played = matches.filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName));
      if (!played.length) return '0.0-0.0';
      let scored = 0, conceded = 0;
      played.forEach(m => {
        if (m.casa === teamName) { scored += m.golCasa; conceded += m.golOspite; }
        else { scored += m.golOspite; conceded += m.golCasa; }
      });
      return `${(scored/played.length).toFixed(1)}-${(conceded/played.length).toFixed(1)}`;
    };

    // ============================================================
    // FUNZIONI PER IL CALCOLO DELLE PERCENTUALI DELLE GIOCATE
    // ============================================================

    const getGiocataPct = (giocata, stats, homeMG, awayMG, mgTot) => {
      if (stats.error) return 0;
      
      const { p1, pX, p2, p1X, p12, pX2, underOver } = stats;
      
      if (giocata === '1') return Math.round(p1);
      if (giocata === 'X') return Math.round(pX);
      if (giocata === '2') return Math.round(p2);
      
      if (giocata === '1X') return Math.round(p1X);
      if (giocata === '12') return Math.round(p12);
      if (giocata === 'X2') return Math.round(pX2);
      
      if (giocata === 'Over 1.5') return Math.round(underOver[0]?.over || 0);
      if (giocata === 'Over 2.5') return Math.round(underOver[1]?.over || 0);
      if (giocata === 'Over 3.5') return Math.round(underOver[2]?.over || 0);
      if (giocata === 'Over 4.5') return Math.round(underOver[3]?.over || 0);
      
      if (giocata === 'Under 1.5') return Math.round(underOver[0]?.under || 0);
      if (giocata === 'Under 2.5') return Math.round(underOver[1]?.under || 0);
      if (giocata === 'Under 3.5') return Math.round(underOver[2]?.under || 0);
      if (giocata === 'Under 4.5') return Math.round(underOver[3]?.under || 0);
      
      if (giocata === '0-2') return Math.round(homeMG['0-2'] || 0);
      if (giocata === '1-3') return Math.round(homeMG['1-3'] || 0);
      if (giocata === '1-4') return Math.round(mgTot['1-4'] || 0);
      if (giocata === '2-5') return Math.round(mgTot['2-5'] || 0);
      
      if (giocata.startsWith('1X+O')) { const over = giocata.replace('1X+O', 'Over '); return Math.round((p1X + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('12+O')) { const over = giocata.replace('12+O', 'Over '); return Math.round((p12 + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('X2+O')) { const over = giocata.replace('X2+O', 'Over '); return Math.round((pX2 + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
      
      if (giocata.startsWith('1X+U')) { const under = giocata.replace('1X+U', 'Under '); return Math.round((p1X + getGiocataPct(under, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('12+U')) { const under = giocata.replace('12+U', 'Under '); return Math.round((p12 + getGiocataPct(under, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('X2+U')) { const under = giocata.replace('X2+U', 'Under '); return Math.round((pX2 + getGiocataPct(under, stats, homeMG, awayMG, mgTot)) / 2); }
      
      if (giocata.includes('+') && !giocata.includes('X') && !giocata.includes('O') && !giocata.includes('U')) {
        const parts = giocata.split('+');
        let pct1 = 0;
        if (parts[0] === '0-1') pct1 = homeMG['0-1'] || 0;
        else if (parts[0] === '0-2') pct1 = homeMG['0-2'] || 0;
        else if (parts[0] === '1-3') pct1 = homeMG['1-3'] || 0;
        else if (parts[0] === '2-5') pct1 = homeMG['2-5'] || 0;
        
        let pct2 = 0;
        if (parts[1] === '0-1') pct2 = awayMG['0-1'] || 0;
        else if (parts[1] === '0-2') pct2 = awayMG['0-2'] || 0;
        else if (parts[1] === '1-3') pct2 = awayMG['1-3'] || 0;
        else if (parts[1] === '2-5') pct2 = awayMG['2-5'] || 0;
        
        return Math.round((pct1 + pct2) / 2);
      }
      
      if (giocata.startsWith('1X+') && !giocata.includes('O') && !giocata.includes('U')) {
        const mg = giocata.replace('1X+', '');
        let pctMG = 0;
        if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
        else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
        else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
        else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
        return Math.round((p1X + pctMG) / 2);
      }
      if (giocata.startsWith('12+') && !giocata.includes('O') && !giocata.includes('U')) {
        const mg = giocata.replace('12+', '');
        let pctMG = 0;
        if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
        else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
        else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
        else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
        return Math.round((p12 + pctMG) / 2);
      }
      if (giocata.startsWith('X2+') && !giocata.includes('O') && !giocata.includes('U')) {
        const mg = giocata.replace('X2+', '');
        let pctMG = 0;
        if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
        else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
        else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
        else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
        return Math.round((pX2 + pctMG) / 2);
      }
      
      return 0;
    };

    // ============================================================
    // FUNZIONE PER TROVARE LA MIGLIORE GIOCATA DI UNA FAMIGLIA
    // ============================================================

    const getBestBetForFamily = (familyId, stats, homeRange, awayRange, homeMG, awayMG, mgTot) => {
      if (stats.error) return null;
      
      const family = FAMIGLIE_GIOCATE[familyId];
      if (!family) return null;
      
      let best = null;
      let bestPct = -1;
      let bestLabel = '';
      
      family.options.forEach(opt => {
        let pct = 0;
        let label = opt;
        
        if (familyId === 'dc_under' && opt === '12+U4.5') {
          pct = Math.round(get12Under45(stats._allMatches, stats._homeTeam, stats._awayTeam) || 0);
        } else if (familyId === 'mg_casa_ospite') {
          const parts = opt.split('+');
          
          let pct1 = 0;
          if (parts[0] === '0-1') pct1 = homeMG['0-1'] || 0;
          else if (parts[0] === '0-2') pct1 = homeMG['0-2'] || 0;
          else if (parts[0] === '1-3') pct1 = homeMG['1-3'] || 0;
          else if (parts[0] === '2-5') pct1 = homeMG['2-5'] || 0;
          
          let pct2 = 0;
          if (parts[1] === '0-1') pct2 = awayMG['0-1'] || 0;
          else if (parts[1] === '0-2') pct2 = awayMG['0-2'] || 0;
          else if (parts[1] === '1-3') pct2 = awayMG['1-3'] || 0;
          else if (parts[1] === '2-5') pct2 = awayMG['2-5'] || 0;
          
          pct = Math.round((pct1 + pct2) / 2);
          label = `${parts[0]}+${parts[1]}`;
        } else {
          pct = getGiocataPct(opt, stats, homeMG, awayMG, mgTot);
        }
        
        if (pct > bestPct) {
          bestPct = pct;
          best = opt;
          bestLabel = label;
        }
      });
      
      if (best && bestPct > 0) {
        return { 
          giocata: best, 
          label: bestLabel, 
          pct: bestPct,
          isBomb: bestPct >= 90
        };
      }
      
      return null;
    };

    // ============================================================
    // ESPOSIZIONE FUNZIONI GLOBALI PER IL MODULO SCHEDINA
    // ============================================================

    window.computeMatchStats = computeMatchStats;
    window.getGiocataPct = getGiocataPct;

    // ============================================================
    // COMPONENTE STANDINGS

    const Standings = ({ matches, filterChampionship, highlightTeams = [] }) => {
      const [view, setView] = useState('generale');
      
      let allMatchesInChamp = matches;
      if (filterChampionship && filterChampionship !== 'Tutti') {
        allMatchesInChamp = allMatchesInChamp.filter(m => m.campionato === filterChampionship);
      }
      
      const playedMatches = allMatchesInChamp.filter(m => m.stato === 'Giocata');
      
      if (allMatchesInChamp.length === 0) {
        return <div className="empty-state">Nessuna partita disponibile per questo campionato.</div>;
      }
      
      const allTeams = new Set();
      allMatchesInChamp.forEach(m => {
        if (m.casa) allTeams.add(m.casa);
        if (m.ospiti) allTeams.add(m.ospiti);
      });
      
      if (allTeams.size === 0) {
        return <div className="empty-state">Nessuna squadra trovata per questo campionato.</div>;
      }
      
      const teamStats = {};
      allTeams.forEach(team => {
        if (!team || team.trim() === '') return;
        teamStats[team] = { 
          pg: 0, punti: 0, v: 0, p: 0, s: 0, gf: 0, gs: 0, dr: 0 
        };
      });
      
      const addGame = (team, golFatti, golSubiti) => {
        if (!teamStats[team]) {
          teamStats[team] = { pg: 0, punti: 0, v: 0, p: 0, s: 0, gf: 0, gs: 0, dr: 0 };
        }
        const t = teamStats[team];
        t.pg++; 
        t.gf += golFatti; 
        t.gs += golSubiti;
        if (golFatti > golSubiti) { 
          t.v++; 
          t.punti += 3; 
        } else if (golFatti === golSubiti) { 
          t.p++; 
          t.punti += 1; 
        } else { 
          t.s++; 
        }
      };
      
      playedMatches.forEach(m => {
        if (view === 'generale' || view === 'casa') { 
          addGame(m.casa, m.golCasa, m.golOspite); 
        }
        if (view === 'generale' || view === 'ospite') { 
          addGame(m.ospiti, m.golOspite, m.golCasa); 
        }
      });
      
      Object.values(teamStats).forEach(t => { 
        t.dr = t.gf - t.gs; 
      });
      
      const sorted = Object.entries(teamStats)
        .filter(([name]) => name && name.trim() !== '')
        .sort((a, b) => {
          if (b[1].punti !== a[1].punti) return b[1].punti - a[1].punti;
          if (b[1].dr !== a[1].dr) return b[1].dr - a[1].dr;
          return b[1].gf - a[1].gf;
        })
        .map(([name, stats], index) => ({ pos: index + 1, name, ...stats }));
      
      const getMultigolForTeam = (teamName) => getMultigolRange(teamName, matches);
      const champToShow = filterChampionship && filterChampionship !== 'Tutti' ? filterChampionship : null;
      
      const teamsWithGames = Object.values(teamStats).filter(t => t.pg > 0).length;
      
      return (
        <div>
          <div className="sub-tabs">
            <button className={view === 'generale' ? 'active' : ''} onClick={() => setView('generale')}>Generale</button>
            <button className={view === 'casa' ? 'active' : ''} onClick={() => setView('casa')}>Casa</button>
            <button className={view === 'ospite' ? 'active' : ''} onClick={() => setView('ospite')}>Ospite</button>
          </div>
          <div style={{fontSize: '12px', color: 'var(--text-muted)', marginBottom: '8px'}}>
            📊 {sorted.length} squadre totali • {teamsWithGames} con partite giocate
          </div>
          <div className="standings-table-wrap">
            <table className="standings-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Squadra</th>
                  <th className="num">PG</th>
                  <th className="num">Punti</th>
                  <th className="num">V</th>
                  <th className="num">P</th>
                  <th className="num">S</th>
                  <th className="num">GF</th>
                  <th className="num">GS</th>
                  <th className="num">DR</th>
                  <th className="num">Fascia Gol</th>
                  <th className="num">%</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map(row => {
                  const isHighlighted = highlightTeams.includes(row.name);
                  const multigol = getMultigolForTeam(row.name);
                  const hasPlayed = row.pg > 0;
                  return (
                    <tr key={row.name} className={isHighlighted ? 'highlighted' : ''} style={{opacity: hasPlayed ? 1 : 0.5}}>
                      <td className="pos">{row.pos}</td>
                      <td>
                        <div className="team-name-cell">
                          <TeamLogo teamName={row.name} championship={champToShow || 'Tutti'} size={18} />
                          <span className="team-name">{row.name}</span>
                          {!hasPlayed && <span style={{fontSize: '10px', color: 'var(--text-muted)', marginLeft: '4px'}}>(0 PG)</span>}
                        </div>
                      </td>
                      <td className="num">{row.pg}</td>
                      <td className="points" style={{color: hasPlayed ? 'var(--accent)' : 'var(--text-muted)'}}>
                        {row.punti}
                      </td>
                      <td className="num">{row.v}</td>
                      <td className="num">{row.p}</td>
                      <td className="num">{row.s}</td>
                      <td className="num">{row.gf}</td>
                      <td className="num">{row.gs}</td>
                      <td className="num" style={{color: row.dr > 0 ? 'var(--win)' : (row.dr < 0 ? 'var(--lose)' : 'var(--text-muted)')}}>
                        {row.dr > 0 ? '+' : ''}{row.dr}
                      </td>
                      <td className="num">
                        {hasPlayed ? (
                          <span className={`multigol-badge range-${multigol.range}`}>{multigol.label}</span>

                      }}>

                      </td>

              </tbody>

    };

    // ============================================================
    // COMPONENTE FAMIGLIE SELECTOR
    // ============================================================

    const FamiglieSelector = ({ selectedFamiglie, setSelectedFamiglie, showAlert }) => {

          } else {
            if (prev.length >= 3) {

            }
            return [...prev, familyId];
          }
        });

              </span>
              <button className="btn btn-secondary" onClick={resetToDefault} style={{fontSize: '12px', padding: '6px 14px'}}>
                🔄 Default
              </button>
              <button className="btn" onClick={confirmFamiglie} style={{fontSize: '12px', padding: '6px 18px'}}>
                ✅ Conferma
              </button>
            </div>

          <div className="giocate-selector-grid">

              <div

                  <span className="badge">{family.options.length} opzioni</span>

          </div>
          
          {tempSelected.length > 0 && (
            <div style={{marginTop: '16px', padding: '12px 16px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '8px'}}>
              <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>
