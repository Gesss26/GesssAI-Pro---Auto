    // ============================================================
    // COMPONENTE TEAM MATCHES HISTORY
    // ============================================================

    const TeamMatchesHistory = ({ teamName, championship, allMatches }) => {
      const teamMatches = allMatches.filter(m => 
        m.campionato === championship && 
        m.stato === 'Giocata' && 
        (m.casa === teamName || m.ospiti === teamName)
      ).sort((a, b) => { 
        const dateA = parseDate(a.data, a.ora); 
        const dateB = parseDate(b.data, b.ora); 
        return dateB - dateA; 
      });
      
      if (teamMatches.length === 0) {
        return (
          <div className="card" style={{padding: '12px', textAlign:'center'}}>
            <p style={{color:'var(--text-muted)'}}>Nessuna partita giocata per {teamName} in questo campionato.</p>
          </div>
        );
      }
      
      const getResult = (match, team) => {
        const isHome = match.casa === team;
        const teamGoals = isHome ? match.golCasa : match.golOspite;
        const oppGoals = isHome ? match.golOspite : match.golCasa;
        if (teamGoals > oppGoals) return 'win';
        if (teamGoals === oppGoals) return 'draw';
        return 'loss';
      };
      
      const getOpponent = (match, team) => match.casa === team ? match.ospiti : match.casa;
      const getResultColor = (result) => result === 'win' ? 'var(--win)' : (result === 'draw' ? 'var(--draw)' : 'var(--lose)');
      
      return (
        <div className="card" style={{padding: '12px'}}>
          <h4 style={{color: getChampColor(teamName), marginBottom:'12px', display: 'flex', alignItems: 'center', gap: '8px'}}>
            <TeamLogo teamName={teamName} championship={championship} size={20} />
            {teamName}
            <span style={{fontSize: '12px', color: 'var(--text-muted)', fontWeight: 'normal', marginLeft: 'auto'}}>
              {teamMatches.length} partite
            </span>
          </h4>
          <div style={{display: 'flex', flexDirection: 'column', gap: '4px'}}>
            {teamMatches.map(m => {
              const result = getResult(m, teamName);
              const opponent = getOpponent(m, teamName);
              const resultColor = getResultColor(result);
              const isHome = m.casa === teamName;
              const isWin = result === 'win';
              const isDraw = result === 'draw';
              const isLoss = result === 'loss';
              
              let emoji = '';
              let resultLabel = '';
              if (isWin) {
                emoji = '✅';
                resultLabel = 'V';
              } else if (isDraw) {
                emoji = '➖';
                resultLabel = 'P';
              } else {
                emoji = '❌';
                resultLabel = 'S';
              }
              
              const homeEmoji = isHome ? '🏠' : '✈️';
              
              return (
                <div 
                  key={m.id} 
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    padding: '6px 12px',
                    background: 'var(--surface)',
                    borderRadius: '6px',
                    border: `2px solid ${resultColor}`,
                    borderLeft: `6px solid ${resultColor}`,
                    transition: 'all 0.15s',
                    cursor: 'default',
                    gap: '8px',
                    flexWrap: 'wrap'
                  }}
                >
                  <div style={{display: 'flex', alignItems: 'center', gap: '8px', flex: '1', minWidth: '180px'}}>
                    <span style={{fontSize: '11px', color: 'var(--text-muted)', minWidth: '70px'}}>
                      {formatDateEU(m.data)}
                    </span>
                    <span style={{fontSize: '13px', fontWeight: 'bold', color: 'var(--text)'}}>
                      {isHome ? (
                        <>
                          <span style={{color: 'var(--accent)'}}>{teamName}</span>
                          <span style={{color: 'var(--text-muted)', margin: '0 4px'}}>-</span>
                          <span style={{color: 'var(--text)'}}>{opponent}</span>
                        </>
                      ) : (
                        <>
                          <span style={{color: 'var(--text)'}}>{opponent}</span>
                          <span style={{color: 'var(--text-muted)', margin: '0 4px'}}>-</span>
                          <span style={{color: 'var(--accent)'}}>{teamName}</span>
                        </>
                      )}
                    </span>
                    <span style={{fontSize: '10px', color: 'var(--text-muted)'}}>
                      {homeEmoji} {isHome ? 'Casa' : 'Trasferta'}
                    </span>
                  </div>
                  
                  <div style={{display: 'flex', alignItems: 'center', gap: '8px', flexShrink: 0}}>
                    <span 
                      style={{
                        display: 'inline-block',
                        backgroundColor: resultColor,
                        color: '#000',
                        fontWeight: 'bold',
                        padding: '2px 14px',
                        borderRadius: '6px',
                        minWidth: '50px',
                        textAlign: 'center',
                        fontSize: '16px',
                        border: `1px solid ${resultColor}`
                      }}
                    >
                      {m.golCasa} - {m.golOspite}
                    </span>
                    <span 
                      style={{
                        fontSize: '14px',
                        fontWeight: 'bold',
                        padding: '2px 8px',
                        borderRadius: '4px',
                        background: resultColor,
                        color: '#000',
                        minWidth: '24px',
                        textAlign: 'center'
                      }}
                    >
                      {resultLabel}
                    </span>
                    <span style={{fontSize: '16px'}}>{emoji}</span>
                  </div>
                </div>
              );
            })}
          </div>
          
          <div style={{
            marginTop: '12px',
            padding: '8px 12px',
            background: 'var(--card)',
            borderRadius: '6px',
            border: '1px solid var(--border)',
            display: 'flex',
            justifyContent: 'space-around',
            flexWrap: 'wrap',
            gap: '8px',
            fontSize: '12px'
          }}>
            {(() => {
              const wins = teamMatches.filter(m => getResult(m, teamName) === 'win').length;
              const draws = teamMatches.filter(m => getResult(m, teamName) === 'draw').length;
              const losses = teamMatches.filter(m => getResult(m, teamName) === 'loss').length;
              const homeMatches = teamMatches.filter(m => m.casa === teamName).length;
              const awayMatches = teamMatches.filter(m => m.ospiti === teamName).length;
              const homeWins = teamMatches.filter(m => m.casa === teamName && getResult(m, teamName) === 'win').length;
              const awayWins = teamMatches.filter(m => m.ospiti === teamName && getResult(m, teamName) === 'win').length;
              
              return (
                <>
                  <span>✅ V: <b style={{color: 'var(--win)'}}>{wins}</b></span>
                  <span>➖ P: <b style={{color: 'var(--draw)'}}>{draws}</b></span>
                  <span>❌ S: <b style={{color: 'var(--lose)'}}>{losses}</b></span>
                  <span>🏠 Casa: <b style={{color: 'var(--accent)'}}>{homeMatches}</b> ({homeWins} V)</span>
                  <span>✈️ Trasferta: <b style={{color: 'var(--text-muted)'}}>{awayMatches}</b> ({awayWins} V)</span>
                  <span style={{color: 'var(--text-muted)'}}>📊 {Math.round((wins / teamMatches.length) * 100)}% Vittorie</span>
                </>
              );
            })()}
          </div>
        </div>
      );
    };

    // ============================================================
    // COMPONENTE HOME WIDGET
    // ============================================================

    const HomeWidget = ({ matches, onSelectMatch, setTab, selectedFamiglie }) => {
      const [selectedDay, setSelectedDay] = useState('oggi');
      const [expanded, setExpanded] = useState(true);
      
      const renderPct = (value) => {
        const rounded = Math.round(value);
        const cls = getPercentualeClasse(rounded);
        return <span className={`giocata-pct ${cls}`}>{rounded}%</span>;
      };
      
      const getGiocateDelGiorno = () => {
        const today = new Date(); today.setHours(0,0,0,0);
        const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
        const weekend = new Date(today); weekend.setDate(weekend.getDate() + 2);
        let targetMatches = matches.filter(m => {
          if (m.stato !== 'Futura') return false;
          const matchDate = parseDate(m.data);
          matchDate.setHours(0,0,0,0);
          if (selectedDay === 'oggi') return matchDate.getTime() === today.getTime();
          if (selectedDay === 'domani') return matchDate.getTime() === tomorrow.getTime();
          return matchDate >= today && matchDate <= weekend;
        });
        return targetMatches.map(m => {
          const stats = computeMatchStats(m, matches);
          if (stats.error) return { ...m, score: 0, giocate: [] };
          
          stats._allMatches = matches;
          stats._homeTeam = m.casa;
          stats._awayTeam = m.ospiti;
          
          const homeMG = stats.homeMG || {};
          const awayMG = stats.awayMG || {};
          const mgTot = stats.mgTot || {};
          const homeRange = getMultigolRange(m.casa, matches);
          const awayRange = getMultigolRange(m.ospiti, matches);
          
          const giocate = [];
          
          selectedFamiglie.forEach(familyId => {
            const best = getBestBetForFamily(familyId, stats, homeRange, awayRange, homeMG, awayMG, mgTot);
            if (best && best.pct > 0) {
              giocate.push({
                familyId,
                label: best.label,
                pct: best.pct,
                isBomb: best.pct >= 90
              });
            }
          });
          
          giocate.sort((a, b) => b.pct - a.pct);
          const score = giocate.length > 0 ? Math.round(giocate.reduce((s, g) => s + g.pct, 0) / giocate.length) : 0;
          
          return { ...m, score, giocate: giocate.slice(0, 3) };
        }).filter(m => m.score > 0 && m.giocate.length > 0).sort((a,b) => b.score - a.score).slice(0, 5);
      };
      
      const giocateDelGiorno = getGiocateDelGiorno();
      if (giocateDelGiorno.length === 0) {
        return (
          <div className="home-widget">
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '8px'}}>
              <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}><span style={{fontSize: '24px'}}>🏠</span><h3 style={{margin: 0}}>💣 Giocate Bomba del Giorno</h3></div>
              <div className="day-selector"><button className={selectedDay === 'oggi' ? 'active' : ''} onClick={() => setSelectedDay('oggi')}>Oggi</button><button className={selectedDay === 'domani' ? 'active' : ''} onClick={() => setSelectedDay('domani')}>Domani</button><button className={selectedDay === 'weekend' ? 'active' : ''} onClick={() => setSelectedDay('weekend')}>Weekend</button></div>
            </div>
            <div className="empty-state" style={{padding: '20px'}}><span style={{fontSize: '24px'}}>💣</span><p>Nessuna giocata con 💣 disponibile per {selectedDay === 'weekend' ? 'il weekend' : selectedDay}</p></div>
          </div>
        );
      }
      
      return (
        <div className="home-widget">
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '8px', cursor: 'pointer'}} onClick={() => setExpanded(!expanded)}>
            <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
              <span style={{fontSize: '24px'}}>💣</span>
              <h3 style={{margin: 0}}>Giocate Bomba del Giorno</h3>
              <span className="badge" style={{background: 'var(--accent)', color: '#000', padding: '2px 10px', borderRadius: '12px', fontSize: '12px', fontWeight: 'bold'}}>{giocateDelGiorno.length} Top 💣</span>
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
              <div className="day-selector" onClick={e => e.stopPropagation()}>
                <button className={selectedDay === 'oggi' ? 'active' : ''} onClick={() => setSelectedDay('oggi')}>Oggi</button>
                <button className={selectedDay === 'domani' ? 'active' : ''} onClick={() => setSelectedDay('domani')}>Domani</button>
                <button className={selectedDay === 'weekend' ? 'active' : ''} onClick={() => setSelectedDay('weekend')}>Weekend</button>
              </div>
              <span style={{fontSize: '18px'}}>{expanded ? '▼' : '▶'}</span>
            </div>
          </div>
          {expanded && (
            <>
              {giocateDelGiorno[0] && (
                <div className="top-pick" style={{borderLeftColor: 'var(--accent)'}}>
                  <div style={{display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap'}}>
                    <span style={{background: 'var(--accent)', color: '#000', padding: '2px 12px', borderRadius: '12px', fontSize: '11px', fontWeight: 'bold'}}>⭐ TOP PICK 💣</span>
                    <div style={{display: 'flex', alignItems: 'center', gap: '6px'}}>
                      <TeamLogo teamName={giocateDelGiorno[0].casa} championship={giocateDelGiorno[0].campionato} size={18} />
                      <span style={{fontWeight: 'bold', color: 'var(--text)'}}>{giocateDelGiorno[0].casa}</span>
                      <span style={{color: 'var(--text-muted)'}}>vs</span>
                      <TeamLogo teamName={giocateDelGiorno[0].ospiti} championship={giocateDelGiorno[0].campionato} size={18} />
                      <span style={{fontWeight: 'bold', color: 'var(--text)'}}>{giocateDelGiorno[0].ospiti}</span>
                    </div>
                    <span style={{color: 'var(--text-muted)', fontSize: '13px'}}>{formatDateEU(giocateDelGiorno[0].data)}</span>
                    <span style={{marginLeft: 'auto', fontSize: '20px', fontWeight: 'bold', color: 'var(--accent)'}}>Score: {renderPct(giocateDelGiorno[0].score)}</span>
                  </div>
                  <div style={{display: 'flex', flexWrap: 'wrap', gap: '4px', marginTop: '8px'}}>
                    {giocateDelGiorno[0].giocate.map((g, idx) => {
                      const isMax = g.pct === Math.max(...giocateDelGiorno[0].giocate.map(x => x.pct));
                      const family = FAMIGLIE_GIOCATE[g.familyId];
                      return (
                        <div key={idx} style={{background: 'var(--surface)', padding: '4px 10px', borderRadius: '4px', textAlign: 'center', border: isMax && g.isBomb ? '2px solid var(--accent)' : '1px solid var(--border)', flex: '1', minWidth: '80px'}}>
                          <div style={{fontWeight: 'bold', color: 'var(--text)', fontSize: '10px'}}>{family ? family.label : g.familyId}</div>
                          <div style={{fontWeight: 'bold', fontSize: '14px'}}>{renderPct(g.pct)}</div>
                          <div style={{fontSize: '9px', color: 'var(--text-muted)'}}>{g.label}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              <div className="giocate-list">
                {giocateDelGiorno.slice(1).map((match, idx) => {
                  const champColor = getChampColor(match.campionato);
                  const maxPct = Math.max(...match.giocate.map(g => g.pct));
                  return (
                    <div key={idx} className="giocata-item" onClick={() => onSelectMatch(match.id)} style={{display: 'flex', alignItems: 'center', gap: '8px', padding: '8px 12px', borderBottom: '1px solid var(--border)', cursor: 'pointer', transition: 'background 0.2s', borderRadius: '6px', flexWrap: 'wrap'}}>
                      <div style={{flex: '0 0 auto', display: 'flex', alignItems: 'center', gap: '8px'}}>
                        <span style={{fontSize: '14px', fontWeight: 'bold', color: champColor, minWidth: '30px'}}>#{idx + 2}</span>
                        <div style={{display: 'flex', alignItems: 'center', gap: '4px'}}>
                          <TeamLogo teamName={match.casa} championship={match.campionato} size={20} />
                          <div><div style={{fontWeight: 'bold', fontSize: '13px', color: 'var(--text)'}}>{match.casa} vs {match.ospiti}</div><div style={{fontSize: '10px', color: 'var(--text-muted)'}}>{match.campionato} • {formatDateEU(match.data)}</div></div>
                          <TeamLogo teamName={match.ospiti} championship={match.campionato} size={20} />
                        </div>
                      </div>
                      <div style={{display: 'flex', flexWrap: 'wrap', gap: '4px', flex: '1', minWidth: '180px'}}>
                        {match.giocate.map((g, gi) => {
                          const isMax = g.pct === maxPct;
                          const family = FAMIGLIE_GIOCATE[g.familyId];
                          return (
                            <div key={gi} style={{background: 'var(--surface)', padding: '3px 8px', borderRadius: '4px', textAlign: 'center', border: isMax && g.isBomb ? '2px solid var(--accent)' : '1px solid var(--border)', flex: '1', minWidth: '60px', maxWidth: '160px'}}>
                              <div style={{fontWeight: 'bold', color: 'var(--text)', fontSize: '9px', lineHeight: '1.2'}}>{family ? family.label : g.familyId}</div>
                              <div style={{fontWeight: 'bold', fontSize: '13px'}}>{renderPct(g.pct)}</div>
                              <div style={{fontSize: '8px', color: 'var(--text-muted)'}}>{g.label}</div>
                            </div>
                          );
                        })}
                      </div>

      const analyzeChampionships = () => {

                champs[c.name] = {

                  multigolCasa13: { total: 0, successi: 0 },

          if (matches && matches.length > 0) {

                  over15: { total: 0, successi: 0 }, 
                  '12under45': { total: 0, successi: 0 }, 
                  multigolCasa13: { total: 0, successi: 0 }, 
                  multigolOspite13: { total: 0, successi: 0 },
                  multigolCasa02: { total: 0, successi: 0 },
                  multigolOspite02: { total: 0, successi: 0 }
                };
              }
              const total = (m.golCasa || 0) + (m.golOspite || 0);
              const ch = champs[m.campionato];
              ch.over15.total++; 
              if (total > 1.5) ch.over15.successi++;
              ch['12under45'].total++; 
              if (m.golCasa !== m.golOspite && total < 4.5) ch['12under45'].successi++;
              ch.multigolCasa13.total++; 
              if (m.golCasa >= 1 && m.golCasa <= 3) ch.multigolCasa13.successi++;
              ch.multigolOspite13.total++; 
              if (m.golOspite >= 1 && m.golOspite <= 3) ch.multigolOspite13.successi++;
              ch.multigolCasa02.total++; 
              if (m.golCasa <= 2) ch.multigolCasa02.successi++;
              ch.multigolOspite02.total++; 
              if (m.golOspite <= 2) ch.multigolOspite02.successi++;
            });
          }
        } catch (e) {
          console.warn('Errore in analyzeChampionships:', e);
        }
        return champs;
      };
      
      const data = analyzeChampionships();
      let entries = Object.entries(data);
      entries.sort((a, b) => {
        const totalA = a[1]?.over15?.total || 0;
        const totalB = b[1]?.over15?.total || 0;

    // ============================================================
    // FUNZIONE DEDUPLICATE MATCHES
    // ============================================================

    const deduplicateMatches = (matches) => {
      const seen = new Map();
      const result = [];
      matches.forEach(m => {
        const campionato = (m.campionato || '').trim();
        const data = m.data || '';
        const casa = (m.casa || '').trim();
        const ospiti = (m.ospiti || '').trim();
        const key = `${campionato}|${data}|${casa}|${ospiti}`;
        if (!seen.has(key)) {
          seen.set(key, m);
          result.push(m);
        } else {
          const existing = seen.get(key);
          const existingScore = (existing.golCasa !== undefined && existing.golOspite !== undefined) ? 1 : 0;
          const newScore = (m.golCasa !== undefined && m.golOspite !== undefined) ? 1 : 0;
          if (newScore > existingScore) {
            seen.set(key, m);
            const idx = result.indexOf(existing);
            if (idx !== -1) result[idx] = m;
          } else if (newScore === existingScore) {
            if (m.stato === 'Giocata' && existing.stato !== 'Giocata') {
              seen.set(key, m);
              const idx = result.indexOf(existing);
              if (idx !== -1) result[idx] = m;
            }
          }
        }
      });
      return result;
    };

    const fetchWeatherForMatch = async (match) => {
      try {
        const city = getCityForMatch(match.casa, match.campionato);
        if (!city || city === 'N/D') return null;
        
        // Usa Open-Meteo per ottenere il meteo
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=41.90&longitude=12.50&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_sum,wind_speed_10m_max&timezone=Europe/Rome&start_date=${match.data}&end_date=${match.data}`);
        if (!response.ok) return null;
        
        const data = await response.json();
        if (!data.daily || !data.daily.time || data.daily.time.length === 0) return null;
        
        const idx = 0;
        const weatherCode = data.daily.weathercode?.[idx] || 0;
        const weatherMap = {
          0: 'Sereno', 1: 'Poco nuvoloso', 2: 'Parzialmente nuvoloso', 3: 'Coperto',
          45: 'Nebbia', 48: 'Nebbia',
          51: 'Pioviggine leggera', 53: 'Pioviggine moderata', 55: 'Pioviggine fitta',
          56: 'Pioviggine ghiacciata leggera', 57: 'Pioviggine ghiacciata fitta',
          61: 'Pioggia leggera', 63: 'Pioggia moderata', 65: 'Pioggia fitta',
          66: 'Pioggia ghiacciata leggera', 67: 'Pioggia ghiacciata fitta',
          71: 'Neve leggera', 73: 'Neve moderata', 75: 'Neve fitta',
          77: 'Neve a grani',
          80: 'Rovesci di pioggia leggeri', 81: 'Rovesci di pioggia moderati', 82: 'Rovesci di pioggia forti',
          85: 'Rovesci di neve leggeri', 86: 'Rovesci di neve forti',
          95: 'Temporale leggero', 96: 'Temporale con grandine leggera', 99: 'Temporale con grandine forte'
        };
        
        return {
          temp: data.daily.temperature_2m_max?.[idx] || data.current_weather.temperature || 15,
          temp_min: data.daily.temperature_2m_min?.[idx] || 10,
          temp_max: data.daily.temperature_2m_max?.[idx] || 20,
          weather: weatherMap[weatherCode] || 'N/A',
          rain: data.daily.precipitation_sum?.[idx] || 0,
          wind_speed: data.daily.wind_speed_10m_max?.[idx] || 3,
          forecast_date: match.data
        };
      } catch (e) {
        console.warn('Errore fetch meteo:', e);
        return null;
      }

        if (data && data.matches && data.matches.length > 0) {
          setMatches(data.matches);
          setChampionships(data.championships || []);
          
          const state = { 
            championships: data.championships || [], 
            matches: data.matches, 
            theme, 
            customTheme, 
            selectedFamiglie 
          };
          saveState(state);
          
          showAlert('success', `✅ Aggiornato con ${data.matches.length} partite!`);
        }
      };

      window.updateAppData = updateDataFromScraper;

        if (!selectedMatchId) return;
        const match = matches.find(m => m.id === selectedMatchId);
        if (!match) return;
        
        const weatherKey = `${match.campionato}_${match.data}`;
        if (weatherCache[weatherKey]) return;
        
        const loadWeather = async () => {
          try {
            const w = await fetchWeatherForMatch(match);
            if (w) {
              setWeatherCache(prev => ({ ...prev, [weatherKey]: w }));
            } else {
              setWeatherCache(prev => ({ ...prev, [weatherKey]: null }));
            }

                        {viewMode === 'mobile' 
                          ? '✅ La visuale è ottimizzata per schermi piccoli. Il contenuto si adatta automaticamente.'
                          : '✅ Visuale ottimizzata per schermi grandi. Massima visibilità dei dati.'}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            <div className="disclaimer-footer">
              <div style={{display: 'flex', gap: '12px', alignItems: 'flex-start', flexWrap: 'wrap'}}>
                <span style={{fontSize: '24px'}}>⚠️</span>
                <div style={{flex: 1}}>
                  <p style={{margin: '0 0 6px 0'}}>
                    <strong>⚠️ Disclaimer - Utilizzo in Centro Scommesse</strong>
                  </p>
                  <p style={{margin: '0 0 4px 0'}}>
                    Questa applicazione fornisce analisi statistiche a <strong>solo scopo informativo</strong>. 
                    I dati provengono da <strong>file caricati dall'utente</strong> (XLSX/CSV). 
                    Le percentuali e i pronostici sono <strong>elaborazioni matematiche non vincolanti</strong>.
                  </p>
                  <p style={{margin: '0 0 4px 0'}}>
                    <span className="highlight">⚠️ Le scommesse comportano rischi finanziari. Gioca responsabilmente.</span>
                  </p>
                  <p style={{margin: '0', fontSize: '10px', color: 'var(--text-muted)'}}>
                    I loghi e i nomi delle squadre sono di proprietà dei rispettivi titolari. 
                    L'uso commerciale dei dati richiede licenza specifica.
                  </p>
                </div>
              </div>
            </div>

            <button 
              className="home-btn-overlay" 
              onClick={() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }}
              title="Torna su"
            >
              🏠
            </button>
          </div>
        );
      };

      if (viewMode === 'mobile') {
        return (
          <div style={{display: 'flex', justifyContent: 'center', alignItems: 'flex-start', padding: '20px', minHeight: '100vh', background: '#0a0a1a'}}>
            <div className="phone-simulator">
              <div className="phone-notch">
                <div className="notch-speaker"></div>
                <div className="notch-camera"></div>
              </div>
              <div className="phone-screen">
                <div className="phone-scroll" style={{paddingTop: '32px'}}>
                  {renderAppContent()}
                </div>
                <div className="phone-home-indicator"></div>
              </div>
            </div>
          </div>
        );
      }

      return renderAppContent();
    }

    // ============================================================
    // AVVIA APP
    // ============================================================

    console.log('🚀 Avvio GesssAI-Pro - Caricamento da Excel...');

    // Svuota localStorage all'avvio per forzare il caricamento
    localStorage.removeItem('ft_matches');
    localStorage.removeItem('ft_champs');

    // Carica il file Excel
    loadScrapedData(true).then(data => {
      if (data && data.matches && data.matches.length > 0) {
        console.log(`✅ ${data.matches.length} partite caricate all'avvio!`);
        if (window.updateAppData) {
          window.updateAppData(data);
        }
      } else {
        console.warn('⚠️ Nessun dato caricato.');
        // Mostra un messaggio all'utente
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="text-align: center; padding: 50px; color: #e6edf3; background: #0f1419; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
              <div style="font-size: 64px; margin-bottom: 20px;">📂</div>
              <h2 style="color: #f39c12;">Caricamento dati...</h2>
              <p style="color: #8b949e; max-width: 500px; margin: 20px auto;">
                Il file <strong style="color: #e6edf3;">GesssAI_Input.xlsx</strong> non è stato trovato.
              </p>
              <p style="color: #8b949e; font-size: 14px;">
                Il file deve contenere le colonne: <br>
                <strong style="color: #e6edf3;">Campionato, Data, Squadra Casa, Squadra Ospite</strong>
              </p>
              <button onclick="window.location.reload()" style="margin-top: 20px; padding: 12px 30px; background: #f39c12; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">
                🔄 Ricarica
              </button>
            </div>
          `;
        }
      }
    });

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
