              matches.filter(m => m.stato === 'Giocata').forEach(m => {
                const weather = weatherCache[`${m.campionato}_${m.data}`];
                if (!weather) return;
                const total = m.golCasa + m.golOspite;
                const isOver25 = total > 2.5;
                const isOver35 = total > 3.5;
                const isGol = m.golCasa > 0 && m.golOspite > 0;
                let condition = 'sole';
                if (weather.rain > 1) condition = 'pioggia';
                else if (weather.wind_speed > 5) condition = 'vento';
                else if (weather.temp < 5) condition = 'freddo';
                analysis[condition].totale++;
                if (isOver25) analysis[condition].over25++;
                if (isOver35) analysis[condition].over35++;
                if (isGol) analysis[condition].gol++;
              });
              return analysis;
            };
            const data = analyzeWeatherImpact();
            const entries = Object.entries(data);
            if (entries.every(([_, s]) => s.totale === 0)) return null;
            return ( <
              div className = "card" >
              <
              h4 > 🌤️ Impatto Meteo sui Risultati < /h4> <
              div className = "weather-impact-grid" > {
                entries.map(([condition, stats]) => {
                  const pctOver25 = stats.totale ? Math.round((stats.over25 / stats.totale) * 100) : 0;
                  const pctOver35 = stats.totale ? Math.round((stats.over35 / stats.totale) * 100) : 0;
                  const pctGol = stats.totale ? Math.round((stats.gol / stats.totale) * 100) : 0;
                  const emoji = condition === 'pioggia' ? '🌧️' : (condition === 'vento' ? '💨' : (condition ===
                    'freddo' ? '❄️' : '☀️'));
                  return ( <
                    div key = { condition }
                    className = "weather-stat" >
                    <
                    div className = "weather-icon" > { emoji } < /div> <
                    div className = "weather-label" > { condition } < /div> <
                    div className = "weather-pct" > < span > Over 2.5: { pctOver25 } % < /span><div className="form-bar"><div className="form-bar-fill" style={{width:`${pctOver25}%`, background: pctOver25 > 60 ? 'var(--win)' : 'var(--draw)'}} /></div></div >
                    <
                    div className = "weather-pct" > < span > Over 3.5: { pctOver35 } % < /span><div className="form-bar"><div className="form-bar-fill" style={{width:`${pctOver35}%`, background: pctOver35 > 40 ? 'var(--win)' : 'var(--draw)'}} /></div></div >
                    <
                    div className = "weather-pct" > < span > Gol(GG): { pctGol } % < /span><div className="form-bar"><div className="form-bar-fill" style={{width:`${pctGol}%`, background: pctGol > 60 ? 'var(--win)' : 'var(--draw)'}} /></div></div >
                    <
                    div className = "weather-count" > 📊 { stats.totale } partite < /div> <
                    /div>
                  );
                })
              } <
              /div> <
              /div>
            );
          };

          // ============================================================
          // FUNZIONI PER SIMULAZIONE MONTE CARLO + POISSON
          // ============================================================

          const getTeamPoissonParams = (teamName, allMatches) => {
            const matches = allMatches.filter(m =>
              m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName)
            );

            if (matches.length < 3) {
              return { attacco: 1.2, difesa: 1.2, partite: matches.length };
            }

            let golFatti = 0,
              golSubiti = 0;
            matches.forEach(m => {
              const isHome = m.casa === teamName;
              golFatti += isHome ? m.golCasa : m.golOspite;
              golSubiti += isHome ? m.golOspite : m.golCasa;
            });

            const mediaFatti = golFatti / matches.length;
            const mediaSubiti = golSubiti / matches.length;

            const leagueAvg = 1.35;
            const attacco = Math.max(0.3, mediaFatti / leagueAvg);
            const difesa = Math.max(0.3, mediaSubiti / leagueAvg);

            return { attacco, difesa, partite: matches.length };
          };

          const simulatePoissonMatch = (lambdaCasa, lambdaOspite) => {
            const poisson = (lambda) => {
              if (lambda < 0) lambda = 0;
              let L = Math.exp(-lambda);
              let k = 0;
              let p = 1;
              do {
                k++;
                p *= Math.random();
              } while (p > L);
              return k - 1;
            };

            const randomFactorCasa = 0.85 + Math.random() * 0.3;
            const randomFactorOspite = 0.85 + Math.random() * 0.3;

            return {
              golCasa: poisson(lambdaCasa * randomFactorCasa),
              golOspite: poisson(lambdaOspite * randomFactorOspite)
            };
          };

          const simulateMatches = (homeTeam, awayTeam, allMatches, numSimulations = 1000) => {
            const homeParams = getTeamPoissonParams(homeTeam, allMatches);
            const awayParams = getTeamPoissonParams(awayTeam, allMatches);

            const homeAttacco = Math.max(0.5, homeParams.attacco);
            const homeDifesa = Math.max(0.5, homeParams.difesa);
            const awayAttacco = Math.max(0.5, awayParams.attacco);
            const awayDifesa = Math.max(0.5, awayParams.difesa);

            const lambdaCasa = homeAttacco * awayDifesa * 1.1;
            const lambdaOspite = awayAttacco * homeDifesa * 0.9;

            let homeWins = 0,
              draws = 0,
              awayWins = 0;
            let over15 = 0,
              over25 = 0,
              over35 = 0,
              over45 = 0;
            let under15 = 0,
              under25 = 0,
              under35 = 0,
              under45 = 0;
            let gg = 0,
              ng = 0;
            let risultati = {};

            for (let i = 0; i < numSimulations; i++) {
              const result = simulatePoissonMatch(lambdaCasa, lambdaOspite);
              const golCasa = result.golCasa;
              const golOspite = result.golOspite;
              const total = golCasa + golOspite;

              if (golCasa > golOspite) homeWins++;
              else if (golCasa === golOspite) draws++;
              else awayWins++;

              if (total > 1.5) over15++;
              else under15++;
              if (total > 2.5) over25++;
              else under25++;
              if (total > 3.5) over35++;
              else under35++;
              if (total > 4.5) over45++;
              else under45++;

              if (golCasa > 0 && golOspite > 0) gg++;
              else ng++;

              const key = `${golCasa}-${golOspite}`;
              if (!risultati[key]) risultati[key] = 0;
              risultati[key]++;
            }

            const n = numSimulations;
            const pct = (val) => Math.round((val / n) * 100);

            let maxResult = '';
            let maxCount = 0;
            for (const [key, count] of Object.entries(risultati)) {
              if (count > maxCount) {
                maxCount = count;
                maxResult = key;
              }
            }

            let count12Under45 = 0;
            for (const [key, count] of Object.entries(risultati)) {
              const parts = key.split('-');
              const gC = parseInt(parts[0]);
              const gO = parseInt(parts[1]);
              if (gC !== gO && (gC + gO) < 4.5) {
                count12Under45 += count;
              }
            }
            const pct12Under45 = Math.round((count12Under45 / n) * 100);

            let countCombinata02_02 = 0;
            for (const [key, count] of Object.entries(risultati)) {
              const parts = key.split('-');
              const gC = parseInt(parts[0]);
              const gO = parseInt(parts[1]);
              if (gC <= 2 && gO <= 2) {
                countCombinata02_02 += count;
              }
            }
            const pctCombinata02_02 = Math.round((countCombinata02_02 / n) * 100);

            let countCombinata13_13 = 0;
            for (const [key, count] of Object.entries(risultati)) {
              const parts = key.split('-');
              const gC = parseInt(parts[0]);
              const gO = parseInt(parts[1]);
              if (gC >= 1 && gC <= 3 && gO >= 1 && gO <= 3) {
                countCombinata13_13 += count;
              }
            }
            const pctCombinata13_13 = Math.round((countCombinata13_13 / n) * 100);

            let countCombinata02_13 = 0;
            for (const [key, count] of Object.entries(risultati)) {
              const parts = key.split('-');
              const gC = parseInt(parts[0]);
              const gO = parseInt(parts[1]);
              if (gC <= 2 && gO >= 1 && gO <= 3) {
                countCombinata02_13 += count;
              }
            }
            const pctCombinata02_13 = Math.round((countCombinata02_13 / n) * 100);

            let countCombinata13_02 = 0;
            for (const [key, count] of Object.entries(risultati)) {
              const parts = key.split('-');
              const gC = parseInt(parts[0]);
              const gO = parseInt(parts[1]);
              if (gC >= 1 && gC <= 3 && gO <= 2) {
                countCombinata13_02 += count;
              }
            }
            const pctCombinata13_02 = Math.round((countCombinata13_02 / n) * 100);

            let countCombinata25_25 = 0;
            for (const [key, count] of Object.entries(risultati)) {
              const parts = key.split('-');
              const gC = parseInt(parts[0]);
              const gO = parseInt(parts[1]);
              if (gC >= 2 && gC <= 5 && gO >= 2 && gO <= 5) {
                countCombinata25_25 += count;
              }
            }
            const pctCombinata25_25 = Math.round((countCombinata25_25 / n) * 100);

            const combinazioni = [
              { label: '0-2 + 0-2', pct: pctCombinata02_02 },
              { label: '1-3 + 1-3', pct: pctCombinata13_13 },
              { label: '0-2 + 1-3', pct: pctCombinata02_13 },
              { label: '1-3 + 0-2', pct: pctCombinata13_02 },
              { label: '2-5 + 2-5', pct: pctCombinata25_25 }
            ];

            let bestCombinata = combinazioni[0];
            for (const c of combinazioni) {
              if (c.pct > bestCombinata.pct) {
                bestCombinata = c;
              }
            }

            return {
              homeWins: pct(homeWins),
              draws: pct(draws),
              awayWins: pct(awayWins),
              over15: pct(over15),
              under15: pct(under15),
              over25: pct(over25),
              under25: pct(under25),
              over35: pct(over35),
              under35: pct(under35),
              over45: pct(over45),
              under45: pct(under45),
              gg: pct(gg),
              ng: pct(ng),
              pct12Under45: pct12Under45,
              maxResult: maxResult,
              maxResultPct: pct(maxCount),
              lambdaCasa: lambdaCasa.toFixed(2),
              lambdaOspite: lambdaOspite.toFixed(2),
              homeAttacco: homeAttacco.toFixed(2),
              homeDifesa: homeDifesa.toFixed(2),
              awayAttacco: awayAttacco.toFixed(2),
              awayDifesa: awayDifesa.toFixed(2),
              partiteAnalizzate: Math.min(homeParams.partite, awayParams.partite),
              numSimulations: n,
              risultati,
              combinataLabel: bestCombinata.label,
              combinataPct: bestCombinata.pct,
              combinazioni: combinazioni
            };
          };

          // ============================================================
          // FUNZIONE PER IL RIEPILOGO INTELLIGENTE
          // ============================================================

          const generateSummary = (mc, match, allMatches) => {
            // Calcola xG per le due squadre (dai dati reali)
            const homeForm = calcFormAndStats(allMatches, match.casa);
            const awayForm = calcFormAndStats(allMatches, match.ospiti);

            const xGCasa = parseFloat(homeForm.mediaGolFatti) || 0;
            const xGOspite = parseFloat(awayForm.mediaGolFatti) || 0;

            const lambdaCasa = parseFloat(mc.lambdaCasa) || 0;
            const lambdaOspite = parseFloat(mc.lambdaOspite) || 0;

            // Calcola differenze
            const diffLambda = lambdaCasa - lambdaOspite;
            const diffXG = xGCasa - xGOspite;

            // Determina se i dati sono affidabili
            const partiteAnalizzate = mc.partiteAnalizzate || 0;

            // Determina quale metrica è più affidabile
            let metricaConsigliata = '';
            let motivazione = '';

            if (partiteAnalizzate < 5) {
              metricaConsigliata = 'xG';
              motivazione =
                `⚠️ Solo ${partiteAnalizzate} partite analizzate. I dati λ non sono affidabili. Usa xG come riferimento principale.`;
            } else if (partiteAnalizzate < 10) {
              metricaConsigliata = 'xG + λ';
              motivazione =
                `ℹ️ ${partiteAnalizzate} partite analizzate. I dati λ sono ancora limitati. Confronta xG e λ per una visione bilanciata.`;
            } else {
              metricaConsigliata = 'λ + xG';
              motivazione =
                `✅ ${partiteAnalizzate} partite analizzate. I dati λ sono affidabili. Usali come base, confermali con xG.`;
            }

            // Determina il favorito
            let favorito = '';
            let confidenza = '';

            const diffMedia = (lambdaCasa + xGCasa) / 2 - (lambdaOspite + xGOspite) / 2;

            if (diffMedia > 0.5) {
              favorito = `🏠 ${match.casa}`;
              confidenza = 'ALTA';
            } else if (diffMedia > 0.2) {
              favorito = `🏠 ${match.casa}`;
              confidenza = 'MEDIA';
            } else if (diffMedia > -0.2) {
              favorito = '🤝 Pareggio';
              confidenza = 'MEDIA';
            } else if (diffMedia > -0.5) {
              favorito = `✈️ ${match.ospiti}`;
              confidenza = 'MEDIA';
            } else {
              favorito = `✈️ ${match.ospiti}`;
              confidenza = 'ALTA';
            }

            // Calcola previsione Over/Under
            const totaleLambda = lambdaCasa + lambdaOspite;
            const totaleXG = xGCasa + xGOspite;
            const totaleMedio = (totaleLambda + totaleXG) / 2;

            let overUnder = '';
            let overUnderPct = '';

            if (totaleMedio > 2.8) {
              overUnder = '⬆️ OVER 2.5';
              overUnderPct = 'Alta probabilità (≈70%)';
            } else if (totaleMedio > 2.2) {
              overUnder = '↕️ OVER/UNDER 2.5';
              overUnderPct = 'Bilanciato (≈50%)';
            } else {
              overUnder = '⬇️ UNDER 2.5';
              overUnderPct = 'Alta probabilità (≈70%)';
            }

            // Probabilità GG (entrambi segnano)
            const probCasaSegna = Math.min(1, lambdaCasa / 1.5);
            const probOspiteSegna = Math.min(1, lambdaOspite / 1.5);
            const probGG = Math.round((probCasaSegna * probOspiteSegna) * 100);

            let ggGiudizio = '';
            if (probGG > 60) {
              ggGiudizio = '✅ BUONA PROBABILITÀ (entrambi segnano)';
            } else if (probGG > 40) {
              ggGiudizio = '⚠️ 50/50 (entrambi segnano)';
            } else {
              ggGiudizio = '❌ BASSA PROBABILITÀ (entrambi segnano)';
            }

            return {
              xGCasa,
              xGOspite,
              lambdaCasa,
              lambdaOspite,
              diffLambda,
              diffXG,
              partiteAnalizzate,
              metricaConsigliata,
              motivazione,
              favorito,
              confidenza,
              overUnder,
              overUnderPct,
              probGG,
              ggGiudizio,
              totaleMedio
            };
          };

          // ============================================================
          // COMPONENTE AI ANALYSIS (SOLO MONTE CARLO)
          // ============================================================

          const AIAnalysis = ({ match, allMatches, selectedFamiglie }) => {
            const [monteCarloResult, setMonteCarloResult] = useState(null);
            const [simulationLoading, setSimulationLoading] = useState(false);
            const [error, setError] = useState(null);

            const runMonteCarloSimulation = (homeTeam, awayTeam, allMatches) => {
              setSimulationLoading(true);
              setError(null);
              try {
                const result = simulateMatches(homeTeam, awayTeam, allMatches, 10000);
                setMonteCarloResult(result);
                const storageKey = `ft_mc_${match.id}`;
                localStorage.setItem(storageKey, JSON.stringify(result));
                return result;
              } catch (e) {
                console.warn('Errore simulazione Monte Carlo:', e);
                setError('Errore durante la simulazione: ' + e.message);
                return null;
              } finally {
                setSimulationLoading(false);
              }
            };

            useEffect(() => {
              if (!match) return;
              const storageKey = `ft_mc_${match.id}`;
              const saved = localStorage.getItem(storageKey);
              if (saved) {
                try {
                  setMonteCarloResult(JSON.parse(saved));
                  setError(null);
                  return;
                } catch (e) {}
              }
              if (match && allMatches.length > 0) {
                runMonteCarloSimulation(match.casa, match.ospiti, allMatches);
              }
            }, [match]);

            const refreshAnalysis = () => {
              if (match) {
                const storageKey = `ft_mc_${match.id}`;
                localStorage.removeItem(storageKey);
                setMonteCarloResult(null);
                runMonteCarloSimulation(match.casa, match.ospiti, allMatches);
              }
            };

            if (!match) return null;

            if (simulationLoading) {
              return < div className = "ai-analysis-loading" > ⏳ Simulazione Monte Carlo in corso...(10000 partite
              simulate) < /div>;
            }

            if (error) {
              return ( <
                div className = "ai-analysis-error" >
                <
                span > ⚠️ { error } < /span> <
                div style = { { marginTop: '8px' } } >
                <
                button className = "btn-go-key"
                onClick = { refreshAnalysis } > 🔄 Riprova < /button> <
                /div> <
                /div>
              );
            }

            if (!monteCarloResult) {
              return ( <
                div className = "card" >
                <
                p style = { { color: 'var(--text-muted)', marginBottom: '8px' } } > ⏳ Caricamento simulazione Monte
                Carlo... < /p> <
                button className = "btn"
                onClick = {
                  () => runMonteCarloSimulation(match.casa, match.ospiti, allMatches) } > 📊 Avvia Simulazione <
                /button> <
                /div>
              );
            }

            const mc = monteCarloResult;

            const renderPctBox = (value, label, icon = '') => {
              const rounded = Math.round(value);
              const cls = getPercentualeClasse(rounded);
              const isBomb = rounded >= 90;
              return ( <
                div style = {{
                  background: 'var(--card)',
                  padding: '12px 16px',
                  borderRadius: '8px',
                  textAlign: 'center',
                  border: isBomb ? '2px solid var(--accent)' : '1px solid var(--border)',
                  flex: '1',
                  minWidth: '100px'
                } } >
                <
                div style = { { fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase',
                    fontWeight: 'bold' } } >
                { icon } { label } <
                /div> <
                div style = { { fontSize: '28px', fontWeight: 'bold', marginTop: '4px' } } >
                <
                span className = { `giocata-pct ${cls}` } >
                { rounded } % { isBomb && < span className = "bomb-icon" > 💣 < /span>} <
                /span> <
                /div> <
                /div>
              );
            };

            const calculatePctFromSimulation = (familyId, giocata) => {
              const totalSim = mc.numSimulations || 10000;

              if (familyId === 'fisse') {
                if (giocata === '1') return mc.homeWins || 0;
                if (giocata === 'X') return mc.draws || 0;
                if (giocata === '2') return mc.awayWins || 0;
              }

              if (familyId === 'dc') {
                const dcParts = {
                  '1X': Math.round(((mc.homeWins || 0) + (mc.draws || 0)) / 2),
                  '12': Math.round(((mc.homeWins || 0) + (mc.awayWins || 0)) / 2),
                  'X2': Math.round(((mc.draws || 0) + (mc.awayWins || 0)) / 2)
                };
                return dcParts[giocata] || 0;
              }

              if (familyId === 'over') {
                const overMap = {
                  'Over 1.5': mc.over15 || 0,
                  'Over 2.5': mc.over25 || 0,
                  'Over 3.5': mc.over35 || 0,
                  'Over 4.5': mc.over45 || 0
                };
                return overMap[giocata] || 0;
              }

              if (familyId === 'under') {
                const underMap = {
                  'Under 1.5': mc.under15 || 0,
                  'Under 2.5': mc.under25 || 0,
                  'Under 3.5': mc.under35 || 0,
                  'Under 4.5': mc.under45 || 0
                };
                return underMap[giocata] || 0;
              }

              if (familyId === 'multigol') {
                let countMG = 0;
                for (const [key, count] of Object.entries(mc.risultati || {})) {
                  const [gC, gO] = key.split('-').map(Number);
                  const total = gC + gO;
                  let matchMG = false;
                  if (giocata === '0-2' && total <= 2) matchMG = true;
                  else if (giocata === '1-3' && total >= 1 && total <= 3) matchMG = true;
                  else if (giocata === '1-4' && total >= 1 && total <= 4) matchMG = true;
                  else if (giocata === '2-5' && total >= 2 && total <= 5) matchMG = true;
                  if (matchMG) countMG += count;
                }
                return Math.round((countMG / totalSim) * 100);
              }

              if (familyId === 'dc_under') {
                const dcPart = giocata.split('+')[0];
                const underPart = giocata.split('+')[1];
                let dcPct = 0;
                if (dcPart === '1X') dcPct = Math.round(((mc.homeWins || 0) + (mc.draws || 0)) / 2);
                else if (dcPart === '12') dcPct = Math.round(((mc.homeWins || 0) + (mc.awayWins || 0)) / 2);
                else if (dcPart === 'X2') dcPct = Math.round(((mc.draws || 0) + (mc.awayWins || 0)) / 2);
                let underPct = 0;
                if (underPart === 'U1.5') underPct = mc.under15 || 0;
                else if (underPart === 'U2.5') underPct = mc.under25 || 0;
                else if (underPart === 'U3.5') underPct = mc.under35 || 0;
                else if (underPart === 'U4.5') underPct = mc.under45 || 0;
                return Math.round((dcPct + underPct) / 2);
              }

              if (familyId === 'dc_over') {
                const dcPart = giocata.split('+')[0];
                const overPart = giocata.split('+')[1];
                let dcPct = 0;
                if (dcPart === '1X') dcPct = Math.round(((mc.homeWins || 0) + (mc.draws || 0)) / 2);
                else if (dcPart === '12') dcPct = Math.round(((mc.homeWins || 0) + (mc.awayWins || 0)) / 2);
                else if (dcPart === 'X2') dcPct = Math.round(((mc.draws || 0) + (mc.awayWins || 0)) / 2);
                let overPct = 0;
                if (overPart === 'O1.5') overPct = mc.over15 || 0;
                else if (overPart === 'O2.5') overPct = mc.over25 || 0;
                else if (overPart === 'O3.5') overPct = mc.over35 || 0;
                else if (overPart === 'O4.5') overPct = mc.over45 || 0;
                return Math.round((dcPct + overPct) / 2);
              }

              if (familyId === 'mg_casa_ospite') {
                const parts = giocata.split('+');
                let countMatch = 0;
                for (const [key, count] of Object.entries(mc.risultati || {})) {
                  const [gC, gO] = key.split('-').map(Number);
                  let matchCasa = false;
                  let matchOspite = false;
                  if (parts[0] === '0-1' && gC <= 1) matchCasa = true;
                  else if (parts[0] === '0-2' && gC <= 2) matchCasa = true;
                  else if (parts[0] === '1-3' && gC >= 1 && gC <= 3) matchCasa = true;
                  else if (parts[0] === '2-5' && gC >= 2 && gC <= 5) matchCasa = true;

                  if (parts[1] === '0-1' && gO <= 1) matchOspite = true;
                  else if (parts[1] === '0-2' && gO <= 2) matchOspite = true;
                  else if (parts[1] === '1-3' && gO >= 1 && gO <= 3) matchOspite = true;
                  else if (parts[1] === '2-5' && gO >= 2 && gO <= 5) matchOspite = true;

                  if (matchCasa && matchOspite) countMatch += count;
                }
                return Math.round((countMatch / totalSim) * 100);
              }

              if (familyId === 'dc_multigol') {

            // ============================================================
            // COMPONENTE WEATHER PROFESSIONALE

            const WeatherProfessionale = ({ weatherData, city, matchDate }) => {
              if (!weatherData) {

                  div className = "weather-professionale"
                  style = { { textAlign: 'center', color: 'var(--text-muted)' } } >

                  div style = { { fontSize: '48px', marginBottom: '8px' } } > 🌤️ < /div> <

                  p style = { { fontSize: '12px' } } > Open - Meteo è gratuito e non richiede chiave API < /p> <
                  /div>
                );
              }

              const getWeatherIcon = (desc, rain) => {
                if (!desc) return '🌤️';
                const d = desc.toLowerCase();
                if (rain > 5) return '🌧️';
                if (rain > 1) return '🌦️';
                if (d.includes('sereno')) return '☀️';
                if (d.includes('nuvoloso') || d.includes('coperto')) return '☁️';
                if (d.includes('nebbia')) return '🌫️';
                if (d.includes('pioggia')) return '🌧️';
                if (d.includes('temporale')) return '⛈️';
                if (d.includes('neve')) return '❄️';
                return '🌤️';
              };

              const getRiskLevel = (weather) => {
                let risk = 0;
                if (weather.rain > 5) risk += 3;
                else if (weather.rain > 1) risk += 2;
                else if (weather.rain > 0.5) risk += 1;
                if (weather.wind_speed > 15) risk += 3;
                else if (weather.wind_speed > 10) risk += 2;
                else if (weather.wind_speed > 5) risk += 1;
                if (weather.temp < -5 || weather.temp > 35) risk += 2;
                else if (weather.temp < 0 || weather.temp > 30) risk += 1;
                if (weather.weather && (weather.weather.includes('Temporale') || weather.weather.includes('temporale')))
                  risk += 3;

                if (risk >= 6) return { level: 'high', label: '🔴 ALTO - Rischio di rinvio o condizioni proibitive',
                  color: 'var(--lose)' };
                if (risk >= 4) return { level: 'medium', label: '🟡 MEDIO - Possibili difficoltà per i giocatori',
                  color: 'var(--draw)' };
                if (risk >= 2) return { level: 'low', label: '🟢 BASSO - Condizioni accettabili', color: 'var(--win)' };
                return { level: 'low', label: '🟢 OTTIMALE - Condizioni perfette per il calcio', color: 'var(--win)' };
              };

              const risk = getRiskLevel(weatherData);
              const icon = getWeatherIcon(weatherData.weather, weatherData.rain);

              return ( <
                div className = "weather-professionale" >
                <
                div className = "weather-header" >
                <
                div className = "weather-icon-main" > { icon } < /div> <
                div className = "weather-info-main" >
                <
                div className = "weather-temp-main" > { Math.round(weatherData.temp) } °C < /div> <
                div className = "weather-desc-main" > { weatherData.weather || 'N/A' } < /div> <
                div className = "weather-city-main" > 📍 { city || 'Località non specificata' } • 📅 { weatherData
                    .forecast_date || matchDate || 'N/A' } < /div> <
                /div> <
                div style = { { textAlign: 'right', minWidth: '100px' } } >
                <
                div style = { { fontSize: '14px', color: 'var(--text-muted)' } } > Temp.min / max < /div> <
                div style = { { fontSize: '20px', fontWeight: 'bold', color: 'var(--accent)' } } >
                { Math.round(weatherData.temp_min) } ° / { Math.round(weatherData.temp_max) } ° <
                /div> <
                /div> <
                /div>

                <
                div className = "weather-details-grid" >
                <
                div className = "weather-detail-item" >
                <
                div className = "wd-icon" > 💨 < /div> <
                div className = "wd-value" > { Math.round(weatherData.wind_speed) } m / s < /div> <
                div className = "wd-label" > Vento < /div> <
                /div> <
                div className = "weather-detail-item" >
                <
                div className = "wd-icon" > 🌧️ < /div> <
                div className = "wd-value" > { weatherData.rain > 0 ? weatherData.rain + ' mm' : '0 mm' } < /div> <
                div className = "wd-label" > Precipitazioni < /div> <
                /div> <
                /div>

                <
                div className = "weather-risk" >
                <
                span className = "risk-icon" > ⚠️ < /span> <
                span className = "risk-text" > < b > Valutazione meteo: < /b> { risk.label } < /span> <
                span className = { `risk-badge ${risk.level}` } > { risk.level.toUpperCase() } < /span> <
                /div> <
                /div>
              );
            };

            // ============================================================
            // COMPONENTE CITTÀ METEO
            // ============================================================

            const CittaMeteo = ({ matches }) => {
              const [cities, setCities] = useState([]);
              useEffect(() => {
                const uniqueCities = new Set();
                matches.forEach(m => {
                  const city = getCityForMatch(m.casa, m.campionato);
                  if (city) uniqueCities.add(city);
                });
                setCities(Array.from(uniqueCities).sort());
              }, [matches]);
              return ( <
                div className = "card" >
                <
                h4 > 🌍 Città Meteo({ cities.length }) < /h4> <
                div className = "citta-meteo-grid" > {
                  cities.map(city => {
                    const squadre = matches.filter(m => getCityForMatch(m.casa, m.campionato) === city).map(m =>
                      m.casa);
                    const uniqueSquadre = [...new Set(squadre)];
                    return ( <
                      div key = { city }
                      className = "citta-meteo-item" >
                      <
                      span className = "citta-nome" > 📍 { city } < /span> <
                      span className = "citta-squadre" > { uniqueSquadre.slice(0, 3).join(', ') } { uniqueSquadre
                          .length > 3 ? ` +${uniqueSquadre.length - 3}` : '' } <
                      /span> <
                      /div>
                    );
                  })
                } <
                /div> <
                div style = { { fontSize: '11px', color: 'var(--text-muted)', marginTop: '8px' } } > 💡 Open - Meteo è
                gratuito e non richiede chiave API < /div> <
                /div>
              );
            };

            // ============================================================
            // COMPONENTE FILE IMPORTER
            // ============================================================

            const FileImporter = ({ matches, setMatches, championships, setChampionships, loading, setLoading,
              showAlert }) => {
              const [file, setFile] = useState(null);
              const [parsedData, setParsedData] = useState([]);
              const [columns, setColumns] = useState([]);
              const [mapping, setMapping] = useState({
                campionato: '',
                giornata: '',
                data: '',
                ora: '',
                squadraCasa: '',
                squadraOspite: '',
                golCasa: '',
                golOspite: '',
                stato: '',
                risultato: ''
              });
              const [previewRows, setPreviewRows] = useState([]);
              const [isDragging, setIsDragging] = useState(false);
              const [importing, setImporting] = useState(false);
              const fileInputRef = useRef(null);

              const requiredFields = ['campionato', 'data', 'squadraCasa', 'squadraOspite'];

              const handleFileDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                  processFile(files[0]);
                }
              };

              const handleFileSelect = (e) => {
                const files = e.target.files;
                if (files.length > 0) {
                  processFile(files[0]);
                }
              };

              const processFile = (file) => {
                const validTypes = ['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                  'application/vnd.ms-excel', 'text/csv'
                ];
                const ext = file.name.split('.').pop().toLowerCase();
                if (!validTypes.includes(file.type) && !['xlsx', 'xls', 'csv'].includes(ext)) {
                  showAlert('error', '❌ Formato non supportato. Usa .xlsx, .xls o .csv');
                  return;
                }

                setFile(file);
                setImporting(true);
                const reader = new FileReader();
                reader.onload = (e) => {
                  try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

                    if (jsonData.length === 0) {
                      showAlert('error', '❌ Il file è vuoto o non contiene dati leggibili.');
                      setImporting(false);
                      return;
                    }

                    const cols = Object.keys(jsonData[0]);
                    setColumns(cols);
                    setParsedData(jsonData);
                    setPreviewRows(jsonData.slice(0, 10));

                    const autoMapping = {};
                    const colLower = cols.map(c => c.toLowerCase().trim());

                    const findCol = (keywords) => {
                      for (const keyword of keywords) {
                        const index = colLower.findIndex(c => c.includes(keyword));
                        if (index !== -1) return cols[index];
                      }
                      return '';
                    };

                    autoMapping.campionato = findCol(['campionato', 'league', 'camp', 'campionato']);
                    autoMapping.giornata = findCol(['giornata', 'round', 'giorn', 'wk']);
                    autoMapping.data = findCol(['data', 'date', 'giorno']);
                    autoMapping.ora = findCol(['ora', 'time', 'orario', 'hour']);
                    autoMapping.squadraCasa = findCol(['squadra casa', 'home', 'casa', 'home team', 'home_team']);
                    autoMapping.squadraOspite = findCol(['squadra ospite', 'away', 'ospite', 'away team', 'away_team']);
                    autoMapping.golCasa = findCol(['gol casa', 'home goals', 'goal casa', 'home_goals']);
                    autoMapping.golOspite = findCol(['gol ospite', 'away goals', 'goal ospite', 'away_goals']);
                    autoMapping.stato = findCol(['stato', 'status', 'risultato', 'result']);
                    autoMapping.risultato = findCol(['risultato', 'result', 'score', 'ris']);

                    setMapping(autoMapping);

                    const previewWithStatus = getPreviewWithStatus(jsonData.slice(0, 10));
                    setPreviewRows(previewWithStatus);

                    const giocateCount = previewWithStatus.filter(r => r['Stato (calcolato)'] === 'Giocata').length;
                    const futureCount = previewWithStatus.filter(r => r['Stato (calcolato)'] === 'Futura').length;

                    showAlert('info',
                      `📊 Caricate ${jsonData.length} righe. ` +
                      `🟢 ${giocateCount} partite con risultato (Giocate), ` +
                      `🔵 ${futureCount} partite senza risultato (Future). ` +
                      `Verifica il mapping delle colonne.`
                    );
                  } catch (err) {
                    console.error(err);
                    showAlert('error', '❌ Errore nella lettura del file: ' + err.message);
                  }
                  setImporting(false);
                };
                reader.readAsArrayBuffer(file);
              };

              const getPreviewWithStatus = (rows) => {
                return rows.map(row => {
                  let risultato = '';
                  const colonneRisultato = ['Risultato', 'Result', 'Score', 'Ris', 'risultato'];
                  for (const col of colonneRisultato) {
                    if (row[col]) {
                      const val = row[col].toString().trim();
                      if (val && val !== '') {
                        risultato = val;
                        break;
                      }
                    }
                  }

                  if (!risultato) {
                    for (const key of Object.keys(row)) {
                      const val = row[key].toString().trim();
                      if (val && /^\d+[-–:.]\d+$/.test(val)) {
                        risultato = val;
                        break;
                      }
                    }
                  }

                  const stato = (risultato && risultato !== '') ? 'Giocata' : 'Futura';

                  return {
                    ...row,
                    'Stato (calcolato)': stato,
                    'Risultato trovato': risultato || '-'
                  };
                });
              };

              const handleMappingChange = (field, value) => {
                setMapping(prev => ({ ...prev, [field]: value }));

                if (parsedData.length > 0) {
                  const previewWithStatus = getPreviewWithStatus(parsedData.slice(0, 10));
                  setPreviewRows(previewWithStatus);
                }
              };

              const isMappingValid = () => {
                return requiredFields.every(f => mapping[f] && mapping[f].trim() !== '');
              };

              const importFromFile = () => {
                if (!isMappingValid()) {
                  showAlert('error', '❌ Devi mappare almeno: Campionato, Data, Squadra Casa, Squadra Ospite.');
                  return;
                }

                if (parsedData.length === 0) {
                  showAlert('error', '❌ Nessun dato da importare.');
                  return;
                }

                setImporting(true);
                setLoading(true);

                try {
                  const existingKeys = new Set(matches.map(m =>
                  `${m.campionato}|${m.data}|${m.ora}|${m.casa}|${m.ospiti}`));
                  const newMatches = [];
                  const championshipsSet = new Set(championships.map(c => c.name));
                  let importedCount = 0;
                  let skippedCount = 0;
                  let giocateCount = 0;
                  let futureCount = 0;

                  for (const row of parsedData) {
                    const campionato = row[mapping.campionato]?.toString().trim() || 'Sconosciuto';
                    const giornata = row[mapping.giornata]?.toString().trim() || 'N/A';
                    const dataRaw = row[mapping.data]?.toString().trim() || '';
                    const oraRaw = row[mapping.ora]?.toString().trim() || '';
                    const squadraCasa = row[mapping.squadraCasa]?.toString().trim() || '';
                    const squadraOspite = row[mapping.squadraOspite]?.toString().trim() || '';
                    const risultatoRaw = row[mapping.risultato]?.toString().trim() || '';
                    const golCasaRaw = row[mapping.golCasa]?.toString().trim();
                    const golOspiteRaw = row[mapping.golOspite]?.toString().trim();
                    const statoRaw = row[mapping.stato]?.toString().trim().toLowerCase() || '';

                    if (!squadraCasa || !squadraOspite) {
                      skippedCount++;
                      continue;
                    }

                    let dataNormalizzata = normalizeDate(dataRaw);
                    if (!dataNormalizzata) {
                      skippedCount++;
                      continue;
                    }

                    let stato = 'Futura';
                    let golCasa = 0;
                    let golOspite = 0;
                    let risultato = '';

                    if (risultatoRaw && risultatoRaw !== '') {
                      const matchResult = risultatoRaw.match(/(\d+)\s*[-–:.]\s*(\d+)/);
                      if (matchResult) {
                        golCasa = parseInt(matchResult[1], 10);
                        golOspite = parseInt(matchResult[2], 10);
                        risultato = `${golCasa}-${golOspite}`;
                      }
                    }

                    if (golCasaRaw && golCasaRaw !== '' && !isNaN(parseFloat(golCasaRaw))) {
                      golCasa = parseFloat(golCasaRaw);
                    }
                    if (golOspiteRaw && golOspiteRaw !== '' && !isNaN(parseFloat(golOspiteRaw))) {
                      golOspite = parseFloat(golOspiteRaw);
                    }

                    if (statoRaw === 'giocata' || statoRaw === 'played' || statoRaw === 'finished') {
                      stato = 'Giocata';
                    }

                    if (risultato && risultato !== '') {
                      stato = 'Giocata';
                    }

                    if (!risultato || risultato === '') {
                      stato = 'Futura';
                      golCasa = 0;
                      golOspite = 0;
                    }

                    const key = `${campionato}|${dataNormalizzata}|${oraRaw}|${squadraCasa}|${squadraOspite}`;
                    if (existingKeys.has(key)) {
                      skippedCount++;
                      continue;
                    }
                    existingKeys.add(key);

                    const newMatch = {
                      id: Math.random().toString(36).slice(2) + Date.now().toString(36),
                      campionato: campionato,
                      round: giornata,
                      data: dataNormalizzata,
                      ora: oraRaw || 'TBD',
                      casa: squadraCasa,
                      ospiti: squadraOspite,
                      stato: stato,
                      golCasa: stato === 'Giocata' ? golCasa : 0,
                      golOspite: stato === 'Giocata' ? golOspite : 0,
                      risultato: stato === 'Giocata' ? `${golCasa}-${golOspite}` : '',
                      citta: 'N/D',
                      _fromFile: true
                    };

                    newMatches.push(newMatch);

                    if (stato === 'Giocata') {
                      giocateCount++;
                    } else {
                      futureCount++;
                    }

                    if (!championshipsSet.has(campionato)) {
                      championshipsSet.add(campionato);
                    }
                    importedCount++;
                  }

                  const allMatches = [...matches, ...newMatches];
                  const uniqueMatches = deduplicateMatches(allMatches);

                  const newChampionships = Array.from(championshipsSet).map(name => ({
                    name,
                    importedAt: new Date().toISOString()
                  }));
                  setChampionships(newChampionships);
                  setMatches(uniqueMatches);

                  const duplicatesRemoved = (matches.length + newMatches.length) - uniqueMatches.length;

                  showAlert('success',
                    `✅ Importate ${importedCount} partite! ` +
                    `🟢 ${giocateCount} Giocate, 🔵 ${futureCount} Future. ` +
                    `${skippedCount > 0 ? `(${skippedCount} righe saltate)` : ''}` +
                    `${duplicatesRemoved > 0 ? ` (${duplicatesRemoved} duplicati rimossi)` : ''}`
                  );

                  setFile(null);
                  setParsedData([]);
                  setPreviewRows([]);
                  setColumns([]);
                  setMapping({
                    campionato: '',
                    giornata: '',
                    data: '',
                    ora: '',
                    squadraCasa: '',
                    squadraOspite: '',
                    golCasa: '',
                    golOspite: '',
                    stato: '',
                    risultato: ''
                  });
                  if (fileInputRef.current) fileInputRef.current.value = '';

                } catch (err) {
                  console.error(err);
                  showAlert('error', '❌ Errore durante l\'importazione: ' + err.message);
                }

                setImporting(false);
                setLoading(false);
              };

              const resetFile = () => {
                setFile(null);
                setParsedData([]);
                setPreviewRows([]);
                setColumns([]);
                setMapping({
                  campionato: '',
                  giornata: '',
                  data: '',
                  ora: '',
                  squadraCasa: '',
                  squadraOspite: '',
                  golCasa: '',
                  golOspite: '',
                  stato: '',
                  risultato: ''
                });
                if (fileInputRef.current) fileInputRef.current.value = '';
              };

              return ( <

            const HomeWidget = ({ matches, onSelectMatch, setTab, selectedFamiglie }) => {

                const rounded = Math.round(value);

                return < span className = { `giocata-pct ${cls}` } > { rounded } % < /span>;
              };

              const getGiocateDelGiorno = () => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const weekend = new Date(today);
                weekend.setDate(weekend.getDate() + 2);
                let targetMatches = matches.filter(m => {
                  if (m.stato !== 'Futura') return false;
                  const matchDate = parseDate(m.data);
                  matchDate.setHours(0, 0, 0, 0);
                  if (selectedDay === 'oggi') return matchDate.getTime() === today.getTime();
                  if (selectedDay === 'domani') return matchDate.getTime() === tomorrow.getTime();
                  return matchDate >= today && matchDate <= weekend;
                });
                return targetMatches.map(m => {
                  const stats = computeMatchStats(m, matches);
                  if (stats.error) return { ...m, score: 0, giocate: [] };

                  stats._allMatches = matches;
                  stats._homeTeam = m.casa;
                  stats._awayTeam = m.ospiti;

                  const homeMG = stats.homeMG || {};
                  const awayMG = stats.awayMG || {};
                  const mgTot = stats.mgTot || {};
                  const homeRange = getMultigolRange(m.casa, matches);
                  const awayRange = getMultigolRange(m.ospiti, matches);

                  const giocate = [];

                  selectedFamiglie.forEach(familyId => {
                    const best = getBestBetForFamily(familyId, stats, homeRange, awayRange, homeMG, awayMG,
                      mgTot);
                    if (best && best.pct > 0) {
                      giocate.push({
                        familyId,
                        label: best.label,
                        pct: best.pct,
                        isBomb: best.pct >= 90
                      });
                    }
                  });

                  giocate.sort((a, b) => b.pct - a.pct);
                  const score = giocate.length > 0 ? Math.round(giocate.reduce((s, g) => s + g.pct, 0) / giocate
                    .length) : 0;

                  return { ...m, score, giocate: giocate.slice(0, 3) };
                }).filter(m => m.score > 0 && m.giocate.length > 0).sort((a, b) => b.score - a.score).slice(0, 5);
              };

              const giocateDelGiorno = getGiocateDelGiorno();
              if (giocateDelGiorno.length === 0) {
                return ( <

                  <

                  const deduplicateMatches = (matches) => {

                    matches.forEach(m => {
                      const campionato = (m.campionato || '').trim();
                      const data = m.data || '';
                      const casa = (m.casa || '').trim();
                      const ospiti = (m.ospiti || '').trim();
                      const key = `${campionato}|${data}|${casa}|${ospiti}`;
                      if (!seen.has(key)) {
                        seen.set(key, m);
                        result.push(m);
                      } else {
                        const existing = seen.get(key);
                        const existingScore = (existing.golCasa !== undefined && existing.golOspite !== undefined) ? 1 :
                          0;
                        const newScore = (m.golCasa !== undefined && m.golOspite !== undefined) ? 1 : 0;
                        if (newScore > existingScore) {
                          seen.set(key, m);
                          const idx = result.indexOf(existing);
                          if (idx !== -1) result[idx] = m;
                        } else if (newScore === existingScore) {
                          if (m.stato === 'Giocata' && existing.stato !== 'Giocata') {
                            seen.set(key, m);
                            const idx = result.indexOf(existing);
                            if (idx !== -1) result[idx] = m;

                      }
                    });

                                      span style = { { fontWeight: 'bold' } } > Anteprima: < /span> Questo è un testo di esempio alla dimensione < b > { fontSize } % < /b></div >
                                      <
                                      /div> <
                                      /div> <
                                      /div>
                                    )
                                  } {
                                    settingsTab === 'Città Meteo' && ( <
                                      div >
                                      <
                                      CittaMeteo matches = { matches }
                                      /> <
                                      /div>
                                    )
                                  } {
                                    settingsTab === 'Visuale' && ( <
                                      div className = "card" >
                                      <
                                      h3 style = { { marginBottom: '12px' } } > 📱 Cambia Visuale < /h3> <
                                      div style = { { display: 'flex', gap: '16px', flexWrap: 'wrap' } } >
                                      <
                                      button className = { `btn ${viewMode === 'pc' ? '' : 'btn-secondary'}` }
                                      onClick = {
                                        () => {
                                          setViewMode('pc');
                                          localStorage.setItem('ft_view_mode', 'pc');
                                          setTimeout(() => window.scrollTo(0, 0), 100);
                                        } }
                                      style = { { flex: 1, minWidth: '120px' } } >
                                      🖥️ PC <
                                      /button> <
                                      button className = { `btn ${viewMode === 'mobile' ? '' : 'btn-secondary'}` }
                                      onClick = {
                                        () => {
                                          setViewMode('mobile');
                                          localStorage.setItem('ft_view_mode', 'mobile');
                                          setTimeout(() => window.scrollTo(0, 0), 100);
                                        } }
                                      style = { { flex: 1, minWidth: '120px' } } >
                                      📱 Telefono <
                                      /button> <
                                      /div> <
                                      div style = { { marginTop: '12px', fontSize: '13px', color: 'var(--text-muted)' } } >
                                      Modalità attuale: < b > { viewMode === 'pc' ? '🖥️ PC' : '📱 Telefono' } < /b> <
                                      /div> <
                                      div style = { { marginTop: '8px', fontSize: '12px', color: 'var(--text-muted)' } } >
                                      { viewMode === 'mobile' ?
                                        '✅ La visuale è ottimizzata per schermi piccoli. Il contenuto si adatta automaticamente.' :
                                        '✅ Visuale ottimizzata per schermi grandi. Massima visibilità dei dati.' } <
                                      /div> <
                                      /div>
                                    )
                                  } <
                                  /div>
                                )
                              } <
                              /div>

                              <
                              div className = "disclaimer-footer" >
                              <
                              div style = { { display: 'flex', gap: '12px', alignItems: 'flex-start', flexWrap: 'wrap' } } >
                              <
                              span style = { { fontSize: '24px' } } > ⚠️ < /span> <
                              div style = { { flex: 1 } } >
                              <
                              p style = { { margin: '0 0 6px 0' } } >
                              <
                              strong > ⚠️ Disclaimer - Utilizzo in Centro Scommesse < /strong> <
                              /p> <
                              p style = { { margin: '0 0 4px 0' } } >
                              Questa applicazione fornisce analisi statistiche a < strong > solo scopo informativo <
                              /strong> . I dati provengono da < strong > file caricati dall 'utente</strong> (XLSX/CSV). Le percentuali e i pronostici sono < strong > elaborazioni matematiche non vincolanti < /strong>. <
                              /p> <
                              p style = { { margin: '0 0 4px 0' } } >
                              <
                              span className = "highlight" > ⚠️ Le scommesse comportano rischi finanziari.Gioca
                              responsabilmente. < /span> <
                              /p> <
                              p style = { { margin: '0', fontSize: '10px', color: 'var(--text-muted)' } } >
                              I loghi e i nomi delle squadre sono di proprietà dei rispettivi titolari.L 'uso commerciale dei dati richiede licenza specifica. <
                              /p> <
                              /div> <
                              /div> <
                              /div>

                              <
                              button className = "home-btn-overlay"
                              onClick = {
                                () => {
                                  window.scrollTo({ top: 0, behavior: 'smooth' });
                                } }
                              title = "Torna su" >
                              🏠 <
                              /button> <
                              /div>
                            );
                          };

                          // ============================================================
                          // RENDER FINALE
                          // ============================================================

                          if (viewMode === 'mobile') {
                            return ( <
                              div style = { { display: 'flex', justifyContent: 'center', alignItems: 'flex-start',
                                  padding: '20px', minHeight: '100vh', background: '#0a0a1a' } } >
                              <
                              div className = "phone-simulator" >
                              <
                              div className = "phone-notch" >
                              <
                              div className = "notch-speaker" > < /div> <
                              div className = "notch-camera" > < /div> <
                              /div> <
                              div className = "phone-screen" >
                              <
                              div className = "phone-scroll"
                              style = { { paddingTop: '32px' } } >
                              { renderAppContent() } <
                              /div> <
                              div className = "phone-home-indicator" > < /div> <
                              /div> <
                              /div> <
                              /div>
                            );
                          }

                          return renderAppContent();
                        }

                        // ============================================================
                        // AVVIA APP
                        // ============================================================

                        console.log('🚀 Avvio GesssAI-Pro - Caricamento da Excel...');

                        // Svuota localStorage all'avvio per forzare il caricamento
                        localStorage.removeItem('ft_matches');
                        localStorage.removeItem('ft_champs');

                        // Carica il file Excel
                        loadScrapedData(true).then(data => {
                          if (data && data.matches && data.matches.length > 0) {
                            console.log(`✅ ${data.matches.length} partite caricate all'avvio!`);
                            if (window.updateAppData) {
                              window.updateAppData(data);
                            }
                          } else {
                            console.warn('⚠️ Nessun dato caricato.');
                            // Mostra un messaggio all'utente
                            const root = document.getElementById('root');
                            if (root) {
                              root.innerHTML = `
                                <div style="text-align: center; padding: 50px; color: #e6edf3; background: #0f1419; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                                  <div style="font-size: 64px; margin-bottom: 20px;">📂</div>
                                  <h2 style="color: #f39c12;">Caricamento dati...</h2>
                                  <p style="color: #8b949e; max-width: 500px; margin: 20px auto;">
                                    Il file <strong style="color: #e6edf3;">GesssAI_Input.xlsx</strong> non è stato trovato.
                                  </p>
                                  <p style="color: #8b949e; font-size: 14px;">
                                    Il file deve contenere le colonne: <br>
                                    <strong style="color: #e6edf3;">Campionato, Data, Squadra Casa, Squadra Ospite</strong>
                                  </p>
                                  <button onclick="window.location.reload()" style="margin-top: 20px; padding: 12px 30px; background: #f39c12; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">
                                    🔄 Ricarica
                                  </button>
                                </div>
                              `;
                            }
                          }
                        });

                        // Avvia React con try-catch per gestire errori
                        try {
                          const rootElement = document.getElementById('root');
                          if (rootElement) {
                            ReactDOM.createRoot(rootElement).render( < App / > );
                          }
                        } catch (e) {
                          console.error('Errore durante il rendering React:', e);
                          const errorContainer = document.getElementById('error-container');
                          const errorMsg = document.getElementById('error-message-text');
                          const errorStack = document.getElementById('error-stack-text');
                          const splash = document.getElementById('splashscreen');
                          const root = document.getElementById('root');

                          if (errorContainer) {
                            errorContainer.classList.add('visible');
                            if (errorMsg) {
                              errorMsg.textContent = e.message || 'Errore durante il rendering dell\'applicazione.';
                            }
                            if (errorStack) {
                              errorStack.textContent = e.stack || 'Nessun dettaglio disponibile.';
                            }
                          }
                          if (splash) splash.style.display = 'none';
                          if (root) root.style.display = 'none';
                        }
  </script>
</body>
</html>
