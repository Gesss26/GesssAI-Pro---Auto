<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>GesssAI-Pro v3.0 - Football Trader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="text/javascript" src="meteo.js"></script>
<script src="filtri-campionati.js"></script>
<script type="text/babel" src="schedina.js"></script>
<script type="text/babel" src="home.js"></script>
<script type="text/babel" src="impostazioni.js"></script>
<script type="text/babel" src="palinsesto.js"></script>
<script type="text/babel" src="statistiche.js"></script>
<script type="text/babel" src="storico.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2028;
    --card: #232b36;
    --banner: #2c3642;
    --text: #e6edf3;
    --text-muted: #ffff00;
    --accent: #f39c12;
    --accent2: #e67e22;
    --border: #30363d;
    --win: #6fcf97;
    --draw: #f2c94c;
    --lose: #eb5757;
    --tab-active: #f39c12;
    --pct-rosso: #eb5757;
    --pct-neutro: #8b949e;
    --pct-verde: #6fcf97;
    --pct-oro: #f39c12;
    --xG-red: #eb5757;
    --xG-white: #8b949e;
    --xG-blue: #3498db;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }

  #splashscreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0e1a; display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 99999; transition: opacity 0.8s ease, transform 0.8s ease; padding: 20px;
  }
  #splashscreen.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
  #splashscreen .splash-content { display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 90vw; max-height: 90vh; text-align: center; }
  #splashscreen .splash-logo { max-width: 80vw; max-height: 60vh; width: auto; height: auto; object-fit: contain; border: none !important; border-radius: 0 !important; box-shadow: none !important; outline: none !important; margin-bottom: 40px; background: transparent; }
  #splashscreen .splash-btn {
    padding: 16px 50px; background: linear-gradient(135deg, #f7dc6f, #f39c12, #e67e22);
    color: #000; font-weight: 700; font-size: 20px; border: none; border-radius: 50px;
    cursor: pointer; transition: all 0.3s ease;
    box-shadow: 0 4px 30px rgba(243, 156, 18, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    letter-spacing: 2px; text-transform: uppercase; position: relative; overflow: hidden;
  }
  #splashscreen .splash-btn::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transform: rotate(45deg); transition: all 0.5s ease;
  }
  #splashscreen .splash-btn:hover { transform: scale(1.05); box-shadow: 0 6px 40px rgba(243, 156, 18, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  #splashscreen .splash-btn:hover::before { left: 100%; }
  #splashscreen .splash-btn:active { transform: scale(0.95); }
  #splashscreen .splash-sub { margin-top: 20px; color: #8b949e; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; font-weight: 300; }
  #splashscreen .loader { margin-top: 25px; display: flex; gap: 8px; align-items: center; justify-content: center; }
  #splashscreen .loader .dot { width: 10px; height: 10px; border-radius: 50%; background: #f39c12; animation: pulse 1.4s ease-in-out infinite; }
  #splashscreen .loader .dot:nth-child(2) { animation-delay: 0.2s; }
  #splashscreen .loader .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
  @media (max-width: 768px) {
    #splashscreen .splash-logo { max-width: 90vw; max-height: 50vh; margin-bottom: 30px; }
    #splashscreen .splash-btn { padding: 14px 35px; font-size: 17px; }
    #splashscreen .splash-sub { font-size: 11px; }
    #splashscreen .loader .dot { width: 8px; height: 8px; }
  }
  @media (max-width: 480px) {
    #splashscreen .splash-logo { max-width: 95vw; max-height: 40vh; margin-bottom: 25px; }
    #splashscreen .splash-btn { padding: 12px 28px; font-size: 15px; letter-spacing: 1px; }
    #splashscreen .splash-sub { font-size: 10px; letter-spacing: 2px; }
  }

  #root { display: none; min-height: 100vh; background: var(--bg); }
  #root.visible { display: block !important; }

  #error-container { display: none; min-height: 100vh; background: #0f1419; color: #e6edf3; padding: 40px 20px; text-align: center; justify-content: center; align-items: center; flex-direction: column; }
  #error-container.visible { display: flex !important; }
  #error-container h2 { color: #f39c12; margin-bottom: 16px; }
  #error-container .error-icon { font-size: 64px; margin-bottom: 20px; }
  #error-container .error-msg { color: #8b949e; max-width: 600px; margin: 0 auto 20px; line-height: 1.6; }
  #error-container .error-details { background: #1a2028; padding: 16px 20px; border-radius: 8px; border: 1px solid #30363d; max-width: 700px; margin: 0 auto 20px; text-align: left; font-size: 13px; color: #8b949e; overflow: auto; max-height: 300px; }
  #error-container .error-details code { color: #e6edf3; font-family: monospace; font-size: 12px; word-break: break-all; }
  #error-container .btn-retry { padding: 12px 30px; background: #f39c12; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.3s; }
  #error-container .btn-retry:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(243, 156, 18, 0.4); }

  .giocata-pct { display: inline-block; font-weight: bold; font-size: 14px; padding: 2px 10px; border-radius: 6px; color: #000 !important; }
  .giocata-pct.flag-red { background: #eb5757; color: #000 !important; }
  .giocata-pct.flag-white { background: #8b949e; color: #000 !important; }
  .giocata-pct.flag-green { background: #6fcf97; color: #000 !important; }
  .giocata-pct.flag-bomb { background: #f39c12; color: #000 !important; animation: bomb-glow 1s infinite alternate; box-shadow: 0 0 15px rgba(243, 156, 18, 0.4); }

  .detail-stat-box { padding: 8px 12px; border-radius: 8px; text-align: center; border: 1px solid var(--border); background: var(--surface); transition: background 0.2s, transform 0.1s; min-width: 60px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .detail-stat-box:hover { transform: scale(1.02); }
  .detail-stat-box .label { display: block; font-size: 14px; font-weight: 600; color: #ffff00; margin-bottom: 2px; }
  .detail-stat-box .value { display: block; font-size: 20px; font-weight: bold; }
  .detail-stat-box .bomb-icon { display: inline-block; font-size: 20px; animation: bomb-bounce 0.8s infinite ease-in-out; transform-origin: center; margin-left: 4px; }
  .detail-stat-box.flag-red { background: #eb5757; }
  .detail-stat-box.flag-red .value { color: #000; }
  .detail-stat-box.flag-white { background: #8b949e; }
  .detail-stat-box.flag-white .value { color: #000; }
  .detail-stat-box.flag-green { background: #6fcf97; }
  .detail-stat-box.flag-green .value { color: #000; }
  .detail-stat-box.flag-bomb { background: #f39c12; animation: bomb-glow 1s infinite alternate; }
  .detail-stat-box.flag-bomb .value { color: #000; }

  .xg-value { display: inline-block; padding: 2px 10px; border-radius: 6px; font-weight: bold; font-size: 13px; color: #000 !important; }
  .xg-value.xg-red { background: #eb5757; color: #000 !important; }
  .xg-value.xg-white { background: #8b949e; color: #000 !important; }
  .xg-value.xg-blue { background: #3498db; color: #000 !important; }

  @keyframes bomb-glow { 0% { box-shadow: 0 0 8px rgba(243, 156, 18, 0.4); } 50% { box-shadow: 0 0 25px rgba(243, 156, 18, 0.8); transform: scale(1.05); } 100% { box-shadow: 0 0 8px rgba(243, 156, 18, 0.4); } }
  .bomb-icon { display: inline-block; font-size: 18px; margin-left: 4px; animation: bomb-bounce 0.8s infinite ease-in-out; transform-origin: center; }
  @keyframes bomb-bounce { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1) rotate(0deg); } }

  .pct-rosso { color: var(--pct-rosso) !important; font-weight: bold; }
  .pct-neutro { color: var(--pct-neutro) !important; font-weight: bold; }
  .pct-verde { color: var(--pct-verde) !important; font-weight: bold; }
  .pct-oro { color: var(--pct-oro) !important; font-weight: bold; text-shadow: 0 0 10px rgba(243, 156, 18, 0.3); }

  .multigol-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #000; margin: 0 2px; }
  .multigol-badge.range-01 { background: #8b949e; }
  .multigol-badge.range-02 { background: #f2c94c; }
  .multigol-badge.range-13 { background: #6fcf97; }
  .multigol-badge.range-24 { background: #f39c12; }
  .multigol-badge.range-25 { background: #e67e22; }
  .multigol-badge.range-36 { background: #eb5757; }
  .multigol-badge.range-default { background: var(--accent); }

  .header { background: var(--banner); padding: 16px 24px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; gap: 16px; position: relative; }
  .header .header-left { position: absolute; left: 24px; display: flex; align-items: center; gap: 16px; }
  .header .header-center { text-align: center; }
  .header .header-center .app-name { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
  .header .header-center .app-name span { display: inline-block; }
  .header .header-center .subtitle { font-size: 12px; color: var(--text-muted); }
  .clock { position: absolute; right: 24px; background: var(--surface); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; color: var(--accent); min-width: 200px; text-align: right; }
  .clock-date { font-size: 12px; color: var(--text-muted); }
  .clock-time { font-size: 16px; color: var(--accent); }

  .tabs-nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs-nav button { flex: 1; min-width: 120px; padding: 14px 12px; background: transparent; color: var(--text-muted); border: none; cursor: pointer; font-size: 14px; border-bottom: 3px solid transparent; transition: all 0.2s; font-weight: 600; white-space: nowrap; }
  .tabs-nav button:hover { color: var(--text); background: var(--card); }
  .tabs-nav button.active { color: var(--accent); border-bottom-color: var(--tab-active); background: var(--card); }

  .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
  .matches-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 1024px) { .matches-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 768px) { .matches-grid { grid-template-columns: 1fr; } }

  .match-tab { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 0; border: 1px solid var(--border); border-left-width: 6px; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; }
  .match-tab:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6); }
  .match-tab .score-badge { position: absolute; top: 10px; right: 12px; background: var(--accent); color: #000; font-weight: bold; font-size: 18px; padding: 2px 10px; border-radius: 20px; border: 2px solid var(--accent2); display: flex; align-items: center; gap: 6px; z-index: 10; }
  .match-tab .score-badge .giocata-pct { font-size: 16px; padding: 0px 4px; background: transparent; }
  .match-tab .score-badge .bomb-inline { font-size: 22px; animation: bomb-bounce 1s infinite ease-in-out; line-height: 1; display: inline-block; }

  .match-tab-history { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 0; border: 1px solid var(--border); border-left-width: 6px; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4); flex: 1; min-width: 300px; max-width: 420px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .match-tab-history:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6); }
  .match-tab-history .teams-row { display: flex; justify-content: space-around; align-items: center; padding: 4px 0; }
  .match-tab-history .score { font-size: 24px; font-weight: bold; padding: 0px 12px; }
  .match-tab-history .score-win { color: var(--win); }
  .match-tab-history .score-draw { color: var(--draw); }
  .match-tab-history .score-loss { color: var(--lose); }

  .teams-row { display: flex; justify-content: space-around; align-items: center; padding: 8px 0; gap: 8px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .team-name { font-weight: bold; font-size: 20px; text-align: center; }
  .vs { font-size: 18px; color: var(--accent); font-weight: bold; padding: 0 8px; flex-shrink: 0; }

  .team-logo { transition: transform 0.2s ease; display: block; border-radius: 4px; }
  .team-logo:hover { transform: scale(1.1); }
  .team-logo-fallback { transition: transform 0.2s ease; display: flex !important; align-items: center; justify-content: center; margin: 0 auto; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); font-weight: bold; color: var(--accent); flex-shrink: 0; line-height: 1; }
  .team-logo-fallback:hover { transform: scale(1.1); }
  .team .team-logo, .team .team-logo-fallback { margin-bottom: 2px; }

  .standings-table .team-name-cell { display: flex !important; align-items: center !important; gap: 8px !important; }
  .standings-table .team-name-cell .team-logo, .standings-table .team-name-cell .team-logo-fallback { flex-shrink: 0; }

  .form-row-compact { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; margin-bottom: 6px; }
  .form-block-compact { text-align: center; padding: 8px 6px; background: var(--surface); border-radius: 6px; }
  .form-block-compact .form-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
  .form-squares { display: flex; justify-content: center; gap: 3px; margin-bottom: 4px; min-height: 20px; }
  .form-square { width: 22px; height: 22px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: #000; }
  .form-square-V { background: var(--win); }
  .form-square-P { background: var(--draw); }
  .form-square-S { background: var(--lose); }
  .form-pct-compact { font-size: 22px; font-weight: bold; color: var(--accent); line-height: 1; }
  .form-bar { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .form-bar-fill { height: 100%; background: linear-gradient(90deg, var(--win), var(--accent)); transition: width 0.3s; }
  .form-diff { text-align: center; font-size: 16px; font-weight: bold; color: var(--text-muted); margin-top: 6px; padding: 4px 8px; background: var(--surface); border-radius: 6px; }
  .form-diff span { font-weight: bold; color: var(--accent); font-size: 18px; }
  .form-xg { display: flex; justify-content: space-around; align-items: center; padding: 4px 0; margin-top: 2px; font-size: 13px; color: var(--text-muted); background: var(--surface); border-radius: 6px; }
  .form-xg .xg-home { color: var(--accent); font-weight: bold; }
  .form-xg .xg-away { color: var(--accent); font-weight: bold; }

  .bet-row-vertical { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .bet-item-vertical { background: var(--surface); padding: 4px 10px; border-radius: 6px; font-size: 12px; border: 1px solid var(--border); text-align: center; display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .bet-item-vertical .bet-label { font-size: 11px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.2px; color: var(--text-muted); flex: 0 0 auto; }
  .bet-item-vertical .bet-value { font-weight: bold; font-size: 13px; color: var(--text); flex: 1; text-align: right; }
  .bet-item-vertical .bet-value .giocata-pct { font-size: 14px; padding: 2px 8px; border-radius: 4px; display: inline-block; }
  .bet-item-vertical.bomb { border-color: var(--accent); background: var(--accent); animation: bomb-glow 1s infinite alternate; }
  .bet-item-vertical.bomb .bet-value { color: #000 !important; }
  .bet-item-vertical.bomb .bet-label { color: #000 !important; }
  .bet-item-vertical .bet-value .combinata-detail { font-size: 10px; line-height: 1.2; text-align: right; color: var(--text-muted); }

  .tab-header { padding: 4px 12px; border-radius: 6px; margin-bottom: 6px; text-align: center; color: #fff; font-weight: bold; font-size: 13px; display: inline-block; }
  .match-info { text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 6px; }

  .standings-table-wrap { overflow-x: auto; }
  .standings-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  .standings-table th { background: var(--surface); color: var(--text-muted); padding: 8px 6px; text-align: left; border-bottom: 2px solid var(--border); font-weight: 600; text-transform: uppercase; font-size: 11px; white-space: nowrap; }
  .standings-table td { padding: 6px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .standings-table tr.highlighted td { background: var(--accent) !important; color: #000 !important; font-weight: bold; }
  .standings-table tr:hover td { background: var(--card); }
  .standings-table .pos { font-weight: bold; color: var(--accent); text-align: center; }
  .standings-table .team-name-cell { display: flex; align-items: center; gap: 8px; }
  .standings-table .team-name-cell .team-name { font-weight: bold; font-size: 13px; }
  .standings-table .num { text-align: center; }
  .standings-table .points { font-weight: bold; color: var(--accent); text-align: center; }

  .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .sub-tabs button { padding: 8px 16px; background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; }
  .sub-tabs button.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .detail-section { margin-bottom: 20px; }
  .detail-section h4 { color: var(--accent); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .detail-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .detail-row .detail-stat-box { flex: 1; min-width: 60px; }

  .opponents-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin: 8px 0; }
  .opponents-col { flex: 1; min-width: 120px; background: var(--surface); padding: 8px; border-radius: 6px; }
  .opponents-col .opp-item { font-size: 12px; padding: 2px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .opponents-col .opp-item:last-child { border-bottom: none; }
  .opp-result-indicator { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  .opp-result-indicator.win { background: var(--win); }
  .opp-result-indicator.draw { background: var(--draw); }
  .opp-result-indicator.loss { background: var(--lose); }
  .opp-form-pct { font-size: 24px; font-weight: bold; color: var(--accent); text-align: center; margin-top: 6px; }
  .opp-form-bar { height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .opp-form-bar-fill { height: 100%; background: linear-gradient(90deg, var(--win), var(--accent)); transition: width 0.3s; }

  .stats-two-col { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
  @media (max-width: 768px) { .stats-two-col { grid-template-columns: 1fr; } }
  .stats-placeholder { text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px; }

  .ai-analysis-box .weather-display { background: var(--card); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; border: 1px solid var(--border); }
  .ai-analysis-box .weather-display .weather-main { display: flex; align-items: center; gap: 12px; }
  .ai-analysis-box .weather-display .weather-icon { font-size: 32px; }
  .ai-analysis-box .weather-display .weather-temp { font-size: 24px; font-weight: bold; color: var(--accent); }
  .ai-analysis-box .weather-display .weather-desc { font-size: 13px; color: var(--text-muted); }
  .ai-analysis-box .weather-display .weather-details { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); }
  @media (max-width: 768px) {
    .ai-analysis-box .weather-display { flex-direction: column; align-items: flex-start; }
    .ai-analysis-box .weather-display .weather-details { flex-wrap: wrap; gap: 8px; }
  }

<body>

  <div id="splashscreen">
    <div class="splash-content">
      <img src="Splashscreen.png" alt="GesssAI-Pro" class="splash-logo" />
      <button class="splash-btn" id="splashBtn">✨ Clikka per continuare</button>
      <div class="splash-sub">v3.0 - Football Trader</div>
      <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <div id="error-container">
    <div class="error-icon">⚠️</div>
    <h2>Errore di caricamento</h2>
    <div class="error-msg">
      Si è verificato un problema durante il caricamento dell'applicazione.<br>
      <span id="error-message-text">Dettagli dell'errore non disponibili.</span>
    </div>
    <div class="error-details" id="error-details-box">
      <code id="error-stack-text">Nessun dettaglio disponibile.</code>
    </div>
    <button class="btn-retry" onclick="window.location.reload()">🔄 Ricarica la pagina</button>
  </div>

  <div id="root"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var splash = document.getElementById('splashscreen');
      var root = document.getElementById('root');
      var btn = document.getElementById('splashBtn');

      if (splash && btn && root) {
        btn.addEventListener('click', function() {
          splash.classList.add('hidden');
          setTimeout(function() {
            splash.style.display = 'none';
            root.style.display = 'block';
            root.classList.add('visible');
          }, 800);
        });
      }
    });

    window.addEventListener('error', function(e) {
      console.error('Errore globale:', e);
      var errorContainer = document.getElementById('error-container');
      var errorMsg = document.getElementById('error-message-text');
      var errorStack = document.getElementById('error-stack-text');
      var root = document.getElementById('root');
      var splash = document.getElementById('splashscreen');
      if (errorContainer) {
        errorContainer.classList.add('visible');
        if (errorMsg) errorMsg.textContent = e.message || 'Errore sconosciuto.';
        if (errorStack) errorStack.textContent = e.stack || e.message || 'Nessun dettaglio.';
        if (splash) splash.style.display = 'none';
        if (root) root.style.display = 'none';
      }
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('Promise rejection:', e);
      var errorContainer = document.getElementById('error-container');
      var errorMsg = document.getElementById('error-message-text');
      var errorStack = document.getElementById('error-stack-text');
      var root = document.getElementById('root');
      var splash = document.getElementById('splashscreen');
      if (errorContainer) {
        errorContainer.classList.add('visible');
        if (errorMsg) errorMsg.textContent = e.reason?.message || 'Errore durante il caricamento.';
        if (errorStack) errorStack.textContent = e.reason?.stack || e.reason?.message || 'Nessun dettaglio.';
        if (splash) splash.style.display = 'none';
        if (root) root.style.display = 'none';
      }
    });
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ============================================================
    // CAMPIONATI ESCLUSI
    // ============================================================

    const CAMPIONATI_ESCLUSI = new Set([
      'Liga Profesional Argentina',
      'Brasileirão Serie A',
      'Chinese Super League',
      'Super League Grecia',
      'Major League Soccer',
    ]);

    const filtraCampionatiEsclusi = (arr) => {
      if (!Array.isArray(arr)) return [];
      return arr.filter(m => !CAMPIONATI_ESCLUSI.has((m.campionato || '').trim()));
    };

    // ============================================================
    // API KEY BSD
    // ============================================================

    const BSD_API_KEY = 'c958a1a97001b982d3a910f974adb315f1f15059';
    const BSD_ODDS_STORAGE_KEY = 'ft_quote_cache';

    // ============================================================
    // MATCHING FUZZY
    // ============================================================

    const normalizzaNomeSquadra = (nome) => {
      if (!nome) return '';
      return nome
        .toString()
        .toLowerCase()
        .replace(/[.\-–_'’]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    };

    const nomiSquadraCorrispondono = (nomeExcel, nomeBSD) => {
      const a = normalizzaNomeSquadra(nomeExcel);
      const b = normalizzaNomeSquadra(nomeBSD);
      if (!a || !b) return false;
      if (a === b) return true;
      if (a.includes(b) || b.includes(a)) return true;
      const paroleA = a.split(' ').filter(p => p.length > 2);
      const paroleB = b.split(' ').filter(p => p.length > 2);
      const comuni = paroleA.filter(p => paroleB.includes(p));
      if (comuni.length >= 2) return true;
      if (comuni.length === 1 && comuni[0].length >= 5) return true;
      return false;
    };

    const normalizzaDataBSD = (dateStr) => {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toISOString().slice(0, 10);
      } catch (e) { return ''; }
    };

    // ============================================================
    // MAPPA MERCATI BSD
    // ============================================================

    const mappaGiocataToBSDMercato = (familyId, giocata) => {
      const map = {
        'fisse:1': { market: '1x2', outcome: 'HOME' },
        'fisse:X': { market: '1x2', outcome: 'DRAW' },
        'fisse:2': { market: '1x2', outcome: 'AWAY' },
        'dc:1X': { market: 'double_chance', outcome: '1X' },
        'dc:12': { market: 'double_chance', outcome: '12' },
        'dc:X2': { market: 'double_chance', outcome: 'X2' },
        'over:Over 1.5': { market: 'over_under_15', outcome: 'over' },
        'over:Over 2.5': { market: 'over_under_25', outcome: 'over' },
        'over:Over 3.5': { market: 'over_under_35', outcome: 'over' },
        'over:Over 4.5': { market: 'over_under_45', outcome: 'over' },
        'under:Under 1.5': { market: 'over_under_15', outcome: 'under' },
        'under:Under 2.5': { market: 'over_under_25', outcome: 'under' },
        'under:Under 3.5': { market: 'over_under_35', outcome: 'under' },
        'under:Under 4.5': { market: 'over_under_45', outcome: 'under' },
        'gg_ng:GG': { market: 'btts', outcome: 'yes' },
        'gg_ng:NG': { market: 'btts', outcome: 'no' },
      };
      return map[`${familyId}:${giocata}`] || null;
    };

    // ============================================================
    // CARICAMENTO QUOTE BSD (VERSIONE CORRETTA)
    // ============================================================

    async function loadQuoteBSD(matches) {
      try {
        if (!matches || matches.length === 0) {
          console.log('💰 BSD: nessuna partita da matchare');
          return null;
        }

        console.log('💰 Caricamento quote BSD...');
        const headers = { 'Authorization': `Token ${BSD_API_KEY}` };

        // Range esteso: da -5 giorni a +30 giorni
        const oggi = new Date();
        const minDate = new Date(oggi.getTime() - 5 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
        const maxDate = new Date(oggi.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
        console.log(`💰 BSD: range richiesto ${minDate} -> ${maxDate}`);

        // 1. Scarica eventi BSD nel range
        let eventsBSD = [];
        let urlEventi = `https://sports.bzzoiro.com/api/v2/events/?date_from=${minDate}&date_to=${maxDate}&limit=200`;
        for (let page = 0; page < 10 && urlEventi; page++) {
          const r = await fetch(urlEventi, { headers });
          if (!r.ok) { console.warn(`BSD events: ${r.status}`); break; }
          const d = await r.json();
          const results = d.results || [];
          eventsBSD.push(...results);
          urlEventi = d.next;
          if (results.length < 200) break;
        }
        console.log(`💰 BSD: ${eventsBSD.length} eventi nel range`);

        // Debug: mostra le date degli eventi scaricati
        const dateUniche = [...new Set(eventsBSD.map(ev => normalizzaDataBSD(ev.event_date || ev.date)).filter(Boolean))].sort();
        console.log(`💰 BSD: date eventi (prime 10):`, dateUniche.slice(0, 10));
        console.log(`💰 BSD: date eventi (ultime 10):`, dateUniche.slice(-10));

        // 2. Match fuzzy (CON CAMPI CORRETTI: home_team, away_team, event_date)
        const matchMap = {};
        for (const m of matches) {
          if (m.stato !== 'Futura') continue;
          if (!m.casa || !m.ospiti || !m.data) continue;

          const dataExcel = normalizzaDataBSD(m.data);
          let trovato = null;
          let bestScore = 0;

          for (const ev of eventsBSD) {
            // ⚠️ BSD usa home_team / away_team / event_date
            const evHome = ev.home_team || ev.home || '';
            const evAway = ev.away_team || ev.away || '';
            const evDate = ev.event_date || ev.date || ev.start_time || '';

            const dataBSD = normalizzaDataBSD(evDate);
            if (dataBSD !== dataExcel) continue;

            const casaMatch = nomiSquadraCorrispondono(m.casa, evHome);
            const ospitiMatch = nomiSquadraCorrispondono(m.ospiti, evAway);
            if (casaMatch && ospitiMatch) {
              let score = 1;
              if (normalizzaNomeSquadra(m.casa) === normalizzaNomeSquadra(evHome)) score += 0.5;
              if (normalizzaNomeSquadra(m.ospiti) === normalizzaNomeSquadra(evAway)) score += 0.5;
              if (score > bestScore) {
                bestScore = score;
                trovato = ev;
              }
            }
          }

          if (trovato) {
            matchMap[m.id] = {
              event_id: trovato.id || trovato.event_id,
              homeBSD: trovato.home_team || trovato.home,
              awayBSD: trovato.away_team || trovato.away,
            };
          }
        }

        const numMatchati = Object.keys(matchMap).length;
        console.log(`💰 BSD: ${numMatchati}/${matches.length} partite matchate`);

        if (numMatchati === 0) {
          console.log('💰 BSD: nessun match trovato, skip download quote');
          localStorage.setItem(BSD_ODDS_STORAGE_KEY, JSON.stringify({}));
          return {};
        }

        // 3. Scarica quote (paginazione estesa)
        const eventIdsSet = new Set(Object.values(matchMap).map(v => v.event_id));
        const allOdds = [];
        let urlOdds = `https://sports.bzzoiro.com/api/v2/odds/?limit=100`;
        for (let page = 0; page < 200 && urlOdds; page++) {
          const r = await fetch(urlOdds, { headers });
          if (!r.ok) { console.warn(`BSD odds: ${r.status}`); break; }
          const d = await r.json();
          const results = d.results || [];
          const filtrate = results.filter(q => eventIdsSet.has(q.event_id));
          allOdds.push(...filtrate);
          urlOdds = d.next;
          if (results.length < 100) break;
        }
        console.log(`💰 BSD: ${allOdds.length} quote trovate per ${eventIdsSet.size} eventi`);

        // 4. Indicizza per event_id + market + outcome
        const cache = {};
        allOdds.forEach(q => {
          const key = `${q.event_id}|${q.market}|${q.outcome}`;
          cache[key] = {
            decimal_odds: q.decimal_odds,
            implied_probability: q.implied_probability,
            bookmaker_count: q.bookmaker_count,
          };
        });

        // 5. Cache per matchId
        const cachePerMatch = {};
        for (const [matchId, info] of Object.entries(matchMap)) {
          cachePerMatch[matchId] = {};
          const possibiliGiocate = [
            ['fisse', ['1', 'X', '2']],
            ['dc', ['1X', '12', 'X2']],
            ['over', ['Over 1.5', 'Over 2.5', 'Over 3.5', 'Over 4.5']],
            ['under', ['Under 1.5', 'Under 2.5', 'Under 3.5', 'Under 4.5']],
            ['gg_ng', ['GG', 'NG']],
          ];
          for (const [familyId, giocate] of possibiliGiocate) {
            for (const g of giocate) {
              const mappa = mappaGiocataToBSDMercato(familyId, g);
              if (!mappa) continue;
              const key = `${info.event_id}|${mappa.market}|${mappa.outcome}`;
              const entry = cache[key];
              if (entry) {
                cachePerMatch[matchId][`${familyId}:${g}`] = {
                  decimal_odds: entry.decimal_odds,
                  implied_probability: entry.implied_probability,
                };
              }
            }
          }
        }

        localStorage.setItem(BSD_ODDS_STORAGE_KEY, JSON.stringify(cachePerMatch));
        console.log(`✅ Cache quote BSD salvata: ${Object.keys(cachePerMatch).length} partite con quote`);
        return cachePerMatch;
      } catch (e) {
        console.error('❌ Errore caricamento quote BSD:', e);
        return null;
      }
    }

    window.getQuotaForGiocata = function(matchId, familyId, giocata) {
      try {
        const cache = JSON.parse(localStorage.getItem(BSD_ODDS_STORAGE_KEY) || '{}');
        const perMatch = cache[matchId];
        if (!perMatch) return null;
        return perMatch[`${familyId}:${giocata}`] || null;
      } catch (e) {
        return null;
      }
    };

    window.getBSDInfoForMatch = function(matchId) {
      try {
        const cache = JSON.parse(localStorage.getItem(BSD_ODDS_STORAGE_KEY) || '{}');
        return cache[matchId] || null;
      } catch (e) {
        return null;
      }
    };

    // ============================================================
    // CARICAMENTO DATI
    // ============================================================

    let dataLoaded = false;

    async function loadScrapedData(forceReload = false) {
      console.log('📂 Caricamento dati da Excel...');
      try {
        if (forceReload) {
          localStorage.removeItem('ft_matches');
          localStorage.removeItem('ft_champs');
        }

        const paths = [
          '/GesssAI-Pro---Auto/excel/GesssAI_Input.xlsx',
          '/excel/GesssAI_Input.xlsx',
          'https://gesss26.github.io/GesssAI-Pro---Auto/excel/GesssAI_Input.xlsx'
        ];

        let excelData = null;
        for (const path of paths) {
          try {
            console.log('📂 Tentativo:', path);
            const response = await fetch(path);
            if (response.ok) {
              console.log('✅ File Excel trovato!');
              const arrayBuffer = await response.arrayBuffer();
              excelData = processExcelData(arrayBuffer);
              if (excelData) break;
            }
          } catch (e) {
            console.warn('❌ Errore:', e.message);
          }
        }

        if (excelData) return excelData;

        console.log('📂 Fallback JSON...');
        const jsonPaths = [
          '/GesssAI-Pro---Auto/data/matches.json',
          '/data/matches.json',
          'https://gesss26.github.io/GesssAI-Pro---Auto/data/matches.json'
        ];
        for (const path of jsonPaths) {
          try {
            const response = await fetch(path);
            if (response.ok) {
              const data = await response.json();
              console.log('✅ JSON caricato:', data.matches?.length || 0, 'partite');
              if (data.matches) {
                const filteredMatches = filtraCampionatiEsclusi(data.matches);
                const filteredChamps = (data.championships || []).filter(c => !CAMPIONATI_ESCLUSI.has(c.name));
                localStorage.setItem('ft_matches', JSON.stringify(filteredMatches));
                localStorage.setItem('ft_champs', JSON.stringify(filteredChamps));
                dataLoaded = true;
                return { matches: filteredMatches, championships: filteredChamps };
              }
            }
          } catch (e) {
            console.warn('❌ JSON fallback:', e.message);
          }
        }
        return null;
      } catch (error) {
        console.error('❌ Errore:', error.message);
        return null;
      }
    }

    function processExcelData(arrayBuffer) {
      try {
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
        if (jsonData.length === 0) return null;

        console.log('✅ Excel caricato con', jsonData.length, 'righe');

        const matches = [];
        const championshipsSet = new Set();
        const headers = Object.keys(jsonData[0]);

        const findColumn = (keywords) => {
          for (const keyword of keywords) {
            const found = headers.find(h => h.toLowerCase().includes(keyword.toLowerCase()));
            if (found) return found;
          }
          return null;
        };

        const colCampionato = findColumn(['campionato', 'league', 'camp', 'championship']);
        const colGiornata = findColumn(['giornata', 'round', 'giorn', 'wk']);
        const colData = findColumn(['data', 'date', 'giorno']);
        const colOra = findColumn(['ora', 'time', 'orario', 'hour']);
        const colCasa = findColumn(['squadra casa', 'home', 'casa', 'home team', 'home_team']);
        const colOspite = findColumn(['squadra ospite', 'away', 'ospite', 'away team', 'away_team']);
        const colGolCasa = findColumn(['gol casa', 'home goals', 'goal casa', 'home_goals']);
        const colGolOspite = findColumn(['gol ospite', 'away goals', 'goal ospite', 'away_goals']);
        const colRisultato = findColumn(['risultato', 'result', 'score', 'ris']);
        const colStato = findColumn(['stato', 'status']);

        if (!colCampionato || !colData || !colCasa || !colOspite) {
          console.error('❌ Colonne obbligatorie non trovate');
          return null;
        }

        jsonData.forEach((row, index) => {
          const campionato = row[colCampionato]?.toString().trim() || 'Sconosciuto';
          const giornata = row[colGiornata]?.toString().trim() || 'N/A';
          const dataRaw = row[colData]?.toString().trim() || '';
          const oraRaw = row[colOra]?.toString().trim() || 'TBD';
          const casa = row[colCasa]?.toString().trim() || '';
          const ospite = row[colOspite]?.toString().trim() || '';
          if (!casa || !ospite) return;

          const dataNormalizzata = normalizeDate(dataRaw);
          if (!dataNormalizzata) return;

          let golCasa = 0, golOspite = 0, stato = 'Futura', risultato = '';

          if (colRisultato && row[colRisultato]) {
            const val = row[colRisultato].toString().trim();
            if (val) {
              const mr = val.match(/(\d+)\s*[-–:.]\s*(\d+)/);
              if (mr) {
                golCasa = parseInt(mr[1], 10);
                golOspite = parseInt(mr[2], 10);
                risultato = `${golCasa}-${golOspite}`;
                stato = 'Giocata';
              }
            }
          }

          if (!risultato && colGolCasa && row[colGolCasa] !== undefined && row[colGolCasa] !== '') {
            golCasa = parseFloat(row[colGolCasa]) || 0;
            if (colGolOspite && row[colGolOspite] !== undefined && row[colGolOspite] !== '') {
              golOspite = parseFloat(row[colGolOspite]) || 0;
              if (golCasa > 0 || golOspite > 0) {
                risultato = `${golCasa}-${golOspite}`;
                stato = 'Giocata';
              }
            }
          }

          if (colStato && row[colStato]) {
            const sv = row[colStato].toString().toLowerCase().trim();
            if (sv === 'giocata' || sv === 'played' || sv === 'finished') stato = 'Giocata';
          }

          matches.push({
            id: Math.random().toString(36).slice(2) + Date.now().toString(36) + index,
            campionato, round: giornata, data: dataNormalizzata, ora: oraRaw, casa, ospiti: ospite, stato,
            golCasa: stato === 'Giocata' ? golCasa : 0,
            golOspite: stato === 'Giocata' ? golOspite : 0,
            risultato: stato === 'Giocata' ? `${golCasa}-${golOspite}` : '',
            citta: 'N/D', _fromExcel: true
          });
          championshipsSet.add(campionato);
        });

        if (matches.length === 0) return null;

        const matchesFiltrati = filtraCampionatiEsclusi(matches);
        const championshipsFiltrati = Array.from(championshipsSet)
          .filter(name => !CAMPIONATI_ESCLUSI.has(name))
          .map(name => ({ name, importedAt: new Date().toISOString() }));

        console.log(`✅ ${matchesFiltrati.length} partite caricate (${championshipsFiltrati.length} campionati)`);

        localStorage.setItem('ft_matches', JSON.stringify(matchesFiltrati));
        localStorage.setItem('ft_champs', JSON.stringify(championshipsFiltrati));
        dataLoaded = true;

        return { matches: matchesFiltrati, championships: championshipsFiltrati };
      } catch (error) {
        console.error('❌ Errore Excel:', error.message);
        return null;
      }
    }

    // ============================================================

    const getChampColor = (champName) => {
      if (!champName) return '#95a5a6';
      for (const [key, color] of Object.entries(CHAMPIONSHIP_COLORS)) {
        if (champName.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(champName.toLowerCase())) return color;
      }
      let hash = 0;
      for (let i = 0; i < champName.length; i++) hash = champName.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 65%, 50%)`;
    };

    const normalizeDate = (dateStr) => {
      if (!dateStr) return null;
      if (typeof dateStr === 'number' || /^\d+$/.test(dateStr.toString().trim())) {
        const serial = parseInt(dateStr.toString().trim());
        const excelEpoch = new Date(1899, 11, 30);
        const date = new Date(excelEpoch.getTime() + serial * 86400000);
        return date.toISOString().slice(0, 10);
      }
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return dateStr;
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
        const parts = dateStr.split('/');
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) return date.toISOString().slice(0, 10);
      } catch (e) {}
      return dateStr;
    };

    const formatDateEU = (dateStr) => {
      if (!dateStr) return 'N/D';
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) return dateStr;
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) {
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y}`;
      }
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
        }
      } catch (e) {}
      return 'N/D';
    };

    const parseDate = (dateStr, timeStr = '00:00') => {
      if (!dateStr) return new Date(0);
      if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return new Date(dateStr + 'T' + (timeStr || '00:00') + ':00');
      if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
        const parts = dateStr.split('/');
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        let hours = 0, minutes = 0;
        if (timeStr && timeStr !== 'TBD' && timeStr !== 'N/D') {
          const tp = timeStr.split(':');
          if (tp.length >= 2) {
            hours = parseInt(tp[0], 10) || 0;
            minutes = parseInt(tp[1], 10) || 0;
          }
        }
        return new Date(year, month, day, hours, minutes);
      }
      try { return new Date(dateStr + ' ' + (timeStr || '00:00')); } catch (e) { return new Date(0); }
    };

    const getTodayStr = () => new Date().toISOString().slice(0, 10);
    const addDaysToDateStr = (dateStr, days) => {
      const date = new Date(dateStr + 'T00:00:00');
      date.setDate(date.getDate() + days);
      return date.toISOString().slice(0, 10);
    };

    const isDatePassed = (dateStr) => {
      if (!dateStr) return false;
      const normalized = normalizeDate(dateStr);
      if (!normalized) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return new Date(normalized + 'T00:00:00') < today;
    };

    const FAMIGLIE_GIOCATE = {

    const DEFAULT_FAMIGLIE = ['dc_under', 'mg_casa_ospite', 'over'];

    // ============================================================
    // CALCOLI
    // ============================================================

    const calcFormAndStats = (matches, teamName) => {
      const played = matches
        .filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName))
        .sort((a, b) => parseDate(b.data, b.ora) - parseDate(a.data, a.ora))
        .slice(0, 5);
      let form = '', points = 0, golFatti = 0, golSubiti = 0;
      played.forEach(m => {
        const isHome = m.casa === teamName;
        const tg = isHome ? m.golCasa : m.golOspite;
        const og = isHome ? m.golOspite : m.golCasa;
        golFatti += tg; golSubiti += og;
        if (tg > og) { form += 'V'; points += 3; }
        else if (tg === og) { form += 'P'; points += 1; }
        else form += 'S';
      });
      return {
        form: form || '-----',
        pct: played.length ? Math.round((points / (played.length * 3)) * 100) : 50,
        golFatti, golSubiti,
        mediaGolFatti: played.length ? (golFatti / played.length).toFixed(1) : 0,
        mediaGolSubiti: played.length ? (golSubiti / played.length).toFixed(1) : 0,
        partite: played.length
      };
    };

    const computeMatchStats = (match, allMatches) => {
      const homeTeam = match.casa;
      const awayTeam = match.ospiti;
      const homeGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === homeTeam || m.ospiti === homeTeam));
      const awayGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === awayTeam || m.ospiti === awayTeam));
      const allGamesMap = new Map();
      [...homeGames, ...awayGames].forEach(g => { if (!allGamesMap.has(g.id)) allGamesMap.set(g.id, g); });
      const allGames = Array.from(allGamesMap.values());
      const totalGames = allGames.length;
      if (totalGames === 0) return { error: 'Nessuna partita giocata.' };

      let homeWins = 0, homeDraws = 0, homeLosses = 0, homeGoalsScored = 0, homeGoalsConceded = 0;
      homeGames.forEach(g => {
        const isHome = g.casa === homeTeam;
        const tg = isHome ? g.golCasa : g.golOspite;
        const og = isHome ? g.golOspite : g.golCasa;
        homeGoalsScored += tg; homeGoalsConceded += og;
        if (tg > og) homeWins++;
        else if (tg === og) homeDraws++;
        else homeLosses++;
      });

      let awayWins = 0, awayDraws = 0, awayLosses = 0, awayGoalsScored = 0, awayGoalsConceded = 0;
      awayGames.forEach(g => {
        const isHome = g.casa === awayTeam;
        const tg = isHome ? g.golCasa : g.golOspite;
        const og = isHome ? g.golOspite : g.golCasa;
        awayGoalsScored += tg; awayGoalsConceded += og;
        if (tg > og) awayWins++;
        else if (tg === og) awayDraws++;
        else awayLosses++;
      });

      const p1 = totalGames > 0 ? ((homeWins + awayLosses) / totalGames) * 100 : 0;
      const pX = totalGames > 0 ? ((homeDraws + awayDraws) / totalGames) * 100 : 0;
      const p2 = totalGames > 0 ? ((homeLosses + awayWins) / totalGames) * 100 : 0;
      const p1X = totalGames > 0 ? ((homeWins + homeDraws) / totalGames) * 100 : 0;
      const p12 = totalGames > 0 ? ((homeWins + awayWins) / totalGames) * 100 : 0;
      const pX2 = totalGames > 0 ? ((homeLosses + awayWins) / totalGames) * 100 : 0;

      const allGamesForGoals = [...homeGames, ...awayGames];
      const goalTotals = allGamesForGoals.map(g => g.golCasa + g.golOspite);
      const thresholds = [1.5, 2.5, 3.5, 4.5];
      const underOver = thresholds.map(t => {
        const over = goalTotals.filter(gt => gt > t).length / goalTotals.length * 100;
        return { threshold: t, under: 100 - over, over };
      });

      const getMultigolV2 = (team, games) => {
        const goals = games.map(g => (g.casa === team) ? g.golCasa : g.golOspite);
        const total = goals.length;
        if (total === 0) return { '0-1': 0, '0-2': 0, '1-3': 0, '2-5': 0 };
        const count = (pred) => goals.filter(pred).length / total * 100;
        return {
          '0-1': count(g => g <= 1),
          '0-2': count(g => g <= 2),
          '1-3': count(g => g >= 1 && g <= 3),
          '2-5': count(g => g >= 2 && g <= 5)
        };
      };

      const homeMG = getMultigolV2(homeTeam, homeGames);
      const awayMG = getMultigolV2(awayTeam, awayGames);
      const totalGoals = allGamesForGoals.map(g => g.golCasa + g.golOspite);
      const mgTot = {
        '1-4': totalGoals.filter(g => g >= 1 && g <= 4).length / totalGoals.length * 100,
        '2-4': totalGoals.filter(g => g >= 2 && g <= 4).length / totalGoals.length * 100,
        '2-5': totalGoals.filter(g => g >= 2 && g <= 5).length / totalGoals.length * 100,
        '3-6': totalGoals.filter(g => g >= 3 && g <= 6).length / totalGoals.length * 100,
      };

      return {
        p1, pX, p2, p1X, p12, pX2, underOver, homeMG, awayMG, mgTot, homeGames, awayGames,
        homeStats: { wins: homeWins, draws: homeDraws, losses: homeLosses, goalsScored: homeGoalsScored, goalsConceded: homeGoalsConceded, played: homeGames.length },
        awayStats: { wins: awayWins, draws: awayDraws, losses: awayLosses, goalsScored: awayGoalsScored, goalsConceded: awayGoalsConceded, played: awayGames.length },
        totalGames
      };
    };

    const get12Under45 = (allMatches, homeTeam, awayTeam) => {
      const homeGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === homeTeam || m.ospiti === homeTeam));
      const awayGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === awayTeam || m.ospiti === awayTeam));
      const allGames = [...homeGames, ...awayGames];
      const uniqueGames = Array.from(new Map(allGames.map(g => [g.id, g])).values());
      if (!uniqueGames.length) return 0;
      const count = uniqueGames.filter(g => {
        const total = g.golCasa + g.golOspite;
        return g.golCasa !== g.golOspite && total < 4.5;
      }).length;
      return (count / uniqueGames.length) * 100;
    };

    const getMultigolRange = (teamName, allMatches) => {
      const matches = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName));
      if (matches.length === 0) return { label: 'N/A', pct: 0, range: 'default', details: [] };
      const goals = matches.map(m => (m.casa === teamName) ? m.golCasa : m.golOspite);
      const total = goals.length;
      const r01 = goals.filter(g => g <= 1).length / total * 100;
      const r02 = goals.filter(g => g <= 2).length / total * 100;
      const r13 = goals.filter(g => g >= 1 && g <= 3).length / total * 100;
      const r24 = goals.filter(g => g >= 2 && g <= 4).length / total * 100;
      const r25 = goals.filter(g => g >= 2 && g <= 5).length / total * 100;
      const r36 = goals.filter(g => g >= 3 && g <= 6).length / total * 100;
      const ranges = [
        { label: '0-1', pct: r01, range: '01' },
        { label: '0-2', pct: r02, range: '02' },
        { label: '1-3', pct: r13, range: '13' },
        { label: '2-4', pct: r24, range: '24' },
        { label: '2-5', pct: r25, range: '25' },
        { label: '3-6', pct: r36, range: '36' },
      ];
      const best = ranges.reduce((a, b) => a.pct > b.pct ? a : b);
      return { label: best.label, pct: Math.round(best.pct), range: best.range, details: ranges.map(r => ({ ...r, pct: Math.round(r.pct) })) };
    };

    const getGiocataPct = (giocata, stats, homeMG, awayMG, mgTot) => {
      if (stats.error) return 0;
      const { p1, pX, p2, p1X, p12, pX2, underOver } = stats;

      if (giocata === '1') return Math.round(p1);
      if (giocata === 'X') return Math.round(pX);
      if (giocata === '2') return Math.round(p2);
      if (giocata === '1X') return Math.round(p1X);
      if (giocata === '12') return Math.round(p12);
      if (giocata === 'X2') return Math.round(pX2);

      if (giocata === 'Over 1.5') return Math.round(underOver[0]?.over || 0);
      if (giocata === 'Over 2.5') return Math.round(underOver[1]?.over || 0);
      if (giocata === 'Over 3.5') return Math.round(underOver[2]?.over || 0);
      if (giocata === 'Over 4.5') return Math.round(underOver[3]?.over || 0);
      if (giocata === 'Under 1.5') return Math.round(underOver[0]?.under || 0);
      if (giocata === 'Under 2.5') return Math.round(underOver[1]?.under || 0);
      if (giocata === 'Under 3.5') return Math.round(underOver[2]?.under || 0);
      if (giocata === 'Under 4.5') return Math.round(underOver[3]?.under || 0);

      if (giocata === '0-2') return Math.round(homeMG['0-2'] || 0);
      if (giocata === '1-3') return Math.round(homeMG['1-3'] || 0);
      if (giocata === '1-4') return Math.round(mgTot['1-4'] || 0);
      if (giocata === '2-5') return Math.round(mgTot['2-5'] || 0);

      if (giocata.startsWith('1X+O')) { const over = giocata.replace('1X+O', 'Over '); return Math.round((p1X + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('12+O')) { const over = giocata.replace('12+O', 'Over '); return Math.round((p12 + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('X2+O')) { const over = giocata.replace('X2+O', 'Over '); return Math.round((pX2 + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('1X+U')) { const u = giocata.replace('1X+U', 'Under '); return Math.round((p1X + getGiocataPct(u, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('12+U')) { const u = giocata.replace('12+U', 'Under '); return Math.round((p12 + getGiocataPct(u, stats, homeMG, awayMG, mgTot)) / 2); }
      if (giocata.startsWith('X2+U')) { const u = giocata.replace('X2+U', 'Under '); return Math.round((pX2 + getGiocataPct(u, stats, homeMG, awayMG, mgTot)) / 2); }

      if (giocata.includes('+') && !giocata.includes('X') && !giocata.includes('O') && !giocata.includes('U')) {
        const parts = giocata.split('+');
        let pct1 = 0;
        if (parts[0] === '0-1') pct1 = homeMG['0-1'] || 0;
        else if (parts[0] === '0-2') pct1 = homeMG['0-2'] || 0;
        else if (parts[0] === '1-3') pct1 = homeMG['1-3'] || 0;
        else if (parts[0] === '2-5') pct1 = homeMG['2-5'] || 0;
        let pct2 = 0;
        if (parts[1] === '0-1') pct2 = awayMG['0-1'] || 0;
        else if (parts[1] === '0-2') pct2 = awayMG['0-2'] || 0;
        else if (parts[1] === '1-3') pct2 = awayMG['1-3'] || 0;
        else if (parts[1] === '2-5') pct2 = awayMG['2-5'] || 0;
        return Math.round((pct1 + pct2) / 2);
      }

      if (giocata.startsWith('1X+') && !giocata.includes('O') && !giocata.includes('U')) {
        const mg = giocata.replace('1X+', '');
        let pctMG = 0;
        if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
        else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
        else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
        else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
        return Math.round((p1X + pctMG) / 2);
      }
      if (giocata.startsWith('12+') && !giocata.includes('O') && !giocata.includes('U')) {
        const mg = giocata.replace('12+', '');
        let pctMG = 0;
        if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
        else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
        else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
        else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
        return Math.round((p12 + pctMG) / 2);
      }
      if (giocata.startsWith('X2+') && !giocata.includes('O') && !giocata.includes('U')) {
        const mg = giocata.replace('X2+', '');
        let pctMG = 0;
        if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
        else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
        else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
        else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
        return Math.round((pX2 + pctMG) / 2);
      }
      return 0;
    };

    const getBestBetForFamily = (familyId, stats, homeRange, awayRange, homeMG, awayMG, mgTot) => {
      if (stats.error) return null;
      const family = FAMIGLIE_GIOCATE[familyId];
      if (!family) return null;

      let best = null, bestPct = -1, bestLabel = '';
      family.options.forEach(opt => {
        let pct = 0, label = opt;

        if (familyId === 'dc_under' && opt === '12+U4.5') {
          pct = Math.round(get12Under45(stats._allMatches, stats._homeTeam, stats._awayTeam) || 0);
        } else if (familyId === 'mg_casa_ospite') {
          const parts = opt.split('+');
          let pct1 = 0;
          if (parts[0] === '0-1') pct1 = homeMG['0-1'] || 0;
          else if (parts[0] === '0-2') pct1 = homeMG['0-2'] || 0;
          else if (parts[0] === '1-3') pct1 = homeMG['1-3'] || 0;
          else if (parts[0] === '2-5') pct1 = homeMG['2-5'] || 0;
          let pct2 = 0;
          if (parts[1] === '0-1') pct2 = awayMG['0-1'] || 0;
          else if (parts[1] === '0-2') pct2 = awayMG['0-2'] || 0;
          else if (parts[1] === '1-3') pct2 = awayMG['1-3'] || 0;
          else if (parts[1] === '2-5') pct2 = awayMG['2-5'] || 0;
          pct = Math.round((pct1 + pct2) / 2);
          label = `${parts[0]}+${parts[1]}`;
        } else {
          pct = getGiocataPct(opt, stats, homeMG, awayMG, mgTot);
        }

        if (pct > bestPct) {
          bestPct = pct; best = opt; bestLabel = label;
        }
      });

      if (best && bestPct > 0) return { giocata: best, label: bestLabel, pct: bestPct, isBomb: bestPct >= 90 };
      return null;
    };

    // ============================================================
    // ESPOSIZIONE GLOBALE
    // ============================================================

    window.computeMatchStats = computeMatchStats;
    window.getGiocataPct = getGiocataPct;
    window.getBestBetForFamily = getBestBetForFamily;
    window.getPercentualeClasse = getPercentualeClasse;
    window.getMultigolRange = getMultigolRange;
    window.calcFormAndStats = calcFormAndStats;
    window.getChampColor = getChampColor;
    window.formatDateEU = formatDateEU;
    window.normalizeDate = normalizeDate;
    window.parseDate = parseDate;
    window.getTodayStr = getTodayStr;
    window.addDaysToDateStr = addDaysToDateStr;
    window.isDatePassed = isDatePassed;
    window.getXgClasse = getXgClasse;
    window.getHeatmapColorClass = getHeatmapColorClass;
    window.FAMIGLIE_GIOCATE = FAMIGLIE_GIOCATE;
    window.DEFAULT_FAMIGLIE = DEFAULT_FAMIGLIE;
    window.TeamLogo = TeamLogo;
    window.THEMES = THEMES;
    window.CHAMPIONSHIP_LIST = CHAMPIONSHIP_LIST;
    window.CHAMPIONSHIP_COLORS = CHAMPIONSHIP_COLORS;
    window.CAMPIONATI_ESCLUSI = CAMPIONATI_ESCLUSI;
    window.filtraCampionatiEsclusi = filtraCampionatiEsclusi;
    window.loadQuoteBSD = loadQuoteBSD;

    console.log('✅ Funzioni globali esposte per i moduli esterni');
    console.log('   - Campionati esclusi:', Array.from(CAMPIONATI_ESCLUSI).join(', '));

    // ============================================================
    // LOAD/SAVE STATE
    // ============================================================

    const loadState = () => {
      try {
        const localData = {
          championships: JSON.parse(localStorage.getItem('ft_champs') || '[]'),
          matches: JSON.parse(localStorage.getItem('ft_matches') || '[]'),
          theme: JSON.parse(localStorage.getItem('ft_theme') || '"Scuro Blu Notte"'),
          customTheme: JSON.parse(localStorage.getItem('ft_custom_theme') || 'null'),
          selectedFamiglie: JSON.parse(localStorage.getItem('ft_selected_famiglie') || '["dc_under","mg_casa_ospite","over"]'),
        };
        localData.matches = filtraCampionatiEsclusi(localData.matches);
        localData.championships = localData.championships.filter(c => !CAMPIONATI_ESCLUSI.has(c.name));

        if (localData.matches.length === 0) {
          loadScrapedData().then(data => {
            if (data && data.matches && data.matches.length > 0 && window.updateAppData) {
              window.updateAppData(data);
            }
          });
        }
        return localData;
      } catch (e) {
        return { championships: [], matches: [], theme: 'Scuro Blu Notte', customTheme: null, selectedFamiglie: ['dc_under', 'mg_casa_ospite', 'over'] };
      }
    };

    const saveState = (data) => {
      localStorage.setItem('ft_champs', JSON.stringify(data.championships));
      localStorage.setItem('ft_matches', JSON.stringify(data.matches));
      localStorage.setItem('ft_theme', JSON.stringify(data.theme));
      localStorage.setItem('ft_custom_theme', JSON.stringify(data.customTheme));
      localStorage.setItem('ft_selected_famiglie', JSON.stringify(data.selectedFamiglie || ['dc_under', 'mg_casa_ospite', 'over']));
    };

    // ============================================================
    // CLOCK
    // ============================================================

    const Clock = () => {
      const [now, setNow] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);
      const formatDate = (d) => {
        const days = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
        const months = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
        return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
      };
      const formatTime = (d) => d.toTimeString().slice(0, 8);
      return (
        <div className="clock">
          <div className="clock-date">{formatDate(now)}</div>
          <div className="clock-time">{formatTime(now)}</div>
        </div>
      );
    };

    // ============================================================
    // APP
    // ============================================================

    function App() {
      const [hasError, setHasError] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      const initial = loadState();
      const [tab, setTab] = useState('Home');
      const [championships, setChampionships] = useState(initial.championships);
      const [matches, setMatches] = useState(initial.matches);
      const [theme, setTheme] = useState(initial.theme);
      const [customTheme, setCustomTheme] = useState(initial.customTheme || THEMES['Scuro Blu Notte']);
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);
      const [weatherCache, setWeatherCache] = useState({});
      const [selectedMatchId, setSelectedMatchId] = useState(null);
      const [viewMode, setViewMode] = useState(() => localStorage.getItem('ft_view_mode') || 'pc');
      const [selectedFamiglie, setSelectedFamiglie] = useState(initial.selectedFamiglie || ['dc_under', 'mg_casa_ospite', 'over']);
      const [fontSize, setFontSize] = useState(() => {
        const saved = localStorage.getItem('ft_font_size');
        return saved ? parseInt(saved) : 100;
      });

      useEffect(() => {
        try {
          const loadData = async () => {
            const data = await loadScrapedData();
            if (data && data.matches && data.matches.length > 0) {
              setMatches(data.matches);
              setChampionships(data.championships || []);
              console.log(`✅ ${data.matches.length} partite caricate!`);
            }
          };
          loadData();
        } catch (e) {
          console.error('Errore caricamento:', e);
          setHasError(true);
          setErrorMessage(e.message);
        }
      }, []);

      const updateDataFromScraper = (data) => {
        if (data && data.matches && data.matches.length > 0) {
          const filteredMatches = filtraCampionatiEsclusi(data.matches);
          const filteredChamps = (data.championships || []).filter(c => !CAMPIONATI_ESCLUSI.has(c.name));
          setMatches(filteredMatches);
          setChampionships(filteredChamps);
          saveState({ championships: filteredChamps, matches: filteredMatches, theme, customTheme, selectedFamiglie });
          showAlert('success', `✅ Aggiornato con ${filteredMatches.length} partite!`);
        }
      };

      window.updateAppData = updateDataFromScraper;

      useEffect(() => { saveState({ championships, matches, theme, customTheme, selectedFamiglie }); },
        [championships, matches, theme, customTheme, selectedFamiglie]);

      useEffect(() => {
        const t = theme === 'Custom' ? customTheme : THEMES[theme] || THEMES['Scuro Blu Notte'];
        const root = document.documentElement;
        Object.entries(t).forEach(([k, v]) => {
          root.style.setProperty(`--${k.replace(/([A-Z])/g, '-$1').toLowerCase()}`, v);
        });
      }, [theme, customTheme]);

      useEffect(() => {
        document.documentElement.style.fontSize = (fontSize / 100 * 16) + 'px';
        localStorage.setItem('ft_font_size', fontSize.toString());
      }, [fontSize]);

      const showAlert = (type, text) => {
        setMessage({ type, text });
        setTimeout(() => setMessage(null), 5000);
      };

      const selectMatch = (matchId) => {
        setSelectedMatchId(matchId);
        setTab('Statistiche');
      };

      const renderAppContent = () => (
        <div>
          <div className="header">
            <div className="header-left"></div>
            <div className="header-center">
              <div className="app-name">
                <span style={{ color: '#e74c3c' }}>G</span>
                <span style={{ color: '#e67e22' }}>e</span>
                <span style={{ color: '#f1c40f' }}>s</span>
                <span style={{ color: '#2ecc71' }}>s</span>
                <span style={{ color: '#3498db' }}>s</span>
                <span style={{ color: '#9b59b6' }}>A</span>
                <span style={{ color: '#e74c3c' }}>I</span>
                <span style={{ color: '#1abc9c' }}>-</span>
                <span style={{ color: '#f39c12' }}>P</span>
                <span style={{ color: '#2ecc71' }}>r</span>
                <span style={{ color: '#e67e22' }}>o</span>
              </div>
              <div className="subtitle">Statistiche & Trading Scommesse v3.0 - 2026</div>
            </div>
            <Clock />
          </div>

          <div className="tabs-nav">
            {MAIN_TABS.map(t => (
              <button key={t} className={tab === t ? 'active' : ''} onClick={() => setTab(t)}>
                {t === 'Home' && '🏠 '}
                {t === 'Palinsesto' && '📅 '}
                {t === 'Statistiche' && '📊 '}
                {t === 'Storico' && '📜 '}
                {t === 'Schedina' && '🎯 '}
                {t === 'Impostazioni' && '⚙️ '}
                {t}
              </button>
            ))}
          </div>

          <div className="container">
            {message && <div className={`alert alert-${message.type}`}>{message.text}</div>}
            {loading && <div className="alert alert-info">⏳ Elaborazione in corso...</div>}

            {tab === 'Home' && (
              <div>
                {window.HomeComponent ? (
                  <window.HomeComponent
                    matches={matches}
                    championships={championships}
                    onSelectMatch={selectMatch}
                    setTab={setTab}
                    selectedFamiglie={selectedFamiglie}
                    weatherCache={weatherCache}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Home... (home.js)</div>
                )}
              </div>
            )}

            {tab === 'Palinsesto' && (
              <div>
                {window.PalinsestoComponent ? (
                  <window.PalinsestoComponent
                    matches={matches}
                    selectedFamiglie={selectedFamiglie}
                    onSelectMatch={selectMatch}
                    weatherCache={weatherCache}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Palinsesto... (palinsesto.js)</div>
                )}
              </div>
            )}

            {tab === 'Statistiche' && (
              <div>
                {window.StatisticheComponent ? (
                  <window.StatisticheComponent
                    matches={matches}
                    selectedMatchId={selectedMatchId}
                    selectedFamiglie={selectedFamiglie}
                    weatherCache={weatherCache}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Statistiche... (statistiche.js)</div>
                )}
              </div>
            )}

            {tab === 'Storico' && (
              <div>
                {window.StoricoComponent ? (
                  <window.StoricoComponent
                    matches={matches}
                    championships={championships}
                    onSelectMatch={selectMatch}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Storico... (storico.js)</div>
                )}
              </div>
            )}

            {tab === 'Schedina' && (
              <div>
                {window.SchedinaComponent ? (
                  <window.SchedinaComponent
                    matches={matches}
                    championships={championships}
                    selectedFamiglie={selectedFamiglie}
                    onSelectMatch={selectMatch}
                    showAlert={showAlert}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Schedina... (schedina.js)</div>
                )}
              </div>
            )}

            {tab === 'Impostazioni' && (
              <div>
                {window.ImpostazioniComponent ? (
                  <window.ImpostazioniComponent
                    matches={matches}
                    setMatches={setMatches}
                    championships={championships}
                    setChampionships={setChampionships}
                    theme={theme}
                    setTheme={setTheme}
                    customTheme={customTheme}
                    setCustomTheme={setCustomTheme}
                    loading={loading}
                    setLoading={setLoading}
                    showAlert={showAlert}
                    viewMode={viewMode}
                    setViewMode={setViewMode}
                    fontSize={fontSize}
                    setFontSize={setFontSize}
                    selectedFamiglie={selectedFamiglie}
                    setSelectedFamiglie={setSelectedFamiglie}
                  />
                ) : (
                  <div className="alert alert-info">⏳ Caricamento Impostazioni... (impostazioni.js)</div>
                )}
              </div>
            )}
          </div>

          <div className="disclaimer-footer">
            <div style={{ display: 'flex', gap: '12px', alignItems: 'flex-start', flexWrap: 'wrap' }}>
              <span style={{ fontSize: '24px' }}>⚠️</span>
              <div style={{ flex: 1 }}>
                <p style={{ margin: '0 0 6px 0' }}>
                  <strong>⚠️ Disclaimer - Utilizzo in Centro Scommesse</strong>
                </p>
                <p style={{ margin: '0 0 4px 0' }}>
                  Questa applicazione fornisce analisi statistiche a <strong>solo scopo informativo</strong>. I dati provengono da <strong>file caricati dall'utente</strong> (XLSX/CSV). Le percentuali e i pronostici sono <strong>elaborazioni matematiche non vincolanti</strong>.
                </p>
                <p style={{ margin: '0 0 4px 0' }}>
                  <span className="highlight">⚠️ Le scommesse comportano rischi finanziari. Gioca responsabilmente.</span>
                </p>
                <p style={{ margin: '0', fontSize: '10px', color: 'var(--text-muted)' }}>
                  I loghi e i nomi delle squadre sono di proprietà dei rispettivi titolari.
                </p>
              </div>
            </div>
          </div>

          <button className="home-btn-overlay" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} title="Torna su">
            🏠
          </button>
        </div>
      );

      if (viewMode === 'mobile') {
        return (
          <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'flex-start', padding: '20px', minHeight: '100vh', background: '#0a0a1a' }}>
            <div className="phone-simulator">
              <div className="phone-notch">
                <div className="notch-speaker"></div>
                <div className="notch-camera"></div>
              </div>
              <div className="phone-screen">
                <div className="phone-scroll" style={{ paddingTop: '32px' }}>
                  {renderAppContent()}
                </div>
                <div className="phone-home-indicator"></div>
              </div>
            </div>
          </div>
        );
      }

      return renderAppContent();
    }

    console.log('🚀 Avvio GesssAI-Pro');

    localStorage.removeItem('ft_matches');
    localStorage.removeItem('ft_champs');
    localStorage.removeItem('ft_quote_cache');

    loadScrapedData(true).then(data => {
      if (data && data.matches && data.matches.length > 0) {
        console.log(`✅ ${data.matches.length} partite caricate all'avvio!`);
        if (window.updateAppData) window.updateAppData(data);
      }
    });

    // ⭐ Carica le quote BSD dopo che le partite sono state caricate
    setTimeout(() => {
      try {
        const matchesSalvati = JSON.parse(localStorage.getItem('ft_matches') || '[]');
        if (matchesSalvati.length > 0) {
          loadQuoteBSD(matchesSalvati).then(cache => {
            if (cache) console.log(`💰 Quote BSD pronte per ${Object.keys(cache).length} partite`);
          });
        } else {
          console.log('💰 BSD: nessuna partita in localStorage, skip');
        }
      } catch (e) {
        console.warn('Errore loadQuoteBSD:', e);
      }
    }, 3000);

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        ReactDOM.createRoot(rootElement).render(<App />);
      }
    } catch (e) {
      console.error('Errore durante il rendering React:', e);
      const errorContainer = document.getElementById('error-container');
      const errorMsg = document.getElementById('error-message-text');
      const errorStack = document.getElementById('error-stack-text');
      const splash = document.getElementById('splashscreen');
      const root = document.getElementById('root');
      if (errorContainer) {
        errorContainer.classList.add('visible');
        if (errorMsg) errorMsg.textContent = e.message || 'Errore durante il rendering.';
        if (errorStack) errorStack.textContent = e.stack || 'Nessun dettaglio disponibile.';
      }
      if (splash) splash.style.display = 'none';
      if (root) root.style.display = 'none';
    }
  </script>
</body>
</html>
